:root{
  /* 한글 폴백 — Rajdhani·Chakra Petch에는 한글 글리프가 없다 */
  --kr:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  --bg:#070a14; --bg2:#0d1224; --panel:#111834; --line:#26305a;
  --ash:#8a93bb; --pale:#eef2ff;
  --gold:#ffd166; --cyan:#4ff0d8; --pink:#ff5c8a; --violet:#a86bff; --orange:#ff9f43;
}
*{box-sizing:border-box;margin:0;padding:0}
/* 드래그가 조작이라 텍스트 선택을 막아야 한다. HUD 글자(LV·점수·신호권)가 DOM으로
   캔버스 위에 떠 있어서, 그 위를 끌면 iOS가 텍스트 선택으로 해석하고 콜아웃 바에
   글쓰기 도구(Writing Tools)가 딸려 나온다. 실제 아이폰에서 판 중에 반복해서 떴다. */
html,body{height:100%;background:var(--bg);color:var(--pale);overflow:hidden;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  font-family:"Rajdhani","Chakra Petch",var(--kr);-webkit-font-smoothing:antialiased}
/* 이름 칸만 예외 — 여기선 선택·편집이 되어야 한다 */
.ident input{-webkit-user-select:text;user-select:text}
canvas{display:block;width:100%;height:100%}
.mono{font-variant-numeric:tabular-nums}
.dis{font-family:"Chakra Petch",var(--kr)}

/* ── 오버레이 ── */
/* align-items:center + overflow-y:auto 는 내용이 화면보다 길 때 위쪽을 잘라먹고
   스크롤로도 못 올라간다. 자식에 margin:auto 를 주는 쪽이 맞다. */
.veil{position:fixed;inset:0;z-index:6;display:flex;align-items:flex-start;justify-content:center;padding:24px;
  background:radial-gradient(120% 90% at 50% 0%,rgba(30,22,70,.92),rgba(7,10,20,.97));
  backdrop-filter:blur(8px);overflow-y:auto}
.veil.off{display:none}
.box{width:100%;max-width:900px;margin:auto;text-align:center}
h1{font-family:"Chakra Petch",var(--kr);font-size:clamp(48px,11vw,92px);font-weight:700;line-height:.92;
  letter-spacing:.04em;background:linear-gradient(180deg,#fff,#ffd166 60%,#ff9f43);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 26px rgba(255,159,67,.35))}
h2{font-family:"Chakra Petch",var(--kr);font-size:clamp(24px,5vw,38px);font-weight:700;letter-spacing:.02em}
p{color:var(--ash);line-height:1.6;font-size:17px;font-weight:500}
/* 자간은 라틴 대문자에만 어울린다. 한글이 섞인 줄에 .3em을 걸면 글자가
   흩어져 보인다 — "아마추어 같다"의 첫째 원인이었다. */
.tag{font-family:"Chakra Petch",var(--kr);font-size:11px;letter-spacing:.08em;color:var(--ash);font-weight:600}
.btn{font:inherit;font-family:"Chakra Petch",var(--kr);font-weight:700;font-size:21px;letter-spacing:.02em;
  color:var(--bg);background:linear-gradient(180deg,#ffe08a,#ffb038);border:none;padding:18px 38px;
  cursor:pointer;border-radius:3px;box-shadow:0 0 0 1px rgba(255,209,102,.5),0 10px 30px -8px rgba(255,176,56,.65);
  transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 0 1px rgba(255,209,102,.8),0 16px 38px -8px rgba(255,176,56,.8)}
.btn.ghost{background:none;color:var(--pale);box-shadow:inset 0 0 0 1px var(--line)}
.btn.ghost:hover{box-shadow:inset 0 0 0 1px var(--gold)}
.stats{display:flex;justify-content:center;gap:26px;flex-wrap:wrap;margin:16px 0}
/* 이름 입력 — 미리 채워두면 "이미 됐다"고 읽혀 아무도 안 적는다.
   비워 두고, 비어 있는 동안만 눈에 띄게 한다. */
/* 메뉴의 작은 글씨가 전부 --ash 라, 이 라벨도 "지시"가 아니라 벽지로 읽혔다.
   대비는 6.56로 기준을 넘겼는데도 안 보인다는 피드백이 온 이유다.
   지시문은 주변 정보보다 한 단계 위여야 한다. */
.identlab{font-family:"Chakra Petch",var(--kr);font-size:14px;letter-spacing:.02em;
  color:var(--pale);font-weight:700;margin:0 0 10px}
.identlab.ask{color:var(--gold)}
.ident{display:flex;justify-content:center;gap:8px;margin:8px 0 6px;flex-wrap:wrap}
.ident.ask input{border-color:var(--gold);animation:askGlow 1.9s ease-in-out infinite}
@keyframes askGlow{0%,100%{box-shadow:0 0 0 0 rgba(255,209,102,0)}
  50%{box-shadow:0 0 0 3px rgba(255,209,102,.22)}}
/* 예전엔 배경이 #0d1224 라 페이지와 같은 색이었다. 어두운 화면에 어두운 칸은
   "적는 곳"이 아니라 위의 기체 카드와 같은 패널로 읽힌다 — 실제로 그냥
   지나친다는 피드백이 왔다. 밝게 채우고 테두리를 세운다. */
.ident select,.ident input{font:inherit;font-family:"Chakra Petch",var(--kr);font-weight:600;font-size:16px;color:var(--pale);
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.2);border-radius:4px;
  padding:11px 13px;outline:none;transition:border-color .15s,background .15s}
.ident input{width:200px;letter-spacing:0}
.ident input::placeholder{color:rgba(238,242,255,.42)}
.ident select:focus,.ident input:focus{border-color:var(--gold);background:rgba(255,255,255,.1)}

/* 이름과 시작 버튼을 한 덩어리로 묶는다. 따로 놓으면 이름은 "위쪽 정보"의
   일부로 보여서 건너뛰게 된다. 묶어 두면 시작하는 곳의 일부가 된다. */
.startbox{max-width:400px;margin:22px auto 0;padding:15px 16px 18px;
  border:1px solid var(--line);border-radius:6px;
  background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.012));
  transition:border-color .25s,background .25s}
.startbox.ask{border-color:rgba(255,209,102,.5);
  background:linear-gradient(180deg,rgba(255,209,102,.08),rgba(255,209,102,.02))}
/* 고정폭이면 "대한민국"이 "대한민"으로 잘린다. 가장 긴 항목에 맞춰 자동으로 잡히게 둔다 */
.ident select{width:auto;min-width:120px}
.ident input:focus,.ident select:focus{border-color:var(--gold)}
/* 들어오자마자 보이는 한 줄. 순위표를 통째로 올리면 시작 버튼이 화면 밖으로
   밀리므로 요약만 위에 둔다. "누가 이미 하고 있다"가 도전 동기를 만든다. */
#lbtop{margin:14px auto 0;font-size:13.5px;color:var(--ash);cursor:pointer;line-height:1.5}
#lbtop b{color:var(--pale)}
#lbtop .sc{color:var(--gold);font-family:"Chakra Petch",var(--kr);font-weight:700}
#lbtop .me{color:var(--cyan)}
#lb{margin:26px auto 0;max-width:560px;text-align:left}
#lb h3{font-family:"Chakra Petch",var(--kr);font-size:13px;letter-spacing:.04em;color:var(--ash);font-weight:600;margin-bottom:8px;
  display:flex;justify-content:space-between}
#lb h3 span{letter-spacing:.05em;color:var(--cyan);cursor:pointer}
.lbrow{display:grid;grid-template-columns:34px 30px 1fr 70px 88px;gap:8px;align-items:center;padding:7px 10px;
  border-bottom:1px solid #1a2242;font-size:15px;font-weight:600}
.lbrow.me{background:rgba(255,209,102,.08);border-left:2px solid var(--gold)}
.lbrow .rk{font-family:"Chakra Petch",var(--kr);color:var(--ash)}
.lbrow:nth-child(1) .rk{color:var(--gold)}.lbrow:nth-child(2) .rk{color:#cfd6e6}.lbrow:nth-child(3) .rk{color:#d59a6a}
.lbrow .fl{font-size:20px;line-height:1}
.lbrow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbrow .fm{font-size:11px;letter-spacing:0;color:var(--ash)}
/* 기체 실루엣은 이름 줄에 — 부제 줄은 좁은 폰에서 이미 잘린다 */
.lbrow .chi{width:17px;height:17px;display:inline-block;vertical-align:middle;margin:0 5px 2px 0}
.lbrow .sc{font-family:"Chakra Petch",var(--kr);text-align:right;color:var(--gold)}
.lbempty{color:var(--ash);font-size:14px;padding:14px 0}
#rankline{font-family:"Chakra Petch",var(--kr);font-size:18px;color:var(--gold);margin:-8px 0 20px}
/* 통계는 보조 정보다. 예전엔 32px 금색이라 정작 시작 버튼보다 강했다. */
.stat b{display:block;font-family:"Chakra Petch",var(--kr);font-size:19px;font-weight:700;color:var(--pale)}
.stat span{font-size:11.5px;letter-spacing:0;color:var(--ash)}

/* ── 레벨업 카드 ── */
#picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin:26px 0 8px}
.card.form{padding-top:34px}.card.form .t{font-size:26px}.card.form .d{font-size:15.5px}
.card .sub{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:13px;color:var(--ash);text-align:left;line-height:1.55}
.card .sub b{color:var(--c)}
.card .sub span{display:block}
.card .sub span+span{margin-top:5px}
@media(max-width:700px){
  /* 폰에서는 카드가 세로로 쌓여 3장이 화면을 넘겼다 — 실측 +39~192px, SE가 최악.
     글리프를 왼쪽에 붙인 가로 배치로 바꿔 카드 높이를 절반 이하로 줄인다.
     설명이나 진화 힌트가 길어져도 오른쪽 열에서만 늘어나므로 여유가 남는다. */
  #picks{grid-template-columns:1fr;gap:9px;margin:14px 0 6px}
  #v-level{padding:14px 12px}
  #v-level h2{font-size:22px}
  #picks .card{display:grid;grid-template-columns:38px 1fr;column-gap:11px;
    text-align:left;padding:10px 12px}
  #picks .card>*{grid-column:2;min-width:0}
  #picks .card>.glyph{grid-column:1;grid-row:1/span 3;width:38px;height:38px;margin:0;align-self:center}
  #picks .card .kind{font-size:10px;letter-spacing:.14em;margin-bottom:2px}
  #picks .card .t{font-size:16px;margin-bottom:2px}
  #picks .card .d{font-size:12.5px;line-height:1.35}
  #picks .card .n{font-size:11.5px;margin-top:3px}
  #picks .card .ev{font-size:10.5px;margin-top:4px;line-height:1.3}
  #picks .card .lvpips{justify-content:flex-start;margin-top:5px}
  /* 진화 선택 카드는 .sub에 2차·3차 설명까지 들어가 훨씬 길다. 좁은 화면에서는
     글리프를 빼고 폭을 전부 글에 준다 — 줄바꿈이 줄어드는 쪽이 글씨를 더 줄이는
     것보다 낫다. */
  #picks .card.form{padding:11px 13px;grid-template-columns:1fr}
  #picks .card.form>.glyph{display:none}
  #picks .card.form>*{grid-column:1}
  #picks .card.form .t{font-size:17px;margin-bottom:3px}
  #picks .card.form .d{font-size:12.5px;line-height:1.35}
  #picks .card .sub{margin-top:6px;padding-top:6px;font-size:10.8px;line-height:1.34}
  #picks .card .sub span+span{margin-top:2px}
}
/* 세로가 짧은 기기(아이폰 SE 553px 등)는 더 조인다. 여기까지가 정보를 안 지우고
   줄일 수 있는 한계다. */
@media(max-height:700px){
  #picks .card.form>.kind{display:none}
  #picks .card.form{padding:9px 12px}
  #picks .card .sub{font-size:10.3px;line-height:1.3;margin-top:5px;padding-top:5px}
  #picks .card .sub span+span{margin-top:1px}
}
/* 그래도 안 들어가면 가장 먼 정보부터 접는다 — 지금 고르는 건 1차인데 3차는
   24레벨이다. 2차까지는 남긴다. */
@media(max-height:600px){
  #picks .card.form .sub span:nth-child(3){display:none}
  #v-level{padding:10px}
  #v-level h2{font-size:20px}
  #picks{gap:7px;margin:10px 0 5px}
  #picks .card.form .d{font-size:12px}
}
/* ── 메뉴: 짧은 화면에서 시작 버튼 두 개가 모두 보여야 한다 ──
   설명을 쌓다 보니 심층 버튼이 화면 밖으로 밀렸다(SE에서 52px). 버튼이 안
   보이면 그 모드는 없는 것이나 같다. 위에서부터 차례로 조인다. */
@media(max-height:700px){
  #v-menu{padding:12px 12px}
  #v-menu h1{font-size:clamp(40px,11vw,72px)}
  #v-menu .box>p{font-size:13px;line-height:1.45;margin-top:10px}
  #todaymod{font-size:13px;padding:8px 12px;margin-top:12px!important}
  #lbtop{font-size:13px;margin-top:8px}
  .chars{gap:7px;margin-bottom:10px}
  .card.ch{padding:10px 8px 9px}
  .card.ch .glyph{width:40px;height:40px;margin-bottom:6px}
  .card.ch .t{font-size:15px}
  .card.ch .d{font-size:11.5px}
  .ident{margin:10px auto}
  #v-menu .btn{padding:14px 22px;font-size:17.5px}
}
@media(max-height:610px){
  #v-menu h1{font-size:clamp(34px,9vw,60px)}
  #v-menu .box>p{font-size:12.5px;line-height:1.4}
  .card.ch .d{display:none}
  #v-menu .btn{padding:12px 20px;font-size:16.5px}
}
.card{position:relative;background:linear-gradient(180deg,#161d3d,#0d1224);border:1px solid var(--line);
  border-radius:4px;padding:26px 18px 22px;cursor:pointer;text-align:center;overflow:hidden;
  transition:transform .14s,border-color .14s,box-shadow .14s}
.card:hover,.card:focus-visible{transform:translateY(-5px);outline:none;border-color:var(--c);
  box-shadow:0 0 0 1px var(--c),0 18px 44px -14px var(--c)}
.card::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:var(--c)}
.card .glyph{width:58px;height:58px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle,color-mix(in srgb,var(--c) 30%,transparent),transparent 70%);
  box-shadow:inset 0 0 0 1.5px var(--c)}
.card .glyph i{display:block;width:20px;height:20px;background:var(--c);border-radius:2px}
.card .kind{font-size:11px;letter-spacing:.24em;color:var(--c);font-weight:700;margin-bottom:7px}
.card .t{font-family:"Chakra Petch",var(--kr);font-size:21px;font-weight:700;margin-bottom:8px;color:var(--pale)}
.card .d{color:var(--ash);font-size:15px;line-height:1.5;font-weight:500}
/* ── 시작 기체 카드 — 레벨업 카드를 축소해 재사용 ── */
.chars{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;max-width:640px;margin:20px auto 12px}
.card.ch{padding:14px 10px 12px}
/* 실루엣이 정체성이라 원형 테두리는 뺀다 — 겹쳐서 지저분해진다 */
.card.ch .glyph{width:48px;height:48px;margin-bottom:8px;box-shadow:none}
.card.ch .glyph canvas{width:100%;height:100%;display:block}
.card.ch .t{font-size:16px;margin-bottom:4px}
.card.ch .d{font-size:12px;line-height:1.4}
.card.ch.on{border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 12px 30px -14px var(--c)}
.card.evo{border-color:var(--gold);animation:pulseGlow 1.6s ease-in-out infinite}
.card.ct{border-color:var(--pink)}
.card.ct .pay{margin-top:7px;padding-top:7px;border-top:1px dashed rgba(255,92,138,.35);
  font-size:13px;color:var(--pink);line-height:1.45}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 0 1px var(--gold),0 0 30px -6px rgba(255,209,102,.5)}
  50%{box-shadow:0 0 0 1px var(--gold),0 0 52px -4px rgba(255,209,102,.9)}}
.lvpips{display:flex;gap:3px;justify-content:center;margin-top:11px}
.lvpips i{width:13px;height:3px;background:#2b3563;border-radius:2px}
.lvpips i.on{background:var(--c)}

/* ── HUD ── */
#hud{position:fixed;inset:0;pointer-events:none;z-index:2}
#xpwrap{position:absolute;top:0;left:0;right:0;height:14px;background:#0b1024;
  border-bottom:1px solid rgba(79,240,216,.18)}
#xpfill{height:100%;width:0%;background:linear-gradient(90deg,#2ec4b6,#4ff0d8);
  box-shadow:0 0 16px rgba(79,240,216,.8);transition:width .08s}
#lvbadge{position:absolute;top:20px;left:16px;font-family:"Chakra Petch",var(--kr);font-weight:700;
  font-size:15px;letter-spacing:.08em;color:var(--cyan);text-shadow:0 0 12px rgba(79,240,216,.6)}
#clock{position:absolute;top:20px;left:0;right:0;text-align:center;font-family:"Chakra Petch",var(--kr);
  font-weight:700;font-size:34px;letter-spacing:.03em;text-shadow:0 3px 18px rgba(0,0,0,.9)}
/* 실시간 순위 — 점수만 오르면 지금 몇 등인지 모른다. 1위가 되면 왕관이 뛴다 */
#rank[hidden]{display:none}
#rank{margin-top:3px;font-weight:700;color:var(--ash);letter-spacing:.06em}
#rank.near{color:var(--pale)}
#rank.top1{color:var(--gold);text-shadow:0 0 14px rgba(255,209,102,.9);animation:crown 1.1s ease-in-out infinite}
@keyframes crown{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
#right{position:absolute;top:22px;right:16px;text-align:right;font-family:"Chakra Petch",var(--kr);
  font-weight:600;font-size:15px;color:var(--ash);line-height:1.5}
#right b{color:var(--pale)}
/* #right가 점수 줄만큼 길어져 아래 버튼과 겹쳤다 → 버튼을 24px 내렸다 */
/* 순위표 점수와 같은 금색 — 이게 순위에 올라갈 숫자라는 걸 색으로 잇는다 */
#right #score{color:var(--gold);font-size:17px}
#weapons{position:absolute;left:16px;top:52px;display:flex;flex-direction:column;gap:5px}
.wchip{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--ash);
  background:rgba(13,18,36,.7);border-left:2px solid var(--c);padding:3px 9px 3px 7px;border-radius:2px}
.wchip b{color:var(--pale);font-family:"Chakra Petch",var(--kr)}
#hpwrap{position:absolute;left:50%;transform:translateX(-50%);bottom:22px;width:min(380px,74vw);
  height:11px;background:#0b1024;border:1px solid #2a1c33;border-radius:2px;overflow:hidden}
#hpfill{height:100%;width:100%;background:linear-gradient(90deg,#ff3b6b,#ff8fa8);
  box-shadow:0 0 18px rgba(255,59,107,.6);transition:width .12s}
#hptext{position:absolute;left:0;right:0;bottom:38px;text-align:center;font-family:"Chakra Petch",var(--kr);
  font-size:13px;font-weight:600;color:#ff8fa8;letter-spacing:.1em}
#call{position:absolute;left:0;right:0;top:34%;text-align:center;font-family:"Chakra Petch",var(--kr);
  font-size:clamp(22px,5vw,38px);font-weight:700;letter-spacing:.16em;color:var(--gold);opacity:0;
  text-shadow:0 0 30px rgba(255,209,102,.8);transition:opacity .3s,transform .3s;transform:scale(.94)}
#call.on{opacity:1;transform:scale(1)}
/* 궁극기 발동 배너 — 이름은 크게, 뭘 했는지 한 줄. #call은 상황 알림용이라 따로 둔다 */
#callbig{position:absolute;left:0;right:0;top:26%;text-align:center;pointer-events:none;opacity:0;
  transform:scale(.9);transition:opacity .25s,transform .25s}
#callbig.on{opacity:1;transform:scale(1)}
#callbig .t{font-family:"Chakra Petch",var(--kr);font-weight:700;font-size:clamp(30px,7vw,52px);letter-spacing:.14em;
  color:#f0e6ff;text-shadow:0 0 34px var(--violet),0 0 8px rgba(255,255,255,.6)}
#callbig .s{margin-top:4px;font-size:clamp(13px,2.4vw,16px);font-weight:600;letter-spacing:.06em;color:var(--pale);opacity:.85}
/* 조작 안내는 메뉴 버튼 아래가 아니라 여기가 자리다. 거기선 버튼을 먼저 눌러서
   안 읽히고, 정작 필요한 순간은 판이 막 시작됐을 때다.
   처음 두 판에만 띄우고 스스로 사라진다. */
#tip{position:absolute;left:0;right:0;bottom:88px;text-align:center;font-family:"Chakra Petch",var(--kr);
  font-weight:600;font-size:15px;color:var(--pale);opacity:0;pointer-events:none;
  text-shadow:0 2px 14px rgba(0,0,0,.9)}
/* 게임 시계(G.t)에 묶는다. CSS 애니메이션은 일시정지해도 계속 흐르고,
   헤드리스 검증에서 가상 시간에 안 돌아 확인이 불가능하다. */
#zt{position:absolute;top:60px;left:0;right:0;text-align:center;font-family:"Chakra Petch",var(--kr);font-weight:600;font-size:13px;letter-spacing:.14em;color:var(--gold)}
#zt.soon{color:var(--pink);animation:blink .5s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
#mute{position:absolute;top:106px;right:92px;pointer-events:auto;background:none;border:none;color:var(--ash);font:inherit;font-size:13px;font-weight:600;letter-spacing:.14em;cursor:pointer}
#mute:hover{color:var(--gold)}
#lvtools{display:flex;justify-content:center;gap:10px;margin-top:6px}
#lvtools button{font:inherit;font-family:"Chakra Petch",var(--kr);font-weight:600;font-size:14px;letter-spacing:.08em;color:var(--ash);
  background:none;border:1px solid var(--line);border-radius:3px;padding:9px 16px;cursor:pointer}
#lvtools button:hover:not(:disabled){border-color:var(--cyan);color:var(--cyan)}
#lvtools button:disabled{opacity:.35;cursor:default}
.card .n{font-family:"Chakra Petch",var(--kr);font-size:12.5px;color:var(--pale);margin-top:8px;line-height:1.6;letter-spacing:.02em}
.card .n em{font-style:normal;color:var(--c)}
.card .ev{margin-top:9px;font-size:12px;color:var(--gold);line-height:1.45}

   상자가 1.67배라 레벨이 앞서고, 자폭 러시 날은 일찍 죽는다. 조건이 다른 두 판의
   점수 차를 실력 차처럼 보여 주고 있었다.
   같은 규칙이었던 날의 내 최고점과 견준다. 그런 날이 없으면 개인 최고와 견주고,
   어느 쪽과 견줬는지 라벨에 드러낸다 — 라벨이 없으면 같은 오해가 되돌아온다. */
function pastBest(){
  let same=0, any=0;
  for(const k in SAVE.hist){
    const sd=+k; if(sd===SEED)continue;          // 오늘 기록은 markDaily가 이미 넣어 뒀다
    const v=SAVE.hist[k]||0;
    if(v>any)any=v;
    if(v>same&&modFor(sd).id===MOD.id)same=v;
  }
  return {same,any};
}
function scoreDelta(){
  const pb=pastBest(), sc=calcScore();
  if(pb.same)return {lbl:MOD.n+" 최고보다", d:sc-pb.same};
  if(pb.any) return {lbl:"최고 기록보다",   d:sc-pb.any};
  return null;
}

/* ───── 데일리 시드 ───── */
function mulberry32(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function seedFor(off){const d=new Date(Date.now()+9*3600e3+off*864e5);
  return d.getUTCFullYear()*10000+(d.getUTCMonth()+1)*100+d.getUTCDate();}
function dailySeed(){return seedFor(0);}
const SEED=dailySeed();
/* 오늘의 규칙 — 시드가 스폰 순서만 바꾸면 "오늘은 다르다"가 체감되지 않는다.
   매일 규칙 하나가 바뀌어야 시드 자체가 컨텐츠가 되고, 공유할 거리도 여기서 나온다.
   전부 곱셈 계수라 밸런스가 한쪽으로 무너지지 않는다. */

 {id:"swarm", n:"떼거리",    d:"적이 훨씬 많이 옵니다. 대신 하나하나는 약합니다", spawn:1.4, hp:.75},
 {id:"narrow",n:"좁은 원",   d:"황금 원이 작습니다. 대신 그 안에서 피해가 더 세집니다", zone:.7, zmul:1.25},
 {id:"bombs", n:"자폭 러시", d:"터지는 빨간 적이 세 배. 곁에 두지 마세요", bomb:3},
 {id:"supply",n:"보급 풍년", d:"상자가 훨씬 자주 떨어집니다. 레벨이 빨리 오릅니다", chest:.6},
 {id:"rush",  n:"속도전",    d:"나도 적도 빨라집니다", pspd:1.25, espd:1.15},
 {id:"giants",n:"우두머리",  d:"큰 적이 자주 옵니다. 잡으면 상자를 줍니다", elite:.6, ehp:1.3},
];
/* 규칙은 시드의 순수 함수다 — 지난 날짜의 규칙도 다시 계산할 수 있다.
   점수를 "같은 규칙이었던 날"과만 견주는 데 이 성질을 쓴다(pastBest 참고). */
const modFor=s=>MODS[Math.floor(mulberry32(s*7+11)()*MODS.length)];
const MOD=modFor(SEED);
let R={};
function resetSeed(){R={zone:mulberry32(SEED*3+1),spawn:mulberry32(SEED*3+2),card:mulberry32(SEED*3+3),
  ev:mulberry32(SEED*3+4)};}
const srnd=(g,a,b)=>a+g()*(b-a), spick=(g,arr)=>arr[Math.floor(g()*arr.length)];

/* ───── 사운드 (Web Audio 합성) ───── */
const SFX=(()=>{let ac=null,master,muted=false,lastKill=0;
 function ctx(){if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=.32;master.connect(ac.destination);}
   if(ac.state==="suspended")ac.resume();return ac;}
 function tone(f,t,type="sine",v=1,slide=0,delay=0){if(muted)return;try{const a=ctx(),o=a.createOscillator(),g=a.createGain(),t0=a.currentTime+delay;
   o.type=type;o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),t0+t);
   g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.001,t0+t);o.connect(g);g.connect(master);o.start(t0);o.stop(t0+t);}catch(e){}}
 function noise(t,v=.5,fq=1200){if(muted)return;try{const a=ctx(),b=a.createBuffer(1,a.sampleRate*t|0,a.sampleRate),d=b.getChannelData(0);
   for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);const src=a.createBufferSource();src.buffer=b;
   const g=a.createGain();g.gain.value=v;const f=a.createBiquadFilter();f.type="lowpass";f.frequency.value=fq;
   src.connect(f);f.connect(g);g.connect(master);src.start();}catch(e){}}
 /* ───── BGM ─────
    외부 파일 없이 절차 생성한다 — 오디오를 받아오면 "외부 요청 0"이 다시 깨지고
    용량도 는다. SFX와 같은 AudioContext·master를 쓰므로 음소거 하나로 같이 꺼진다.
    rAF는 탭이 숨으면 멈추므로 스케줄은 오디오 클럭 기준 룩어헤드로 돈다. */
 let bgmIv=null,bgmG=null,bgmStep=0,bgmNext=0;
 const BPM=84, VOL=.9;                     // 합성 실측 피크 −21 dBFS — SFX 최대(−16)보다 한 단계 아래
 /* 근음을 옮길 때 단3도 패턴을 그대로 평행 이동하므로, 근음은 A단조에서
    단화음이 되는 자리(i·iv·v)만 쓴다. VI(F)를 넣으면 F단조가 되어 Ab·Eb가
    조 밖으로 나간다. */
 const PROG=[0,0,5,7];                     // 4마디 — i i iv v (Am Am Dm Em)
 const ARP=[0,null,7,null,3,null,10,null]; // 1마디분 8분음표
 const hz=n=>55*Math.pow(2,n/12);          // A1 기준 반음 오프셋
 function bnote(f,dur,type,v,t0,atk){try{const a=ac,o=a.createOscillator(),g=a.createGain();
   o.type=type;o.frequency.setValueAtTime(f,t0);
   g.gain.setValueAtTime(.0001,t0);g.gain.linearRampToValueAtTime(v,t0+atk);
   g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
   o.connect(g);g.connect(bgmG);o.start(t0);o.stop(t0+dur+.03);}catch(e){}}
 function bgmTick(){const a=ctx(),sp=60/BPM/2;            // 8분음표 길이
   if(bgmNext<a.currentTime)bgmNext=a.currentTime+.05;    // 탭이 숨었다 돌아와도 밀린 음을 몰아치지 않는다
   while(bgmNext<a.currentTime+.25){
     if(!muted){
       const st=bgmStep%32, r=PROG[(st/8)|0];
       if(st%2===0)bnote(hz(r),sp*1.5,"sawtooth",.22,bgmNext,.01);                   // 베이스 — 4분음표 맥박
       if(st%8===0)[0,7,15].forEach(i=>bnote(hz(r+12+i),sp*7.5,"triangle",.065,bgmNext,.5)); // 패드
       const ar=ARP[st%8];
       if(ar!==null)bnote(hz(r+24+ar),sp*.85,"triangle",.07,bgmNext,.01);           // 아르페지오
     }
     bgmNext+=sp;bgmStep++;}}
 function bgmVol(v,sec){const a=ctx();bgmG.gain.cancelScheduledValues(a.currentTime);
   bgmG.gain.setValueAtTime(bgmG.gain.value,a.currentTime);
   bgmG.gain.linearRampToValueAtTime(v,a.currentTime+sec);}
 return{init:ctx,
  toggle(){muted=!muted;if(bgmG&&ac){bgmG.gain.cancelScheduledValues(ac.currentTime);
    bgmG.gain.setValueAtTime(muted?0:VOL,ac.currentTime);}return muted;},
  get muted(){return muted;},
  bgm(on){try{
    if(on){const a=ctx();
      if(!bgmG){bgmG=a.createGain();bgmG.gain.value=0;
        const f=a.createBiquadFilter();f.type="lowpass";f.frequency.value=2600;
        bgmG.connect(f);f.connect(master);}
      bgmVol(muted?0:VOL,1.5);
      if(!bgmIv){bgmNext=a.currentTime+.1;bgmIv=setInterval(bgmTick,60);}
    }else if(bgmIv){bgmVol(0,.8);clearInterval(bgmIv);bgmIv=null;}
  }catch(e){}},
  /* iOS는 탭이 백그라운드로 가면 AudioContext를 suspended로 만들고, 돌아와도
     저절로 깨지 않는다. 예전엔 소리를 "새로 만들 때"만 resume을 시도해서
     BGM이 돌아오지 않았다. 복귀 시점과 다음 조작에서 명시적으로 깨운다.
     (iOS는 사용자 제스처 안에서의 resume을 더 잘 받아준다 — 그래서 둘 다 건다.) */
  wake(){try{
    if(!ac)return;
    if(ac.state==="suspended")ac.resume();
    if(bgmIv&&bgmG&&!muted)bgmVol(VOL,.35);   // 밀린 페이드가 있으면 되돌린다
  }catch(e){}},
  kill(){const n=performance.now();if(n-lastKill<40)return;lastKill=n;tone(rnd(360,520),.07,"square",.14,-220);},
  hurt(){noise(.16,.5,900);tone(85,.22,"sawtooth",.3,-40);},
  block(){tone(1400,.1,"triangle",.25,-600);},
  pickup(){tone(880,.1,"sine",.22,500);},
  chest(){[660,880,1100,1320].forEach((f,i)=>tone(f,.18,"triangle",.22,0,i*.06));},
  level(){[523,659,784,1047].forEach((f,i)=>tone(f,.22,"triangle",.25,0,i*.07));},
  evolve(){noise(.6,.35,600);[262,330,392,523,659,784,1047].forEach((f,i)=>tone(f,.5,"sawtooth",.16,0,i*.08));},
  ult(){tone(55,.7,"sawtooth",.45,-25);noise(.35,.45,500);tone(180,.3,"square",.25,320,.12);},
  ready(){tone(784,.18,"sine",.25);tone(1047,.22,"sine",.25,0,.11);},
  zone(){tone(1200,.14,"sine",.18,-300);tone(900,.14,"sine",.18,-300,.15);},
  warn(){[0,.15,.3].forEach(d=>tone(330,.11,"square",.18,0,d));},
  boss(){tone(50,1.3,"sawtooth",.5);noise(1,.45,400);},
  bomb(){noise(.5,.7,700);tone(70,.5,"sawtooth",.4,-40);},
 };})();

const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* 처치가 점수의 80~90%를 먹고 처치 수는 스폰(=시간)에 묶여 있어 잘해도 점수가 안 올랐다.
   실력이 가장 잘 갈리는 레벨(27~41)과 보스 격파의 비중을 올린다. */
/* 서버 submit_score와 같은 식이어야 표시 점수와 순위 점수가 어긋나지 않는다.
   서버는 p_time을 정수로 받으므로 여기서도 내림한다. */
/* 무한 모드에는 자연스러운 끝이 없어서 "그만두기 = 탭 닫기"가 된다. finish()에서만
   제출하면 그 경로의 기록이 통째로 사라진다 — 실제로 10만 점대 판이 그렇게 날아갔다.
   서버가 (날짜, 기기)당 최고점만 남기므로 중복 제출은 무해하다.
   언로드 중이라 응답을 기다릴 수 없으므로 keepalive로 던지고 잊는다. */
function submitBeacon(){
  if(!sbReady()||!G||G.over||G.t<20)return;
  try{fetch(`${SB_URL}/rest/v1/rpc/submit_score`,{method:"POST",headers:SB_H(),keepalive:true,
    body:JSON.stringify({p_client:CLIENT,p_nick:PROF.nick||"오퍼레이터",
      p_cc:PROF.cc==="OT"?"ZZ":(PROF.cc||"ZZ"),
      p_time:Math.floor(G.t),p_kills:G.kills,p_lv:G.p.lv,p_form:G.form,
      p_won:!!G.cleared,p_ch:G.ch})}).catch(()=>{});}catch(e){}
}
function calcScore(){return G.kills*6+Math.floor(G.t)*3+G.p.lv*260+(G.cleared?12000:0);}
/* 제출 실패한 기록을 들고 있다가 다음 접속 때 다시 보낸다.
   101,752점짜리 판이 서버 검증식 결함으로 거부됐는데, 화면에는 "실패 (400)"만
   뜨고 기록은 그대로 사라졌다. 이유도 안 보이고 복구할 방법도 없었다.
   서버가 고쳐지면 저절로 들어가야 한다 — 그게 이 큐의 목적이다. */
const QKEY="relay:pending";
const postScore=b=>fetch(`${SB_URL}/rest/v1/rpc/submit_score`,
  {method:"POST",headers:SB_H(),body:JSON.stringify(b)});
function queueScore(b){
  const q=ls.get(QKEY,[]).filter(x=>x&&x.at&&Date.now()-x.at<7*864e5);
  q.push({at:Date.now(),b});ls.set(QKEY,q.slice(-5));}
async function flushScores(){
  const q=ls.get(QKEY,[]); if(!q.length||!sbReady())return;
  const left=[];let ok=0;
  for(const it of q){
    try{const r=await postScore(it.b); if(r.ok)ok++; else left.push(it);}
    catch(e){left.push(it);}
  }
  ls.set(QKEY,left);
  if(ok)loadLB();
  return ok;
}
async function submitScore(){
  if(!sbReady()){$("#rankline").textContent="랭킹 서버 미설정 · 이번 판 "+calcScore().toLocaleString()+"점";return;}
  const base={p_client:CLIENT,p_nick:PROF.nick,p_cc:PROF.cc==="OT"?"ZZ":PROF.cc,
    p_time:Math.floor(G.t),p_kills:G.kills,p_lv:G.p.lv,p_form:G.form,p_won:!!G.cleared,p_ch:G.ch};
  try{
    const r=await postScore(base);
    if(!r.ok){
      /* 이유를 반드시 보여준다. "실패 (400)"만으로는 아무것도 알 수 없다. */
      let why="";try{const j=await r.json();why=j.message||j.hint||"";}catch(e){}
      queueScore(base);
      $("#rankline").innerHTML="기록 제출 실패 — 다음 접속 때 다시 보냅니다"+
        (why?`<br><span style="font-size:12px;color:var(--ash)">${esc(why)}</span>`:"");
      return;
    }
    const [{rank,score}]=await r.json();G.rank=rank;
    $("#rankline").textContent=`${flag(PROF.cc)} ${PROF.nick} · 오늘 ${rank}위 · ${score.toLocaleString()}점`;
    await loadLB();paintLB(PROF.nick);
  }catch(e){queueScore(base);$("#rankline").textContent="기록 제출 실패 — 다음 접속 때 다시 보냅니다";}
}

 mirror:{no:8,n:"거울",c:"#cfd6ff",tier:9,end:1,hpM:1.2,spd:74,r:52,dmg:26,

   onHit(b){b.store+=1;},
   f(dt,b,a){
     /* 오버킬을 벌한다. 저장한 만큼 3초마다 되쏜다 — 화력만 올린 빌드에 제동 */
     b.fire-=dt;
     if(b.fire<=0){b.fire=3;
       const k=Math.min(14,2+Math.floor(b.store/6));b.store=0;
       for(let i=0;i<k;i++){const g=i/k*TAU+a;
         G.eb.push({x:b.x,y:b.y,vx:Math.cos(g)*250,vy:Math.sin(g)*250,r:8,dmg:16,life:4});}
       call("거울 — 되돌아온다");}
   },
   draw(X,Y,b){
     const r=b.r,col="#cfd6ff",t=G.t,k=Math.min(1,b.store/80);
     cx.save();cx.shadowColor=col;cx.shadowBlur=16;
     cx.fillStyle="#1a1f3d";cx.strokeStyle=col;cx.lineWidth=2.6;cx.lineJoin="miter";
     cx.beginPath();
     for(let q=0;q<4;q++){const g=t*.5+q*TAU/4,xx=X+Math.cos(g)*r,yy=Y+Math.sin(g)*r;q?cx.lineTo(xx,yy):cx.moveTo(xx,yy);}
     cx.closePath();cx.fill();cx.stroke();
     /* 안쪽 마름모가 저장량만큼 밝아진다 — 되쏘기 직전이 보인다 */
     cx.fillStyle=`rgba(255,255,255,${(.15+.75*k).toFixed(2)})`;cx.shadowBlur=10+26*k;
     cx.beginPath();
     for(let q=0;q<4;q++){const g=-t*.9+q*TAU/4,xx=X+Math.cos(g)*r*.42,yy=Y+Math.sin(g)*r*.42;q?cx.lineTo(xx,yy):cx.moveTo(xx,yy);}
     cx.closePath();cx.fill();
     if(b.hit>0){cx.globalAlpha=.5;cx.fillStyle="#fff";cx.beginPath();cx.arc(X,Y,r,0,TAU);cx.fill();}
     cx.restore();
   },

 clockwork:{no:11,n:"태엽",c:"#ffb347",tier:9,end:1,hpM:1.1,spd:66,r:50,dmg:25,

 hydra:{no:14,n:"머리",c:"#ff6b9d",tier:9,end:1,hpM:1.3,spd:70,r:50,dmg:26,

     if(b.hp<b.mark-b.mhp*.15&&b.heads<6){b.mark=b.hp;b.heads++;

   },
   f(dt,b,a){

     b.fire-=dt;
     if(b.fire<=0){b.fire=1.6;b.ring+=.36;
       const k=8+alive*2;

       cx.stroke();

     cx.fillStyle="#2b0a18";cx.strokeStyle=col;cx.lineWidth=3;
     cx.beginPath();cx.arc(X,Y,r*.55,0,TAU);cx.fill();cx.stroke();
     cx.fillStyle="#ffd0e0";cx.shadowBlur=20;
     cx.beginPath();cx.arc(X,Y,r*.2,0,TAU);cx.fill();
     if(b.hit>0){cx.globalAlpha=.5;cx.fillStyle="#fff";cx.beginPath();cx.arc(X,Y,r,0,TAU);cx.fill();}

/* 오늘의 시드로 사도 순서를 뽑는다. 앞 둘은 tier 1에서. 같은 날은 모두 같은 순서다 —
   스폰 스트림(R.spawn)과 별개 생성기라 사도를 늘려도 적 구성이 안 어긋난다. */
function makeRoster(){
  const g=mulberry32(SEED*3+5), ids=Object.keys(ANGELS).filter(k=>!ANGELS[k].end);
  const sh=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(g()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;};
  const t1=sh(ids.filter(k=>ANGELS[k].tier===1)), t2=sh(ids.filter(k=>ANGELS[k].tier!==1));
  const first=t1.splice(0,Math.min(2,t1.length));
  const out=first.concat(sh(t1.concat(t2)));
  let i=0;while(out.length<FINAL_AT&&ids.length)out.push(out[i++%out.length]);   // 사도가 자리보다 적으면 돌려 쓴다
  return out.slice(0,FINAL_AT);
}

const SEV_FIRST=45, SEV_GAP=52;

const sevMul=k=>(G.sev&&G.sev[k]!==undefined)?G.sev[k]:1;
function startSev(){
  let e=spick(R.ev,SEVS);

     실제로 「폭주 → 폭주」가 잡혔다. 두 번째에도 같으면 표에서 한 칸 옮긴다.
     난수를 더 쓰지 않으므로 추첨 스트림이 사람마다 어긋나지 않는다. */
  if(G.sevLast&&e.id===G.sevLast)e=spick(R.ev,SEVS);
  if(G.sevLast&&e.id===G.sevLast)e=SEVS[(SEVS.indexOf(e)+1)%SEVS.length];
  /* 재머전이면 정전을 옆으로 비킨다. 난수를 더 뽑지 않고 표에서 한 칸 옮기는 방식이라
     추첨 스트림이 사람마다 어긋나지 않는다. */
  if(G.boss&&e.id==="blackout")e=SEVS[(SEVS.indexOf(e)+1)%SEVS.length];
  G.sev=e;G.sevT=e.dur;G.sevLast=e.id;

  if(e.zt)G.zt=Math.min(G.zt,ZONE_T/G.pace*e.zt);
  call(e.n+" — "+e.d);SFX.warn();shake=Math.max(shake,.4);
  G.flash={t:.5,c:e.id==="lull"?"142,240,176":"255,209,102"};

/* 사도 6기 + 종단. 약 11분. */
const FINAL_AT=6;
/* 무한모드 로스터 — 제8~14사도. 끝을 본 사람만 만난다.
   본편과 같은 시드를 쓰되 스트림을 나눈다(+6) — 같은 날 모두가 같은 순서다. */
function makeEndRoster(){
  const g=mulberry32(SEED*3+6), ids=Object.keys(ANGELS).filter(k=>ANGELS[k].end);
  for(let i=ids.length-1;i>0;i--){const j=Math.floor(g()*(i+1));const t=ids[i];ids[i]=ids[j];ids[j]=t;}
  return ids;
}
function spawnBoss(){
  const a=rnd(0,TAU);
  const fin=G.bosses>=FINAL_AT&&!G.ended;
  /* 끝을 본 뒤에는 제8~14사도만 나온다 — 「왜 추적자만 나와?」의 답이다.
     본편 로스터를 [0]으로 떨어뜨려 첫 사도만 반복하던 것도 여기서 없어진다. */
  const R2=G.ended?(G.endRoster.length?G.endRoster:G.roster):G.roster;
  const aid=fin?null:(R2.length?R2[G.bosses%R2.length]:null), A=aid?ANGELS[aid]:null;
  const bhp=Math.round(9000*Math.pow(1.55,G.bosses)*(fin?2.4:(A?A.hpM:1)));
  G.boss={x:G.p.x+Math.cos(a)*520,y:G.p.y+Math.sin(a)*520,hp:bhp,mhp:bhp,
    spd:fin?86:(A?A.spd:70)+G.bosses*6,r:fin?78:(A?A.r:46),dmg:fin?34:(A?A.dmg:24)+G.bosses*4,
    fire:1.4,ring:0,summon:5,hit:0,fin:fin?1:0,ph:0,spiral:0,conv:0,ang:aid,
    /* 번호는 등장 순서다 — 1부터 올라가고 종단이 7. 에바식으로 3·4·5·6·7·9·12를
       띄엄띄엄 붙였더니 「1사도부터 7사도까지 순서대로 나오는 거 맞지?」가 나왔다.
       정체는 날마다 섞이되 번호는 늘 1→7이어야 진행으로 읽힌다 */
    no:fin?FINAL_AT+1:(A&&A.end?A.no:Math.min(FINAL_AT,G.bosses+1))};
  if(A&&A.init)A.init(G.boss);
  /* 등장 — 이름이 뜨고 화면이 잠깐 선다. 「재머 강림」 한 줄로는 어떤 놈인지 몰랐다 */
  callBig("제"+G.boss.no+"사도 "+(fin?"종단":A.n),
    fin?"체력에 따라 공격이 3번 바뀌어요. 계속 움직이세요":A.how, 3600);
  SFX.boss();hitstop=.3;shake=Math.max(shake,1.2);
  G.flash={t:.6,c:fin?"255,209,102":"238,242,255"};
  track("boss",{ang:aid||"final",n:G.bosses},G.t);
}
function call(t){const e=$("#call");e.textContent=t;e.classList.add("on");
  clearTimeout(call._);call._=setTimeout(()=>e.classList.remove("on"),1800);}
function callBig(t,sub,ms){const e=$("#callbig");e.querySelector(".t").textContent=t;e.querySelector(".s").textContent=sub||"";
  e.classList.add("on");clearTimeout(callBig._);callBig._=setTimeout(()=>e.classList.remove("on"),ms||2200);}
/* 궁극기 라벨 — 데스크톱은 이름+효과 두 줄, 모바일 버튼은 「ULT」 대신 이름.
   매 프레임 부르되 문자열이 같으면 DOM을 안 건드린다 */
function ultLabel(){
  const f=G&&G.form, F=f&&f!=="none"?FORMS[f]:null, u=G&&G.ult;
  const rdy=F&&u.c>=u.max&&u.cd<=0;
  const key=(F?F.ult:"-")+"|"+(rdy?1:0)+"|"+(F&&u.cd>0?Math.ceil(u.cd):0);
  if(ultLabel._===key)return;ultLabel._=key;
  const nm=$("#ultname"), gl=$("#ultbtn .gl");
  if(!F){nm.textContent=f==="none"?"궁극기 없음":"궁극기 · 8레벨 진화 후";gl.textContent="ULT";gl.classList.remove("long");return;}
  const st=rdy?"준비됨 · SPACE / 탭":u.cd>0?Math.ceil(u.cd)+"s 뒤":"처치로 충전";
  nm.innerHTML=`<b>${F.ult}</b><small>${F.ud} — ${st}</small>`;
  gl.textContent=F.ult;gl.classList.toggle("long",F.ult.length>3);
}

/* ───── 업데이트 ───── */
function update(dt){
  const p=G.p; G.t+=dt; G.et=G.t*G.pace; G.eth=G.t*tpaceAt(G.t);

  runSaveT+=dt;if(runSaveT>=10){runSaveT=0;saveRun();}
  p.in=Math.hypot(p.x-G.zone.x,p.y-G.zone.y)<G.zone.r;

  // 신호권 이동
  if(!G.boss){
    G.zt-=dt;
    if(G.zt<=8&&!G.next){const a=srnd(R.zone,0,TAU),d=srnd(R.zone,560,860);
      G.next={x:G.zone.x+Math.cos(a)*d,y:G.zone.y+Math.sin(a)*d};call("신호권이 곧 옮겨진다");}
    /* 예속된 신호권 — 원이 나를 따라오므로 이동 예고도 타이머도 의미가 없다.
       「어디서 싸울지」가 사라지는 대신 크기를 60%로 낸다. */
    if(G.ct.leash){G.zone.x=G.p.x;G.zone.y=G.p.y;G.next=null;G.zt=ZONE_T/G.pace;}
    else if(G.zt<=0){G.zone.x=G.next.x;G.zone.y=G.next.y;G.next=null;G.zt=ZONE_T/G.pace*sevMul("zt");SFX.zone();
      for(let i=0;i<26;i++)G.fx.push({x:G.zone.x+Math.cos(i/26*TAU)*G.zone.r,y:G.zone.y+Math.sin(i/26*TAU)*G.zone.r,
        vx:0,vy:0,life:.6,max:.6,c:C.gold,sp:1});}
  }

  // 이동
  let ix=0,iy=0;
  if(keys.a||keys.arrowleft)ix--; if(keys.d||keys.arrowright)ix++;
  if(keys.w||keys.arrowup)iy--; if(keys.s||keys.arrowdown)iy++;
  if(touch){ix+=touch.x;iy+=touch.y;}
  const l=Math.hypot(ix,iy);
  G.moving=l>0;
  const sm=(G.form==="pulse"&&G.stage>=2&&G.res>=30)?1.2:1;   // 증폭 — 공명 30 이상이면 빨라진다
  if(l>0){ix/=l;iy/=l;p.dx=ix;p.dy=iy;p.x+=ix*p.spd*sm*dt;p.y+=iy*p.spd*sm*dt;}
  G.histT-=dt;if(G.histT<=0){G.histT=.07;G.hist.unshift({x:p.x,y:p.y});if(G.hist.length>24)G.hist.pop();}
  G.flash.t=Math.max(0,G.flash.t-dt);
  if(G.form==="warden"){const sh=G.shield;if(!sh.up){sh.cd-=dt;if(sh.cd<=0)sh.up=true;}}
  if(G.st.regen){p.hp=Math.min(p.mhp,p.hp+G.st.regen*dt);
    if(G.st.regen<0&&p.hp<=0)G.lastHit="과열로";}   // 안 그러면 결과 화면 사인이 옛 피격으로 남는다
  p.inv=Math.max(0,p.inv-dt); p.flash=Math.max(0,p.flash-dt); G.ult.t=Math.max(0,G.ult.t-dt);
  G.ult.cd=Math.max(0,G.ult.cd-dt);
  /* 공명 — 2초간 처치가 없으면 빠르게 빠진다(초당 12). 40스택이 3초 남짓에 사라진다.
     잔열(패시브)이 유지 시간을 늘린다 */
  if(G.form==="pulse"){G.resT+=dt;if(G.resT>2*G.st.resHold&&G.res>0)G.res=Math.max(0,G.res-dt*12);}
  if(G.ang.plate&&!G.plate.up){G.plate.cd-=dt;if(G.plate.cd<=0)G.plate.up=true;}

  // 스폰 (초반은 아주 완만하게)
  G.spawn+=dt*Math.min(G.cleared?11:7.5,0.9+G.eth/34)*(G.mod.spawn||1)*sevMul("spawn");  // 클리어 후에는 상한을 풀어 난이도를 이어간다
  while(G.spawn>=1){G.spawn--;
    const r=R.spawn(); let k="wisp";
    if(G.et>75&&r<.38)k="dash";
    if(G.et>100&&r>.38&&r<.5)k="shooter";
    if(G.et>140&&r>.5&&r<.6)k="splitter";
    if(G.et>170&&r>.86)k="tank";
    if(G.et>200&&r>.6&&r<.68)k="bomber";
    if(G.et>260&&r>.8&&r<.86)k="wall";
    /* 여기까지가 4분 20초. 예전에는 이후로 구성이 영영 고정이었다.
       .68~.80 구간이 비어 있어(위스프 기본값) 새 종류를 그 자리에 넣는다. */
    if(G.et>330&&r>.68&&r<.74)k="orbiter";
    if(G.et>430&&r>.74&&r<.80)k="sniper";
    if(G.et>540&&r<.05)k="shielder";
    // 후반에는 비중 자체를 올린다 — 같은 적이 더 두꺼워지기만 하면 지루하다
    if(G.et>720&&r>.30&&r<.38)k="orbiter";
    if(G.et>900&&r>.22&&r<.30)k="sniper";
    if(G.et>1080&&r>.17&&r<.22)k="shielder";
    /* 폭우 — 밴드를 넓히면 다른 종을 밀어내므로 별도 추첨으로 얹는다.
       무조건 뽑아야 시드 스트림이 규칙에 따라 어긋나지 않는다. */
    const r2=R.spawn();
    if((G.mod.bomb||1)>1&&G.et>200&&r2<((G.mod.bomb-1)*.08))k="bomber";
    /* 끝을 본 뒤부터 포식자가 섞인다 */
    if(G.ended&&r<.18)k="predator";
    spawnE(k,false);}
  /* 상태 이벤트.
     처음엔 보스전 중 전부 막았는데, 첫 재머가 2:50이고 그 뒤 50초마다 오므로
     정작 이벤트가 필요한 후반에 기능이 죽었다(실측 300초에 2회). 그래서 일반
     재머전에는 허용한다. 막는 건 둘뿐이다 — 종단 재머전 전체(링→나선→수렴
     3단계를 방해하면 안 된다), 그리고 재머전의 정전(안 보이는 것을 때리게 된다). */
  if(G.sev){ G.sevT-=dt; if(G.sevT<=0)endSev(); }
  else if(!(G.boss&&G.boss.fin)){ G.sevN-=dt; if(G.sevN<=0)startSev(); }
  // 타임라인 이벤트
  const ev=EVENTS[G.evi];
  if(ev&&!G.boss){
    if(!G.evWarn&&G.t>=ev.t-3){G.evWarn=true;call(ev.n+" 접근");SFX.warn();}
    if(G.t>=ev.t){ev.f();G.evi++;G.evWarn=false;shake=Math.max(shake,.3);}}
  /* 30초 구간마다 신호권 안에 얼마나 있었는지를 남긴다. 공유물의 막대가 이걸 그린다 —
     점수 숫자 하나보다 "판의 모양"이 남에게 훨씬 잘 읽힌다. */
  {const si=Math.floor(G.t/30), sg=G.seg[si]||(G.seg[si]={in:0,tot:0});
   sg.tot+=dt; if(p.in)sg.in+=dt;}
  // 신호권 밖 간섭 (기동계는 면역)
  if(p.in||G.form==="rover")G.outT=Math.max(0,G.outT-dt*2);else G.outT+=dt;
  G.elite-=dt;
  /* 고요는 일반 스폰만 막고 엘리트는 그대로 오고 있었다 — 설명이 거짓이 된다.
     타이머는 계속 줄어드니 고요가 끝나는 순간 한 번 몰려온다. 그건 의도다. */
  if(G.elite<=0&&!G.boss&&sevMul("spawn")>0){G.elite=32/G.pace*(G.mod.elite||1)*(G.ended?.7:1);
    /* 엘리트가 늘 탱크뿐이라 후반이 단조로웠다. 그 시점에 등장한 종류 중에서 고른다.
       시드 생성기를 써야 같은 날 모두가 같은 구성을 만난다. */
    const ep=G.ended?["predator","predator","shielder","sniper","wall"]
            :G.et>540?["tank","wall","orbiter","sniper","shielder"]
            :G.et>330?["tank","wall","orbiter"]
            :G.et>140?["tank"]:["wisp"];
    for(let i=0;i<1+Math.floor(G.et/180);i++)spawnE(spick(R.spawn,ep),true);}
  G.chest-=dt;
  if(G.chest<=0){G.chest=24/G.pace*(G.mod.chest||1)*sevMul("chest");const a=srnd(R.zone,0,TAU),d=srnd(R.zone,0,G.zone.r*.7);
    dropItem(G.zone.x+Math.cos(a)*d,G.zone.y+Math.sin(a)*d,spick(R.zone,["heal","bomb","magnet","chest"]));}

  /* 보스를 잡아도 끝나지 않는다 — 상한이 닫혀 있으면 잘해도 점수가 안 오른다.
     격파 후에는 일정 간격으로 더 강한 재머가 계속 온다. 끝은 죽음뿐이다. */
  if(!G.boss&&!G.over){
    if(!G.cleared){ if(G.et>=BOSS_AT)spawnBoss(); }
    else { G.bossT-=dt; if(G.bossT<=0)spawnBoss(); }
  }

  weapons(dt); enemies(dt); boss(dt); bullets(dt); pools(dt); items(dt); fx(dt);
  if(p.hp<=0)finish(G.cleared);
  shake=Math.max(0,shake-dt*3.2);wshT=Math.max(0,wshT-dt);
  hud();
}

function zoneMul(){
  const f=G.form; let m;
  /* 실효 배수가 관제탑 2.53 vs 특이점 1.62였다 — 56% 차이라 안 고를 이유가 없었다.
     방어계를 내리고 기동계를 올려 간격을 좁힌다. 방어계의 「밖에서 약하다」는
     그대로 둔다. 그게 두 갈래를 가르는 선이다. */
  /* 역상이 극성을 뒤집었으면 안팎을 바꿔 계산한다. 갈래 배수·계약·과부하 전부 따라간다 */
  const inn=(G.boss&&G.boss.ang==="inverse"&&G.boss.flip)?!G.p.in:G.p.in;
  if(f==="rover")m=1.45;
  else if(f==="pulse")m=1.2*(1+G.res*G.st.resDmg);
  else if(f==="warden")m=inn?1.95:.85;
  else m=inn?1.7:1;
  /* 역극성 — 갈래가 정한 배수를 통째로 덮는다. 방어계로 쌓아 온 빌드가
     한순간 무의미해지는 유일한 카드다. 그게 이 계약의 값어치다. */
  if(G.ct.inv)m=inn?.85:2;
  if(inn&&G.st.surge)m*=1+G.st.surge;
  if(inn&&G.mod.zmul)m*=G.mod.zmul;
  if(!inn&&G.ang.pole)m*=1.3;   // 권능 · 극성 전환
  if(G.noEvo)m*=1.15;
  return m;
}

function weapons(dt){
  const p=G.p,st=G.st,A=st.area;
  /* 태엽(제11사도)이 내 공격만 늦춘다. 적 탄막은 그대로라 「피하는 데 집중」이 답이 된다 */
  const tw=(G.boss&&G.boss.ang==="clockwork"&&G.boss.slow>0)?.45:1;
  for(const k in G.cd)G.cd[k]-=dt*st.rate*tw;

  // 다트 / 레일건
  if(G.w.dart&&G.cd.dart<=0){
    const L=G.w.dart, evo=G.evo.railgun;
    G.cd.dart=evo?.9:(L>=3?.46:.6);
    if(evo){
      const t=near(1)[0], a=t?Math.atan2(t.y-p.y,t.x-p.x):Math.atan2(p.dy,p.dx);
      G.bul.push({x:p.x,y:p.y,vx:Math.cos(a)*1000,vy:Math.sin(a)*1000,r:13*A,dmg:78*st.dmg*zoneMul(),
        life:1.1,pierce:99,c:C.cyan,beam:1});
      wshake(.35);
    }else{
      const n=1+(L>=2?1:0)+(L>=4?1:0)+extraShot(), tg=near(n);
      for(let i=0;i<n;i++){const t=tg[i%Math.max(1,tg.length)];
        const a=t?Math.atan2(t.y-p.y,t.x-p.x):Math.atan2(p.dy,p.dx)+i*.35;
        G.bul.push({x:p.x,y:p.y,vx:Math.cos(a)*520,vy:Math.sin(a)*520,r:6*A,
          dmg:(11+L*5)*st.dmg*zoneMul(),life:1.5,pierce:st.pierce+(L>=5?1:0),c:C.cyan});
        if(G.stage>=2&&G.form==="rover")for(const ci of HIST_IDX()){const h=G.hist[ci];if(!h)continue;
          G.bul.push({x:h.x,y:h.y,vx:Math.cos(a)*520,vy:Math.sin(a)*520,r:5*A,
            dmg:(11+L*5)*st.dmg*zoneMul()*.45,life:1.3,pierce:st.pierce,c:C.violet});}}
    }
  }
  // 회전 검
  if(G.w.blade){
    const L=G.w.blade, evo=G.evo.tempest;
    const n=evo?6:1+(L>=2?1:0)+(L>=4?1:0);
    const rad=(evo?175:100+L*14)*A, spin=evo?3.4:2.1;
    p.tr+=dt*spin;
    const dmg=(evo?150:44+L*16)*st.dmg*zoneMul()*dt;
    G.blades=[];
    for(let i=0;i<n;i++){
      const a=p.tr+i*TAU/n, o={x:p.x+Math.cos(a)*rad,y:p.y+Math.sin(a)*rad,r:(evo?26:15)*A,a};
      G.blades.push(o);
      for(const e of G.en)if(!e.dead&&Math.hypot(e.x-o.x,e.y-o.y)<e.r+o.r)dmgE(e,dmg,0);
      if(G.boss&&Math.hypot(G.boss.x-o.x,G.boss.y-o.y)<G.boss.r+o.r)dmgB(dmg);
    }
  }
  // 연쇄 번개
  if(G.w.chain&&G.cd.chain<=0){
    const L=G.w.chain, evo=G.evo.storm;
    G.cd.chain=evo?1.1:(L>=3?1.5:2.1);
    const jumps=evo?12:2+(L>=2?1:0)+(L>=4?2:0);
    const dmg=(evo?95:26+L*13)*st.dmg*zoneMul();
    let from=p, hitset=new Set(), pts=[{x:p.x,y:p.y}];
    for(let j=0;j<jumps;j++){
      let bestD=1e9,best=null;
      for(const e of G.en){if(e.dead||hitset.has(e))continue;
        const d=Math.hypot(e.x-from.x,e.y-from.y);
        if(d<(evo?900:460)*A&&d<bestD){bestD=d;best=e;}}
      if(!best)break;
      hitset.add(best); pts.push({x:best.x,y:best.y});
      dmgE(best,dmg,1); if(evo)best.slow=1.6;
      from=best;
    }
    if(pts.length>1)G.fx.push({chain:pts,life:.22,max:.22,c:C.violet});
  }
  // 화염 흔적
  if(G.w.flame&&G.cd.flame<=0){
    const L=G.w.flame, evo=G.evo.inferno;
    G.cd.flame=evo?.45:.85;
    /* 상한선의 기준은 "기본 공속에서는 아무것도 안 바뀐다"다.
       지옥불이 기본 공속에서 4 ÷ .45 = 8.9겹이므로 9로 둔다. 8이면 기본 플레이가
       10% 깎여서, 안 건드려도 되는 것을 건드리는 셈이 된다. */
    pushPool("flame",9,{x:p.x,y:p.y,r:(evo?110:44+L*12)*A,life:(evo?4:2+L*.5),
      dps:(evo?70:16+L*7)*st.dmg*zoneMul()});
  }
  // 유도 미사일 (기동계)
  if(G.w.missile&&G.cd.missile<=0){
    const L=G.w.missile, evo=G.evo.barrage;
    G.cd.missile=evo?1.0:1.35;
    const n=(evo?4:1+(L>=2?1:0)+(L>=4?1:0))+extraShot();
    for(let i=0;i<n;i++){const a=Math.atan2(p.dy,p.dx)+Math.PI+rnd(-1.2,1.2);
      G.bul.push({x:p.x,y:p.y,vx:Math.cos(a)*300,vy:Math.sin(a)*300,r:6,dmg:(30+L*12)*st.dmg*zoneMul(),
        life:3.2,pierce:0,c:C.cyan,home:1,blast:(evo?150:70+(L>=3?25:0))*A});}
  }
  // 충격 망치 (방어계)
  if(G.w.hammer&&G.cd.hammer<=0){
    const L=G.w.hammer, evo=G.evo.quake;
    G.cd.hammer=(L>=3?1.1:1.5);
    const R=(evo?230:130+(L>=2?40:0))*A, a=Math.atan2(p.dy,p.dx), wide=evo?Math.PI:1.05;
    const dmg=(evo?140:36+L*14)*st.dmg*zoneMul(), kb=evo?160:70+(L>=4?70:0);
    for(const e of G.en){if(e.dead)continue;const d=Math.hypot(e.x-p.x,e.y-p.y);if(d>R+e.r)continue;
      let da=Math.atan2(e.y-p.y,e.x-p.x)-a;da=Math.atan2(Math.sin(da),Math.cos(da));
      if(Math.abs(da)<=wide){dmgE(e,dmg,1);const g=Math.atan2(e.y-p.y,e.x-p.x);e.x+=Math.cos(g)*kb;e.y+=Math.sin(g)*kb;}}
    if(G.boss&&Math.hypot(G.boss.x-p.x,G.boss.y-p.y)<R+G.boss.r){
      /* 보스도 밀린다 — 차폐를 신호권 밖으로 끌어내는 수단이다. 적보다는 덜 밀린다.
         각도를 먼저 잡는다: dmgB가 보스를 죽이면 G.boss가 null이라 뒤에서 읽으면 터진다 */
      const bg=Math.atan2(G.boss.y-p.y,G.boss.x-p.x);dmgB(dmg);
      if(G.boss){G.boss.x+=Math.cos(bg)*kb*.45;G.boss.y+=Math.sin(bg)*kb*.45;}}
    G.fx.push({arc:1,x:p.x,y:p.y,a,r:R,w:wide,life:.22,max:.22,c:C.gold});
    wshake(evo?.26:.18);   // 지진은 매 스윙이라 .5는 과했다
  }
  // 요새 포탑
  if(G.stage>=2&&G.form==="warden"){G.tcd-=dt;
    for(const t of G.turrets){t.a+=dt*1.2;t.x=p.x+Math.cos(t.a)*70;t.y=p.y+Math.sin(t.a)*70;}
    if(G.tcd<=0){G.tcd=.42;
      for(const t of G.turrets){const tg=near(3);const e=tg[Math.floor(Math.random()*tg.length)];if(!e)continue;
        const a=Math.atan2(e.y-t.y,e.x-t.x);
        G.bul.push({x:t.x,y:t.y,vx:Math.cos(a)*600,vy:Math.sin(a)*600,r:4,dmg:22*st.dmg*zoneMul(),life:1.2,pierce:0,c:C.gold});}}}
  // 기동계 궁극기 잔상
  if(G.ult.t>0){G.trail-=dt;
    if(G.trail<=0){G.trail=.09;G.bolts.push({x:p.x,y:p.y,r:95*A,life:.3,max:.3,dmg:55*st.dmg,done:0,cyan:1,sh:0});}}
  // 낙뢰
  if(G.w.bolt&&G.cd.bolt<=0){
    const L=G.w.bolt, evo=G.evo.maelstrom;
    G.cd.bolt=evo?.85:1.5;
    const n=evo?6:1+(L>=2?1:0)+(L>=4?2:0), rad=(evo?165:72+L*16)*A;   // 기본 Lv5가 152라 진화가 더 좁으면 약해 보인다
    for(let i=0;i<n;i++){
      let t=G.en.length?pick(G.en):null;
      const x=t?t.x:p.x+rnd(-300,300), y=t?t.y:p.y+rnd(-300,300);
      G.bolts.push({x,y,r:rad,life:.42,max:.42,dmg:(evo?120:34+L*17)*st.dmg*zoneMul(),done:0,pull:evo?1:0,lit:1,sh:.06});
    }
  }
  // 중력정 / 포식 우물
  /* 장판을 겹쳐 쌓는 화염과 달리 한 번에 하나만 산다. Lv1~2는 주기(3.6s)가
     지속(3.05~3.3s)보다 길어 잠깐 끊기고, Lv3의 「주기 단축」에서 상시 유지가 된다 —
     그게 이 무기의 실질 분기점이다. 값어치는 초당 피해가 아니라 흡인이다. */
  if(G.w.well&&G.cd.well<=0){
    const L=G.w.well, evo=G.evo.maw;
    G.cd.well=evo?2.2:(L>=3?2.8:3.6);
    const t=near(1)[0];
    const x=t?t.x:p.x+p.dx*140, y=t?t.y:p.y+p.dy*140;
    /* 기본 공속에서 1.4~1.7겹. 3이면 "우물 하나"라는 성격을 지키면서 여유가 있다 */
    pushPool("well",3,{x,y,r:(evo?215:110+L*16)*A,life:evo?3.8:2.8+L*.25,
      dps:(evo?105:24+L*10)*st.dmg*zoneMul(),
      pull:evo?300:110+(L>=4?90:0),vio:1});
  }
  // 굴절 빔 / 프리즘 격자
  if(G.w.prism&&G.cd.prism<=0){
    const L=G.w.prism, evo=G.evo.lattice;
    G.cd.prism=evo?1.15:(L>=3?1.35:1.8);
    const cnt=(evo?4:2+(L>=2?1:0))+extraShot(), base=Math.atan2(p.dy,p.dx);
    for(let i=0;i<cnt;i++){const a=base+i*TAU/cnt;
      G.bul.push({x:p.x,y:p.y,vx:Math.cos(a)*740,vy:Math.sin(a)*740,r:(evo?11:7)*A,
        dmg:(evo?76:22+L*10)*st.dmg*zoneMul(),life:1.25,
        pierce:evo?99:st.pierce+2+(L>=4?2:0),c:C.pale,beam:1});}
  }
  // 공명침 / 공명 폭주
  if(G.w.needle&&G.cd.needle<=0){
    const L=G.w.needle, evo=G.evo.overdrive;
    G.cd.needle=evo?.55:(L>=3?.7:.95);
    const hops=evo?99:2+(L>=2?1:0)+(L>=4?2:0), dmg=(evo?60:18+L*7)*st.dmg*zoneMul();
    let from=near(1)[0], pts=[{x:p.x,y:p.y}], hit=new Set();
    for(let h=0;h<hops&&from;h++){
      if(from===G.boss){dmgB(dmg);pts.push({x:from.x,y:from.y});break;}
      hit.add(from);pts.push({x:from.x,y:from.y});dmgE(from,dmg,1);
      if(!from.dead)break;                                   // 못 죽였으면 여기서 끊긴다
      let best=null,bd=1e9;
      for(const e of G.en){if(e.dead||hit.has(e))continue;const d=Math.hypot(e.x-from.x,e.y-from.y);
        if(d<260*A&&d<bd){bd=d;best=e;}}
      from=best;}
    if(pts.length>1)G.fx.push({chain:pts,life:.2,max:.2,c:C.pink});
  }
  /* 권능 · 응시 — 0.5초마다 가장 먼 적 하나를 직격한다. 가까운 것만 노리는 자동 무기들과
     반대 방향이라, 빌드가 못 닿는 곳(관측자·배회체)을 메운다 */
  if(G.ang.gaze){G.gazeT-=dt;
    if(G.gazeT<=0){G.gazeT=.5;let far=null,fd=0;
      for(const e of G.en){if(e.dead)continue;const d=Math.hypot(e.x-p.x,e.y-p.y);if(d<720&&d>fd){fd=d;far=e;}}
      if(far){dmgE(far,34*st.dmg*zoneMul(),1);
        G.fx.push({chain:[{x:p.x,y:p.y},{x:far.x,y:far.y}],life:.18,max:.18,c:C.pale});}}}
  /* 권능 · 파편 — 회전 검의 작은 판. 검이 없는 빌드에 근접 방어를 준다 */
  if(G.ang.shard){G.shardA+=dt*2.6;
    const rad=112*A,dmg=26*st.dmg*zoneMul()*dt;G.shards=[];
    for(let i=0;i<3;i++){const g=G.shardA+i*TAU/3,o={x:p.x+Math.cos(g)*rad,y:p.y+Math.sin(g)*rad,r:9*A};
      G.shards.push(o);
      for(const e of G.en)if(!e.dead&&Math.hypot(e.x-o.x,e.y-o.y)<e.r+o.r)dmgE(e,dmg,0);
      if(G.boss&&Math.hypot(G.boss.x-o.x,G.boss.y-o.y)<G.boss.r+o.r)dmgB(dmg);}}
}
/* 장판은 주기가 공속으로 나뉘는데 지속은 고정이라, 공속이 오르면 무한히 쌓인다.
   실측(공속 7.89): 화염 흔적 70겹, 포식 우물 13겹.
   화면이 한 색으로 덮이는 것보다 나쁜 건 pools()가 장판마다 피해를 따로 주는
   것이다 — 13겹이면 DPS도 13배다. 의도한 수치가 아니다.
   같은 무기의 오래된 장판을 잘라 상한을 지킨다. */
function pushPool(k,cap,o){
  o.k=k;
  let c=0;for(const q of G.pool)if(q.k===k)c++;
  while(c>=cap){
    const i=G.pool.findIndex(q=>q.k===k);
    if(i<0)break;
    G.pool.splice(i,1);c--;}
  G.pool.push(o);
}
/* 투사체 +1 — 권능 분신탄, 임계(공진 3차 · 공명 40 이상) */
const extraShot=()=>(G.ang.twin ?1:0)+((G.form==="pulse"&&G.stage>=3&&G.res>=40)?1:0);
function addRes(){G.res=Math.min(G.resCap,G.res+1+(Math.random()<G.st.resBeat?1:0));G.resT=0;}
function near(n){const p=G.p,a=[];
  for(const e of G.en)if(!e.dead)a.push([Math.hypot(e.x-p.x,e.y-p.y),e]);
  if(G.boss&&!(G.boss.ang&&ANGELS[G.boss.ang].ghost))a.push([Math.hypot(G.boss.x-p.x,G.boss.y-p.y),G.boss]);
  a.sort((x,y)=>x[0]-y[0]);return a.slice(0,n).map(x=>x[1]);}

/* byKill = 처치로 인한 유폭. 공격이 자동이라 플레이어는 자폭체를 제 옆에서 죽이게
   되는데, 접촉과 똑같이 처벌하면 자기 공격에 자기가 맞는 꼴이 된다.
   처치는 보상이어야 하므로 반경·피해·흔들림을 낮춘다. 적에게 주는 유폭은 그대로. */
function explodeE(e,byKill){
  if(e.dead)return;e.dead=1;G.kills++;
  if(G.st.drain)G.p.hp=Math.min(G.p.mhp,G.p.hp+G.st.drain);
  if(G.form==="pulse")addRes();
  const br=byKill?60:100, bd=byKill?Math.round(e.dmg*.45):e.dmg;
  G.bolts.push({x:e.x,y:e.y,r:br,life:.35,max:.35,dmg:0,done:1,red:1});
  if(Math.hypot(G.p.x-e.x,G.p.y-e.y)<br+G.p.r)hitP(bd,"자폭체 폭발");
  for(const o of G.en)if(o!==e&&!o.dead&&Math.hypot(o.x-e.x,o.y-e.y)<100)dmgE(o,60,0);
  shake=Math.max(shake,byKill?.28:.5);SFX.bomb();
}
/* 차폐기 아우라 — 자기 자신은 못 지킨다. 그래야 "저것부터 죽여라"가 읽힌다.
   이 게임 최초의 처리 순서 결정이다. */
function dmgE(e,d,showNum){
  if(G.shl.length&&!e.aura)for(const sh of G.shl)
    if(Math.hypot(e.x-sh.x,e.y-sh.y)<sh.aura){d*=.55;break;}
  if(e.tr==="armor")d*=TRAITS.armor.d;
  /* 치명은 직접 타격에만 건다. 장판·불길은 초당 수십 틱이라 거기까지 굴리면
     "가끔 크게"가 아니라 그냥 평균 피해 상승이 되고, 숫자도 못 읽는다. */
  let crit=0;
  if(showNum&&G.st.crit&&Math.random()<G.st.crit){d*=2.2;crit=1;}
  e.hp-=d; e.hit=.1;
  if(showNum&&e.hp>0&&Math.random()<.55){    // 직접 타격에만 스파크가 튄다
    const a=rnd(0,TAU);
    for(let i=0;i<2;i++)G.fx.push({x:e.x,y:e.y,vx:Math.cos(a+rnd(-.7,.7))*rnd(70,150),
      vy:Math.sin(a+rnd(-.7,.7))*rnd(70,150),life:.18,max:.18,c:"#ffffff"});}
  if(showNum&&d>=1)G.num.push({x:e.x,y:e.y-e.r,v:Math.round(d),life:.65,c:crit?C.gold:C.pale});
  if(e.hp<=0&&!e.dead){
    e.dead=1;G.kills++;SFX.kill();
    if(G.st.drain)G.p.hp=Math.min(G.p.mhp,G.p.hp+G.st.drain);
    if(G.form==="pulse")addRes();
    if(G.ang.leech)G.p.hp=Math.min(G.p.mhp,G.p.hp+.4);           // 권능 · 흡수관
    if(G.ang.crown&&Math.random()<.05)for(let q=0;q<e.xp;q++)     // 권능 · 관 — 구슬 두 배
      G.fx.push({x:e.x+rnd(-10,10),y:e.y+rnd(-10,10),xp:1});
    /* 연쇄 붕괴 — 여기서 dmgE를 다시 부르면 연쇄가 재귀로 터진다.
       bolts에 얹어 다음 프레임의 pools()가 처리하게 한다. 프레임 단위로
       퍼지므로 저절로 멈추고, 처치 수도 두 번 세지 않는다. */
    if(G.ct.casc)G.bolts.push({x:e.x,y:e.y,r:96*G.st.area,life:.3,max:.3,
      dmg:44*G.st.dmg,done:0,red:1,sh:.05,hurtP:1});
    /* 권능 · 촉수. 계약 연쇄 붕괴와 같은 경로(다음 프레임의 bolts)라 재귀가 없다 */
    if(G.ang.tendril&&Math.random()<.5)G.bolts.push({x:e.x,y:e.y,r:70*G.st.area,life:.28,max:.28,
      dmg:28*G.st.dmg,done:0,sh:0});
    if(e.split)for(let i=0;i<3;i++){const a=i/3*TAU;G.en.push(makeE("mote",e.x+Math.cos(a)*18,e.y+Math.sin(a)*18,false));}
    if(e.bomb||e.tr==="volat"){explodeE(Object.assign({},e,{dead:0,dmg:e.bomb?e.dmg:26}),true);}if(G.form&&G.form!=="none")G.ult.c=Math.min(G.ult.max,G.ult.c+G.st.ultG);
    for(let i=0;i<e.xp;i++)G.fx.push({x:e.x+rnd(-10,10),y:e.y+rnd(-10,10),xp:1});
    G.fx.push({x:e.x,y:e.y,vx:0,vy:0,life:.26,max:.26,ring:e.r*1.5,rc:e.c,rw:2});
    for(let i=0;i<11;i++){const a=rnd(0,TAU),v=rnd(90,260);
      G.fx.push({x:e.x,y:e.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rnd(.3,.55),max:.55,c:e.c});}
    if(e.elite){hitstop=.06;shake=Math.max(shake,.5);dropItem(e.x,e.y,"chest");}
  }
}
function dmgB(d){const b=G.boss;if(!b)return;
  const A=b.ang?ANGELS[b.ang]:null;
  /* 무적 — 추적자는 신호권 안에서, 차폐는 닫혀 있을 때. 「무효」가 떠야 버그로 안 읽힌다 */
  if(A&&A.shielded&&A.shielded(b)){b.hit=.05;
    if(Math.random()<.12)G.num.push({x:b.x,y:b.y-b.r,v:"무효",life:.5,c:C.pale});return;}
  if(A&&A.capHit)d=A.capHit(b,d);   // 모루 — 한 방 큰 공격에 상한
  b.hp-=d;b.hit=.09;
  if(A&&A.onHit)A.onHit(b);
  if(b.hp<=0){const fin=b.fin;
    for(let i=0;i<(fin?120:40);i++)G.fx.push({x:b.x,y:b.y,vx:rnd(-340,340)*(fin?1.8:1),vy:rnd(-340,340)*(fin?1.8:1),life:fin?1.4:.9,max:fin?1.4:.9,c:fin?C.pink:C.gold});
    G.boss=null;shake=fin?2.2:1.1;hitstop=fin?.3:.14;
    G.bosses++;G.bossT=100/G.pace;
    const p=G.p;p.hp=Math.min(p.mhp,p.hp+p.mhp*.35);   // 격파 보상 — 다음 파도를 버틸 여지
    /* 사도를 잡아도 경험치가 0이었다 — 30~60초 싸운 대가가 없었다. 레벨 두셋 값을 준다.
       보상 카드를 고른 뒤에 주는 이유: 지금 주면 레벨업 화면이 보상 화면을 덮는다. */
    const bxp=p.need*(2.6+G.bosses*.7);
    if(fin){gainXp(bxp);G.pend=0;
      G.ended=true;G.endNow=true;G.cleared=true;G.eb.length=0;call("종단 격파 — 중계 완료");finish(true);return;}
    G.bossXp=bxp;
    if(A&&A.onDeath)A.onDeath(b);
    G.cleared=true;
    if(A){G.lastAng=b.ang;G.lastNo=b.no;showReward(A);}
    else call("재머 격파");}
}
/* 사도의 힘 — 셋 중 하나. 권능만 주면 매번 같은 선택이 되고,
   셋이면 「지금 뭐가 급한가」가 결정이 된다. */
function showReward(A){
  G.ctMode=false;mode="level";
  $("#lvtag").textContent="제"+(G.lastNo||"")+"사도 "+A.n+" 격파";
  $("#v-level h2").textContent="사도의 힘 — 하나를 가져간다  (고르면 경험치도 들어옵니다)";
  $("#lvtools").style.display="none";
  const have=!!G.ang[A.rw.id];
  const opts=[
    have?{t:"잔향",d:"이미 가진 권능 — 대신 최대 체력 +60",c:A.c,k:"권능",f:()=>{G.p.mhp+=60;G.p.hp=Math.min(G.p.mhp,G.p.hp+60);}}
        :{t:A.rw.n,d:A.rw.d,c:A.c,k:"권능",f:()=>{G.ang[A.rw.id]=1;
            /* 즉시 스탯에 얹히는 권능은 여기서 한 번만 건다 */
            if(A.rw.id==="gear")G.st.rate*=1.2;
            if(A.rw.id==="temper"){G.p.mhp+=120;G.p.hp=Math.min(G.p.mhp,G.p.hp+120);}
            if(A.rw.id==="lens")G.p.mag*=2;
            if(A.rw.id==="surf")G.p.spd*=1.15;
            call(A.rw.n+" 얻음");}},

function hitP(d,src){const p=G.p;if(p.inv>0)return;
  if(G.form==="rover"&&G.moving&&Math.random()<.30){p.inv=.25;G.num.push({x:p.x,y:p.y-24,v:"회피",life:.6,c:C.cyan});return;}
  if(G.form==="warden"&&G.shield.up){G.shield.up=false;G.shield.cd=7.5;p.inv=.4;
    G.num.push({x:p.x,y:p.y-24,v:"방패",life:.6,c:C.gold});SFX.block();G.fx.push({x:p.x,y:p.y,vx:0,vy:0,life:.35,max:.35,ring:70});return;}
  if(G.ang.plate&&G.plate.up){G.plate.up=false;G.plate.cd=6;p.inv=.4;
    G.num.push({x:p.x,y:p.y-24,v:"장갑",life:.6,c:"#7fe3b0"});SFX.block();
    G.fx.push({x:p.x,y:p.y,vx:0,vy:0,life:.35,max:.35,ring:70,rc:"#7fe3b0"});return;}
  if(G.form==="warden"&&p.in)d*=.75;   // -35% → -25%. 원 안 배수와 겹쳐 이중으로 강했다
  p.hp-=d;p.inv=.6;p.flash=.25;shake=Math.max(shake,.5);hitstop=.03;SFX.hurt();G.lastHit=src||"접촉";
  /* 권능 · 반사판 — 받은 피해의 40%를 주변에. 계약 반사막과 같은 경로라 같이 터진다 */
  if(G.ang.mirror)G.bolts.push({x:p.x,y:p.y,r:150*G.st.area,life:.3,max:.3,
    dmg:d*.4,done:0,pink:1,sh:.08});
  /* 반사막 — 맞은 자리에서 터진다. 증폭기는 타되 신호권 배수는 안 탄다.
     맞는 자리는 내가 고른 자리가 아니라서 신호권을 보상으로 걸 근거가 없다. */
  if(G.st.thorn)G.bolts.push({x:p.x,y:p.y,r:140*G.st.area,life:.32,max:.32,
    dmg:G.st.thorn*G.st.dmg,done:0,pink:1,sh:.1});}

function enemies(dt){const p=G.p;
  /* 차폐기 목록을 프레임마다 한 번만 모은다 — dmgE는 초당 수백 번 불리므로
     거기서 전체 적을 훑으면 안 된다. 보통 0~3마리다. */
  G.shl.length=0;
  for(const e of G.en)if(e.aura&&!e.dead)G.shl.push(e);
  for(let i=G.en.length-1;i>=0;i--){const e=G.en[i];
    if(e.dead){G.en.splice(i,1);continue;}
    e.hit=Math.max(0,e.hit-dt);e.slow=Math.max(0,e.slow-dt);
    const a=Math.atan2(p.y-e.y,p.x-e.x);let s=e.spd*(e.slow>0?.35:1);
    if(e.tr==="rage"&&e.hp<e.mhp*.5)s*=1.7;
    if(e.tr==="regen")e.hp=Math.min(e.mhp,e.hp+e.mhp*.02*dt);
    if(e.tr==="blink"){e.bt-=dt;
      if(e.bt<=0&&Math.hypot(p.x-e.x,p.y-e.y)>150){e.bt=2.6;
        e.x+=Math.cos(a)*130;e.y+=Math.sin(a)*130;
        G.fx.push({x:e.x,y:e.y,vx:0,vy:0,life:.25,max:.25,ring:e.r*2,rc:TRAITS.blink.c,rw:2});}}
    if(G.final&&G.form==="warden"&&Math.hypot(e.x-G.zone.x,e.y-G.zone.y)<G.zone.r)s*=.72;
    if(G.outT>30)s*=1.2;
    s*=sevMul("espd")*G.st.eSpd;
    const dist=Math.hypot(p.x-e.x,p.y-e.y);
    if(e.ranged){
      if(dist>300){e.x+=Math.cos(a)*s*dt;e.y+=Math.sin(a)*s*dt;}
      else if(dist<200){e.x-=Math.cos(a)*s*.6*dt;e.y-=Math.sin(a)*s*.6*dt;}
      else{e.x+=Math.cos(a+Math.PI/2)*s*.5*dt;e.y+=Math.sin(a+Math.PI/2)*s*.5*dt;}
      e.fire-=dt;if(e.fire<=0&&dist<520){e.fire=2.3;
        G.eb.push({x:e.x,y:e.y,vx:Math.cos(a)*230,vy:Math.sin(a)*230,r:6,dmg:e.dmg,life:3});}
    }else if(e.orbit){
      /* 배회체 — 일정 반경으로 수렴한 뒤 접선 방향으로 돈다. 가만히 있으면
         포위망이 조여지므로 "제자리에서 쏘기"가 안 통한다. */
      const pull=Math.max(-1,Math.min(1,(dist-e.orbit)/70));
      const tanW=1-Math.abs(pull)*.5;
      let vx=Math.cos(a)*pull+Math.cos(a+Math.PI/2*e.dir)*tanW;
      let vy=Math.sin(a)*pull+Math.sin(a+Math.PI/2*e.dir)*tanW;
      const L=Math.hypot(vx,vy)||1;
      e.x+=vx/L*s*dt;e.y+=vy/L*s*dt;
      e.ot-=dt;
      if(e.ot<=0){e.ot=rnd(3.4,5.2);e.lunge=.65;}          // 가끔 파고든다
      if(e.lunge>0){e.lunge-=dt;e.x+=Math.cos(a)*s*1.5*dt;e.y+=Math.sin(a)*s*1.5*dt;}
    }else if(e.snipe){
      /* 관측자 — 멀리 붙어서 예고 후 예측 사격. 거리가 안전을 보장하지 않게 만든다.
         예고(chg)가 보이는 동안 움직이면 빗나간다. */
      if(dist<e.snipe*.85){e.x-=Math.cos(a)*s*dt;e.y-=Math.sin(a)*s*dt;}
      else if(dist>e.snipe*1.05){e.x+=Math.cos(a)*s*dt;e.y+=Math.sin(a)*s*dt;}
      else{e.x+=Math.cos(a+Math.PI/2*e.dir)*s*.45*dt;e.y+=Math.sin(a+Math.PI/2*e.dir)*s*.45*dt;}
      if(e.chg>0){e.chg-=dt;
        if(e.chg<=0){e.fire=rnd(3.1,3.9);
          const lead=dist/620;                              // 탄속 620 기준 예측 (사수는 230)
          const b=Math.atan2(p.y+p.dy*p.spd*lead*.55-e.y, p.x+p.dx*p.spd*lead*.55-e.x);
          G.eb.push({x:e.x,y:e.y,vx:Math.cos(b)*620,vy:Math.sin(b)*620,r:7,dmg:e.dmg,life:3});
          SFX.block();}
      }else{e.fire-=dt;if(e.fire<=0&&dist<900)e.chg=1.1;}
    }else if(e.flee){
      /* 분열의 파편·군체의 조각 — 신호권 중심에서 달아난다. 안이면 밖으로,
         밖이면 원 가장자리를 따라 돈다. 권내 딜로는 못 잡는다는 게 성질이다. */
      let zx=G.zone.x-e.x,zy=G.zone.y-e.y,zd=Math.hypot(zx,zy);
      if(zd<1){zx=Math.cos(e.ph);zy=Math.sin(e.ph);zd=1;}   // 정확히 중심이면 방향이 0이라 얼어붙는다
      if(zd<G.zone.r*1.25){e.x-=zx/zd*s*dt;e.y-=zy/zd*s*dt;}
      else{const t=Math.atan2(-zy,-zx)+Math.PI/2*(e.dir||1);e.x+=Math.cos(t)*s*.6*dt;e.y+=Math.sin(t)*s*.6*dt;}
    }else if(e.hunt){
      /* 멀수록 빨라진다. 거리를 벌려도 소용없다는 걸 몸으로 알게 된다. */
      const sp=s*(1+Math.min(1.7,dist/380));
      e.x+=Math.cos(a)*sp*dt;e.y+=Math.sin(a)*sp*dt;
    }else{e.x+=Math.cos(a)*s*dt;e.y+=Math.sin(a)*s*dt;}
    e.ph+=dt*6;
    if(dist<p.r+e.r){
      if(e.bomb){explodeE(e);continue;}
      hitP(e.dmg,NAMEK[e.kind]);}
    if(Math.hypot(p.x-e.x,p.y-e.y)>Math.max(W,H)*1.6)G.en.splice(i,1);}
}
/* 종단 재머 — 체력에 따라 패턴이 바뀐다. 링(넓게 퍼져) → 나선(계속 움직이게)
   → 수렴(빈틈을 찾게). 소환도 단계마다 다른 종류를 부른다.
   같은 공격이 더 아프기만 한 보스는 길기만 하고 안 무섭다. */
function finalBoss(dt,b,a){
  const f=b.hp/b.mhp, ph=f>.6?1:f>.3?2:3;
  if(ph!==b.ph){b.ph=ph;shake=Math.max(shake,1.1);hitstop=.1;
    call("종단 재머 · "+ph+"단계");SFX.warn();
    for(let i=0;i<50;i++)G.fx.push({x:b.x,y:b.y,vx:rnd(-420,420),vy:rnd(-420,420),life:.85,max:.85,c:C.pink});}
  b.spd=86+ph*16;
  b.fire-=dt;
  if(b.fire<=0){b.fire=ph===1?1.5:1.9;b.ring+=.28;
    const n=16+ph*4;
    for(let i=0;i<n;i++){const g=b.ring+i*TAU/n;
      G.eb.push({x:b.x,y:b.y,vx:Math.cos(g)*210,vy:Math.sin(g)*210,r:8,dmg:15,life:4});}}
  if(ph>=2){b.spiral-=dt;                                   // 나선 — 제자리에 못 서 있게
    if(b.spiral<=0){b.spiral=.16;b.ring+=.42;
      for(let i=0;i<2;i++){const g=b.ring+i*Math.PI;
        G.eb.push({x:b.x,y:b.y,vx:Math.cos(g)*260,vy:Math.sin(g)*260,r:7,dmg:12,life:3.4});}}}
  if(ph>=3){b.conv-=dt;                                     // 수렴 — 빈틈이 반드시 하나 있다
    if(b.conv<=0){b.conv=3.4;
      const p=G.p,R0=640,n=26,gap=Math.floor(rnd(0,n)),gw=4;
      for(let i=0;i<n;i++){
        if((i-gap+n)%n<gw)continue;
        const g=i/n*TAU;
        G.eb.push({x:p.x+Math.cos(g)*R0,y:p.y+Math.sin(g)*R0,
          vx:-Math.cos(g)*250,vy:-Math.sin(g)*250,r:7,dmg:16,life:3.2});}
      call("수렴");}}
  b.summon-=dt;
  if(b.summon<=0){b.summon=8-ph;
    const k=ph===1?"tank":ph===2?"orbiter":"sniper";
    for(let i=0;i<3+ph;i++)spawnE(k,false);}
}
function boss(dt){const b=G.boss;if(!b)return;const p=G.p;
  b.age=(b.age||0)+dt;
  b.hit=Math.max(0,b.hit-dt);
  const a=Math.atan2(p.y-b.y,p.x-b.x), A=b.ang?ANGELS[b.ang]:null;
  if(!(A&&A.move&&A.move(dt,b,a))){b.x+=Math.cos(a)*b.spd*dt;b.y+=Math.sin(a)*b.spd*dt;}
  if(!(A&&A.ghost)&&Math.hypot(p.x-b.x,p.y-b.y)<p.r+b.r)
    hitP(b.dmg,b.fin?"제"+b.no+"사도 종단":A?"제"+b.no+"사도 "+A.n:"재머");
  if(b.fin){finalBoss(dt,b,a);return;}
  if(A){A.f(dt,b,a);return;}
  /* 아래는 사도가 없을 때의 예비 경로다 — 로스터가 비는 일은 없어야 한다 */
  b.fire-=dt;
  if(b.fire<=0){b.fire=1.5;b.ring+=.3;
    for(let i=0;i<14;i++){const g=b.ring+i*TAU/14;
      G.eb.push({x:b.x,y:b.y,vx:Math.cos(g)*205,vy:Math.sin(g)*205,r:8,dmg:14,life:4});}}
  b.summon-=dt;
  if(b.summon<=0){b.summon=7;for(let i=0;i<4;i++)spawnE("tank",false);}
}
function bullets(dt){
  for(let i=G.bul.length-1;i>=0;i--){const b=G.bul[i];
    if(b.home){const t=(b.tg&&!b.tg.dead)?b.tg:(b.tg=near(1)[0]);
      if(t){const want=Math.atan2(t.y-b.y,t.x-b.x),cur=Math.atan2(b.vy,b.vx);
        let d=want-cur;d=Math.atan2(Math.sin(d),Math.cos(d));
        const na=cur+d*Math.min(1,5.5*dt),sp=Math.min(560,Math.hypot(b.vx,b.vy)+380*dt);
        b.vx=Math.cos(na)*sp;b.vy=Math.sin(na)*sp;}
      if(Math.random()<.5)G.fx.push({x:b.x,y:b.y,vx:0,vy:0,life:.25,max:.25,c:C.cyan});}
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;let gone=b.life<=0;
    if(!gone)for(const e of G.en){
      if(e.dead||(b.hs&&b.hs.has(e)))continue;
      if(Math.hypot(e.x-b.x,e.y-b.y)<e.r+b.r){
        if(e.absorb&&!b.beam){dmgE(e,b.dmg,1);gone=1;break;}
        if(b.blast){G.bolts.push({x:b.x,y:b.y,r:b.blast,life:.3,max:.3,dmg:b.dmg,done:0,cyan:1,sh:.1});gone=1;break;}
        dmgE(e,b.dmg,1);
        if(b.pierce>0){b.pierce--;(b.hs||(b.hs=new Set())).add(e);}else{gone=1;break;}}}
    if(!gone&&G.boss&&!b.bh&&Math.hypot(G.boss.x-b.x,G.boss.y-b.y)<G.boss.r+b.r){
      dmgB(b.dmg);if(b.pierce>0){b.pierce--;b.bh=1;}else gone=1;}
    if(gone)G.bul.splice(i,1);}
  const p=G.p;
  for(let i=G.eb.length-1;i>=0;i--){const b=G.eb[i];
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(Math.hypot(p.x-b.x,p.y-b.y)<p.r+b.r){hitP(b.dmg,"적 탄환");G.eb.splice(i,1);continue;}
    if(b.life<=0)G.eb.splice(i,1);}
}
function pools(dt){
  for(let i=G.pool.length-1;i>=0;i--){const q=G.pool[i];q.life-=dt;
    /* 흡인 반경은 피해 반경의 2.2배 — 밖에 있던 적을 안으로 가져와야 의미가 있다.
       d*.9 로 묶어서 우물 중심을 지나쳐 튕겨 나가지 않게 한다. */
    if(q.pull)for(const e of G.en){if(e.dead)continue;
      const dx=q.x-e.x,dy=q.y-e.y,d=Math.hypot(dx,dy);
      if(d>4&&d<q.r*2.2){const k=Math.min(q.pull*dt,d*.9)/d;e.x+=dx*k;e.y+=dy*k;}}
    if(q.pull&&G.boss){const dx=q.x-G.boss.x,dy=q.y-G.boss.y,d=Math.hypot(dx,dy);
      if(d>4&&d<q.r*2.2){const k=Math.min(q.pull*.4*dt,d*.9)/d;G.boss.x+=dx*k;G.boss.y+=dy*k;}}
    for(const e of G.en)if(!e.dead&&Math.hypot(e.x-q.x,e.y-q.y)<e.r+q.r)dmgE(e,q.dps*dt,0);
    if(G.boss&&Math.hypot(G.boss.x-q.x,G.boss.y-q.y)<G.boss.r+q.r)dmgB(q.dps*dt);
    if(q.life<=0)G.pool.splice(i,1);}
  for(let i=G.bolts.length-1;i>=0;i--){const z=G.bolts[i];z.life-=dt;
    if(!z.done&&z.life<z.max*.66){z.done=1;
      for(const e of G.en)if(!e.dead&&Math.hypot(e.x-z.x,e.y-z.y)<e.r+z.r)dmgE(e,z.dmg,1);
      /* 자기 폭풍 — 떨어진 자리로 끌어당긴다. 뭉쳐 놔야 다음 벼락이 여럿을 문다. */
      if(z.pull)for(const e of G.en){if(e.dead)continue;
        const dx=z.x-e.x,dy=z.y-e.y,d=Math.hypot(dx,dy);
        if(d>1&&d<z.r*2.4){const k=Math.min(60,d*.45)/d;e.x+=dx*k;e.y+=dy*k;}}
      if(G.boss&&Math.hypot(G.boss.x-z.x,G.boss.y-z.y)<G.boss.r+z.r)dmgB(z.dmg);
      /* 대가 — 내가 낸 폭발이 나에게도 닿는다. 무적 시간(0.6s)이 연타를 막는다 */
      if(z.hurtP&&Math.hypot(G.p.x-z.x,G.p.y-z.y)<z.r+G.p.r)hitP(11,"연쇄 붕괴");
      /* 자주 터지는 것(화염 흔적 초당 11개, 자기 폭풍 0.85초마다 6개)이 매번
         .18씩 갱신하면 흔들림이 감쇠할 틈이 없다. 종류별로 몫을 정해 준다. */
      wshake(z.sh!==undefined?z.sh:.18);}
    if(z.life<=0)G.bolts.splice(i,1);}
  /* 피해는 life<max*.66에서 한 번만 준다. 그래서 done 처리된 낙뢰를 잘라도
     피해 손실이 없다. 화면 겹침과 프레임 비용만 줄어든다.
     궁극기 고리(gold)는 한 번뿐인 연출이라 남긴다. */
  if(G.bolts.length>12)
    for(let i=0;i<G.bolts.length&&G.bolts.length>12;){
      if(G.bolts[i].done&&!G.bolts[i].gold)G.bolts.splice(i,1);else i++;}
}
function dropItem(x,y,type){G.items.push({x,y,type,ph:rnd(0,TAU)});}

function fx(dt){const p=G.p;

    if(f.xp){
      const d=Math.hypot(p.x-f.x,p.y-f.y);

    if(!G.evo[e.id]&&(G.lvls[e.w]||0)>=4&&(G.lvls[e.p]||0)>=3)return true;
  const slots=Object.keys(G.w).length;
  for(const k in WEAPONS){const Wd=WEAPONS[k];
    if(Wd.only&&Wd.only!==G.form&&G.form!=="none")continue;

    if(n>0&&n<5&&!isEvolved(k))return true;}
  for(const k in PASSIVES){const Pd=PASSIVES[k];

    if(o){pool.push(o);if(fav.includes(k))pool.push(o);if(Wd.only&&n===0)pool.push(o);}}

  /* 자리보다 카드가 적으면 풀이 마른 것이라 다시 뽑아도 같은 패가 나온다 */

const hasContracts=()=>CONTRACTS.some(c=>(G.ct[c.id]||0)<c.max);

/* 정전 마스크.
   구멍이 둘(신호권·발밑)이고 서로 겹칠 수 있다. 한 번의 evenodd 채우기로는
   안 된다 — 겹친 영역이 교차수 홀수가 되어 어둠이 되돌아온다(실제로 그렇게 나왔다).
   같은 레이어에서 destination-out을 하면 게임 화면까지 지워진다(그것도 당했다).
   그래서 별도 캔버스에 어둠을 만들어 구멍을 뚫고 통째로 얹는다.
   해상도는 절반이다 — 부드러운 마스크라 눈에 안 보이고 채우는 픽셀이 1/4이 된다. */
const DARK_S=.5;
let DARK=null,DARKW=0,DARKH=0;
function blackoutMask(zx,zy,zr,pxx,pyy,pr,A){
  const w=Math.ceil(W*DARK_S), h=Math.ceil(H*DARK_S);
  if(!DARK||DARKW!==w||DARKH!==h){
    DARK=document.createElement("canvas");DARK.width=w;DARK.height=h;DARKW=w;DARKH=h;}
  const g=DARK.getContext("2d");
  g.globalCompositeOperation="source-over";
  g.clearRect(0,0,w,h);
  g.fillStyle="#03050c";g.fillRect(0,0,w,h);
  g.globalCompositeOperation="destination-out";
  const hole=(hx,hy,hr)=>{
    hx*=DARK_S;hy*=DARK_S;hr*=DARK_S;
    const rg=g.createRadialGradient(hx,hy,hr*.6,hx,hy,hr);
    rg.addColorStop(0,"rgba(0,0,0,1)");rg.addColorStop(1,"rgba(0,0,0,0)");
    g.fillStyle=rg;g.beginPath();g.arc(hx,hy,hr,0,TAU);g.fill();};
  if(zr>0)hole(zx,zy,zr);   // 장막은 신호권 구멍이 없다 — 발밑만 보인다
  hole(pxx,pyy,pr);
  cx.save();cx.globalAlpha=A;cx.drawImage(DARK,0,0,W,H);cx.restore();
}
/* 성운 — 매 프레임 그라디언트를 만들지 않도록 512 타일에 한 번만 굽는다 */
let NEB=null;
function makeNeb(){
  const c=document.createElement("canvas");c.width=c.height=512;
  const g=c.getContext("2d");
  [["58,42,122",.34],["30,74,106",.26],["92,40,92",.22],["40,64,130",.20]].forEach(b=>{
    const x=rnd(80,432),y=rnd(80,432),r=rnd(140,240);
    const rg=g.createRadialGradient(x,y,0,x,y,r);
    rg.addColorStop(0,`rgba(${b[0]},${b[1]})`);rg.addColorStop(1,`rgba(${b[0]},0)`);
    g.fillStyle=rg;g.fillRect(0,0,512,512);});

}
/* 배경 한 장으로 굽기 — 그라디언트와 성운을 매 프레임 다시 칠하지 않는다.
   성운은 가장 먼 층이라 화면에 고정해도 어색하지 않다. */
let BGC=null,BGW=0,BGH=0;
function bakeBG(){
  BGC=document.createElement("canvas");BGC.width=Math.ceil(W);BGC.height=Math.ceil(H);
  BGW=W;BGH=H;
  const g=BGC.getContext("2d");
  const bg=g.createRadialGradient(W/2,H*.42,60,W/2,H*.5,Math.max(W,H)*.8);
  bg.addColorStop(0,"#0e1430");bg.addColorStop(1,"#05070f");
  g.fillStyle=bg;g.fillRect(0,0,W,H);
  if(!NEB)NEB=makeNeb();
  g.globalAlpha=.55;
  const NS=760;
  for(let x=-NS*.4;x<W;x+=NS)for(let y=-NS*.4;y<H;y+=NS)g.drawImage(NEB,x,y,NS,NS);
}
/* 별 3단 — 멀수록 어둡고 작다 */
const STARB=[{lo:.2,hi:.5,c:"rgba(150,170,240,.22)"},
             {lo:.5,hi:.78,c:"rgba(175,195,255,.40)"},
             {lo:.78,hi:1.01,c:"rgba(215,230,255,.68)"}];
function draw(){
  const p=G.p,sx=shake?rnd(-shake*11,shake*11):0,sy=shake?rnd(-shake*11,shake*11):0;
  const ox=W/2-p.x+sx, oy=H/2-p.y+sy;
  // 배경
  if(!BGC||BGW!==W||BGH!==H)bakeBG();
  cx.drawImage(BGC,0,0,W,H);
  // 별 — 3단 시차, 가까울수록 밝고 크다
  for(const band of STARB){
    cx.fillStyle=band.c;
    for(const s of G.stars){
      if(s.z<band.lo||s.z>=band.hi)continue;
      const x=((s.x+ox*s.z)%2400+2400)%2400-200, y=((s.y+oy*s.z)%1800+1800)%1800-200;
      if(x>-20&&x<W+20&&y>-20&&y<H+20)cx.fillRect(x,y,s.z*2.2,s.z*2.2);}}
  // 그리드
  cx.strokeStyle="rgba(70,90,170,.10)";cx.lineWidth=1;cx.beginPath();
  const gs=100,x0=((ox%gs)+gs)%gs,y0=((oy%gs)+gs)%gs;
  for(let x=x0;x<W;x+=gs){cx.moveTo(x,0);cx.lineTo(x,H);}
  for(let y=y0;y<H;y+=gs){cx.moveTo(0,y);cx.lineTo(W,y);}
  cx.stroke();

  // 신호권
  const zx=G.zone.x+ox, zy=G.zone.y+oy, zr=G.zone.r;
  const zg=cx.createRadialGradient(zx,zy,zr*.2,zx,zy,zr);
  zg.addColorStop(0,"rgba(255,209,102,.10)");zg.addColorStop(.75,"rgba(255,176,56,.05)");
  zg.addColorStop(1,"rgba(255,176,56,0)");
  cx.fillStyle=zg;cx.beginPath();cx.arc(zx,zy,zr,0,TAU);cx.fill();
  cx.save();cx.shadowColor=C.gold;cx.shadowBlur=22;
  cx.strokeStyle="rgba(255,209,102,.65)";cx.lineWidth=2.5;
  cx.beginPath();cx.arc(zx,zy,zr,0,TAU);cx.stroke();cx.restore();
  if(G.next){const k=1-Math.max(0,G.zt)/8;
    cx.save();cx.setLineDash([12,10]);cx.lineWidth=2;
    cx.strokeStyle=`rgba(255,209,102,${(.2+k*.6).toFixed(2)})`;
    cx.beginPath();cx.arc(G.next.x+ox,G.next.y+oy,zr,0,TAU);cx.stroke();cx.restore();}

  // 화염 장판
  /* 상한을 둬도 여덟 겹이면 한 색으로 덮인다. 겹친 수로 나눠 총량을 묶는다. */
  const pd=Math.min(1,3.5/Math.max(1,G.pool.length));
  for(const q of G.pool){const a=Math.min(1,q.life)*pd;
    const g=cx.createRadialGradient(q.x+ox,q.y+oy,2,q.x+ox,q.y+oy,q.r);
    /* 우물은 가운데가 비고 테두리가 짙다 — 불길과 반대로 칠해야 "빨려 드는 것"으로 읽힌다 */
    if(q.vio){g.addColorStop(0,`rgba(168,107,255,${.06*a})`);g.addColorStop(.7,`rgba(168,107,255,${.30*a})`);g.addColorStop(1,"rgba(120,40,220,0)");}
    else{g.addColorStop(0,`rgba(255,159,67,${.5*a})`);g.addColorStop(1,"rgba(255,60,0,0)");}
    cx.fillStyle=g;cx.beginPath();cx.arc(q.x+ox,q.y+oy,q.r,0,TAU);cx.fill();
    if(q.vio){cx.save();cx.strokeStyle=`rgba(168,107,255,${(.45*a).toFixed(2)})`;cx.lineWidth=2;
      cx.beginPath();cx.arc(q.x+ox,q.y+oy,q.r*(.6+.4*Math.abs(Math.sin(q.life*3))),0,TAU);cx.stroke();cx.restore();}}

  // 경험치 · 파티클
  cx.save();cx.shadowColor=C.cyan;cx.shadowBlur=10;
  for(const f of G.fx){if(!f.xp)continue;cx.fillStyle=C.cyan;
    cx.beginPath();cx.moveTo(f.x+ox,f.y+oy-5);cx.lineTo(f.x+ox+5,f.y+oy);
    cx.lineTo(f.x+ox,f.y+oy+5);cx.lineTo(f.x+ox-5,f.y+oy);cx.fill();}
  cx.restore();
  for(const f of G.fx){
    if(f.xp)continue;
    if(f.ring){const k=1-f.life/f.max,col=f.rc||C.gold;cx.save();cx.shadowColor=col;cx.shadowBlur=18;
      cx.globalAlpha=Math.max(0,1-k);cx.strokeStyle=col;cx.lineWidth=f.rw||3;
      cx.beginPath();cx.arc(f.x+ox,f.y+oy,f.ring*(.5+k),0,TAU);cx.stroke();cx.restore();continue;}
    /* 지진은 wide=π라 "부채꼴"이 아니라 360도 원판이었다. 반경 230×확장기(2.1)=483px를
       55% 알파로 통째로 칠하고, 스윙마다(공속 오르면 0.14초마다) 새로 깔렸다.
       화면이 금색으로 덮이고 스윙 리듬대로 깜빡여 「못 하겠다」는 말이 나왔다.
       채우기를 버린다. 정보는 "어디까지 닿았나"이고 그건 테두리가 나른다.
       퍼지는 고리 + 중심에서 뻗는 균열로 바꾼다 — 여러 장 겹쳐도 화면을 안 덮는다. */
    if(f.arc){
      const t=f.life/f.max, k=1-t, full=f.w>2.9;
      const X=f.x+ox, Y=f.y+oy, rr=f.r*(.45+.55*k);
      cx.save();cx.shadowColor=f.c;cx.shadowBlur=10;
      if(!full){   // 정면 강타 — 방향이 정보라 옅게라도 면을 남긴다

    const s=(f.sp?5:4)*(.35+.65*k);          // 사라지며 작아진다

  // 낙뢰
