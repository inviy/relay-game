     화면이 통째로 번쩍이고 눈이 아프다. 글로우·불투명도·번개 줄기를 낮췄다. */
  /* 자기 폭풍은 6발씩 나오고 공속이 오르면 초당 52발, 동시 21개까지 간다(실측).
     고리 하나하나가 같은 밝기면 합이 흰색이 된다. 살아 있는 수로 나눠 총량을 묶는다. */
  const bd=Math.min(1,7/Math.max(1,G.bolts.length));
  for(const z of G.bolts){const k=1-z.life/z.max;
    const col=z.red?"255,77,77":z.cyan?"79,240,216":z.pink?"255,92,138":"255,209,102";
    cx.save();cx.shadowColor=z.cyan?C.cyan:C.gold;cx.shadowBlur=11*bd;
    cx.strokeStyle=`rgba(${col},${((1-k)*.72*(z.gold?1:bd)).toFixed(2)})`;cx.lineWidth=z.gold?5:2;
    cx.beginPath();cx.arc(z.x+ox,z.y+oy,z.r*(.4+k*.6),0,TAU);cx.stroke();
    if(z.cyan||z.gold||z.red||z.pink){cx.fillStyle=`rgba(${col},${((1-k)*.15*(z.gold?1:bd)).toFixed(2)})`;cx.fill();}
    /* 번개 줄기는 낙뢰 계열에만. 예전엔 자폭체 유폭에도 하늘에서 번개가 쳤다.
       빽빽할 때는 절반만 긋는다 — 21줄이 동시에 치면 화면이 하얘진다. */
    if(k>.5&&z.lit&&bd>.5){cx.lineWidth=2.2;cx.strokeStyle=`rgba(${col},${((1-k)*.5*bd).toFixed(2)})`;
      cx.beginPath();cx.moveTo(z.x+ox,z.y+oy-170);
      cx.lineTo(z.x+ox+rnd(-10,10),z.y+oy-80);cx.lineTo(z.x+ox,z.y+oy);cx.stroke();}
    cx.restore();}

  // 아이템
  for(const it of G.items){
    const col={heal:C.pink,bomb:C.orange,magnet:C.cyan,chest:C.gold}[it.type];
    const by=Math.sin(it.ph)*5;
    cx.save();cx.shadowColor=col;cx.shadowBlur=20;cx.fillStyle=col;
    cx.fillRect(it.x+ox-9,it.y+oy+by-9,18,18);cx.restore();}

  // 적
  for(const e of G.en){
    const X=e.x+ox,Y=e.y+oy;
    cx.save();cx.shadowColor=e.c;cx.shadowBlur=e.elite?22:8;
    cx.fillStyle=e.c;cx.beginPath();
    if(e.sh==="tri"){cx.moveTo(X,Y-e.r);cx.lineTo(X+e.r*.9,Y+e.r*.8);cx.lineTo(X-e.r*.9,Y+e.r*.8);cx.closePath();}
    else if(e.sh==="square"){const w=e.r*1.7;cx.rect(X-w/2,Y-w/2,w,w);}
    else if(e.sh==="diamond"){cx.moveTo(X,Y-e.r);cx.lineTo(X+e.r,Y);cx.lineTo(X,Y+e.r);cx.lineTo(X-e.r,Y);cx.closePath();}
    else if(e.sh==="wall"){cx.rect(X-e.r,Y-e.r*.55,e.r*2,e.r*1.1);}
    else if(e.sh==="bomb"){cx.arc(X,Y,e.r*(1+Math.sin(e.ph*2)*.15),0,TAU);}
    else if(e.sh==="cell"){cx.arc(X,Y,e.r,0,TAU);cx.moveTo(X+e.r*.35,Y-e.r*.3);cx.arc(X-e.r*.3,Y-e.r*.3,e.r*.35,0,TAU);cx.moveTo(X+e.r*.6,Y+e.r*.3);cx.arc(X+e.r*.25,Y+e.r*.3,e.r*.35,0,TAU);}
    /* 고리 — 안쪽을 반대로 감아 구멍을 낸다(nonzero). 배회체가 "도는 것"으로 읽힌다 */
    else if(e.sh==="ring"){cx.arc(X,Y,e.r,0,TAU);cx.arc(X,Y,e.r*.48,0,TAU,true);}
    /* 렌즈 — 관측자. 가로로 눕힌 눈 모양이라 멀리서도 다른 종과 안 헷갈린다 */
    else if(e.sh==="eye"){cx.moveTo(X-e.r,Y);cx.quadraticCurveTo(X,Y-e.r*.95,X+e.r,Y);cx.quadraticCurveTo(X,Y+e.r*.95,X-e.r,Y);}
    /* 육각 — 차폐기. 방어계 실루엣과 같은 계열이라 "막는 놈"으로 읽힌다 */
    else if(e.sh==="hex"){for(let q=0;q<6;q++){const ang=q/6*TAU-Math.PI/2,xx=X+Math.cos(ang)*e.r,yy=Y+Math.sin(ang)*e.r;q?cx.lineTo(xx,yy):cx.moveTo(xx,yy);}cx.closePath();}
    /* 아가리 — 천천히 도는 톱니. 다른 어떤 적과도 안 닮았다 */
    else if(e.sh==="maw"){const n=9;for(let q=0;q<n;q++){const ang=q/n*TAU+e.ph*.35,rr=e.r*(q%2?.55:1);
      const xx=X+Math.cos(ang)*rr,yy=Y+Math.sin(ang)*rr;q?cx.lineTo(xx,yy):cx.moveTo(xx,yy);}cx.closePath();}
    else cx.arc(X,Y,e.r*(1+Math.sin(e.ph)*.05),0,TAU);
    cx.fill();
    /* 피격 섬광 — 예전엔 본체를 통째로 #fff로 갈아치웠다. 탄이 많으면 화면이
       흰 도형으로 가득 차서 "나는 연한 것 / 적은 채도 높은 것" 대비가 난전에서
       무너진다(색 축 분리, v1.7.0). 갈아치우는 대신 섞어서 적 색을 남긴다. */
    cx.shadowBlur=0;
    if(e.hit>0){cx.globalAlpha=.5;cx.fillStyle="#ffffff";cx.fill();cx.globalAlpha=1;}
    // 밝은 코어 — 단색 덩어리로 보이지 않게 (그림자는 꺼서 비용을 아낀다)
    cx.globalAlpha=e.hit>0?.9:.5;cx.fillStyle="#ffffff";
    cx.beginPath();cx.arc(X,Y,e.r*.28,0,TAU);cx.fill();
    cx.globalAlpha=1;cx.restore();
    /* 차폐기 범위 — 안 보이면 왜 안 죽는지 알 수 없다. 보여야 처리 순서를 배운다. */
    if(e.aura){cx.save();cx.strokeStyle="rgba(154,214,176,.45)";cx.lineWidth=1.5;cx.setLineDash([9,7]);
      cx.beginPath();cx.arc(X,Y,e.aura,0,TAU);cx.stroke();cx.restore();}
    /* 관측자 예고선 — 예고가 보이는 1.1초 안에 움직이면 빗나간다 */
    if(e.chg>0){const k=1-e.chg/1.1;
      cx.save();cx.strokeStyle="rgba(255,224,138,"+(.22+k*.62).toFixed(2)+")";cx.lineWidth=1+k*2.2;
      cx.beginPath();cx.moveTo(X,Y);cx.lineTo(p.x+ox,p.y+oy);cx.stroke();cx.restore();}
    if(e.elite){const t=TRAITS[e.tr];
      cx.strokeStyle=t?t.c:C.gold;cx.lineWidth=2.5;cx.beginPath();cx.arc(X,Y,e.r+7,0,TAU);cx.stroke();
      if(t){cx.fillStyle=t.c;cx.font="700 11px 'Chakra Petch',"+KRF;cx.textAlign="center";
        cx.fillText(t.n,X,Y-e.r-13);}}}

  // 보스 — 차단기 셔터
  /* 예전엔 보라색 원판 하나였다. 적 12종이 전부 고유 실루엣을 가진 판에서
     보스만 민무늬 원이라 덩어리로 보였다 — "기괴하다"는 말이 나온 자리다.
     조리개로 바꾸면서 체력을 모양에 실었다. 깎을수록 날이 열리고 중심이 탄다.
     날을 바깥으로 "밀어내는" 방식은 버렸다. 체력이 낮을 때 조각 여섯 개로
     흩어져 한 물체로 안 읽힌다(시안 D·D-2에서 실제로 그렇게 됐다).
     테두리 위 경첩에서 비트는 쪽이라 테두리가 항상 몸으로 남는다.
     그 테두리는 b.r 그대로다 — 예전 링은 r+12라 히트박스보다 커 보였다. */
  if(G.boss){const b=G.boss,X=b.x+ox,Y=b.y+oy;
    const col=b.fin?C.gold:C.violet, hp=Math.max(0,Math.min(1,b.hp/b.mhp));
    const th=(1-hp)*1.02, NB=6, spin=G.t*.35;
    const AD=b.ang&&ANGELS[b.ang]&&ANGELS[b.ang].draw;
    if(AD){ANGELS[b.ang].draw(X,Y,b);}
    else{
    cx.save();
    // 몸통과 새는 빛 — 테두리 안쪽으로 잘라낸다. 빛이 밖으로 번지면 조리개가 아니다
    cx.save();
    cx.beginPath();cx.arc(X,Y,b.r,0,TAU);cx.clip();
    cx.fillStyle=b.fin?"#1d1607":"#150c28";cx.fillRect(X-b.r,Y-b.r,b.r*2,b.r*2);
    const gr=b.r*(.22+.86*(1-hp));
    const g=cx.createRadialGradient(X,Y,1,X,Y,gr);
    g.addColorStop(0,`rgba(255,255,255,${(.5+.45*(1-hp)).toFixed(2)})`);
    g.addColorStop(.4,b.fin?"rgba(255,209,102,.85)":"rgba(255,92,138,.85)");
    g.addColorStop(1,"rgba(255,92,138,0)");
    cx.fillStyle=g;cx.beginPath();cx.arc(X,Y,gr,0,TAU);cx.fill();
    // 날 — 경첩 간 현(弦)이 b.r이라 반폭 .54r면 닫혔을 때 서로 물린다
    cx.shadowColor=col;cx.shadowBlur=10;
    cx.fillStyle=b.fin?"#4a3813":"#2e1c52";cx.strokeStyle=col;cx.lineWidth=2.2;cx.lineJoin="miter";
    for(let q=0;q<NB;q++){const a=spin+q*TAU/NB;
      cx.save();cx.translate(X+Math.cos(a)*b.r,Y+Math.sin(a)*b.r);cx.rotate(a+Math.PI+th);
      cx.beginPath();
      cx.moveTo(0,-b.r*.54);
      cx.lineTo(b.r*1.06,-b.r*.15);
      cx.lineTo(b.r*.88, b.r*.17);
      cx.lineTo(0, b.r*.54);
      cx.closePath();cx.fill();cx.stroke();
      cx.restore();}
    cx.restore();
    if(b.hit>0){cx.save();cx.globalAlpha=.5;cx.fillStyle="#ffffff";
      cx.beginPath();cx.arc(X,Y,b.r,0,TAU);cx.fill();cx.restore();}
    // 테두리 = 몸 = 히트박스
    cx.shadowColor=col;cx.shadowBlur=22;cx.strokeStyle=col;cx.lineWidth=3.5;
    cx.beginPath();cx.arc(X,Y,b.r,0,TAU);cx.stroke();
    cx.fillStyle=col;cx.shadowBlur=10;
    for(let q=0;q<NB;q++){const a=spin+q*TAU/NB;
      cx.beginPath();cx.arc(X+Math.cos(a)*b.r,Y+Math.sin(a)*b.r,3.2,0,TAU);cx.fill();}
    // 바깥 육각 프레임 — 날과 반대로 돈다
    cx.shadowBlur=12;cx.strokeStyle=b.fin?"rgba(255,209,102,.6)":"rgba(168,107,255,.6)";
    cx.lineWidth=2;cx.beginPath();
    for(let q=0;q<6;q++){const a=-spin*.6+q*TAU/6;
      const xx=X+Math.cos(a)*b.r*1.24,yy=Y+Math.sin(a)*b.r*1.24;q?cx.lineTo(xx,yy):cx.moveTo(xx,yy);}
    cx.closePath();cx.stroke();
    /* 종단 재머는 프레임 밖에 호 세 겹을 더 돌린다 — 크기 말고 격으로 구분한다 */
    if(b.fin){cx.strokeStyle="rgba(255,209,102,.75)";cx.lineWidth=2.5;
      for(let q=0;q<3;q++){const rr=b.r*1.4+q*15, aa=G.t*(q%2?-.6:.9)+q*2;
        cx.beginPath();cx.arc(X,Y,rr,aa,aa+TAU*.62);cx.stroke();}}
    cx.restore();
    }
    const AN=b.ang?ANGELS[b.ang]:null, bc=b.fin?C.gold:AN?AN.c:C.pink;
    /* 이름표 — 등장 4초는 크게, 그 뒤엔 작게 남는다. 무엇과 싸우는지 계속 보여야 한다 */
    {const age=b.age||0, big=age<4, sc=big?1.5:1, al=big?1:.72;
     const nm="제"+b.no+"사도 "+(b.fin?"종단":AN?AN.n:"재머");
     cx.save();cx.textAlign="center";
     cx.font="700 "+(13*VS*sc).toFixed(1)+"px "+KRF;
     const tw=cx.measureText(nm).width, ty=Y-b.r-(big?26:18)*VS;
     cx.globalAlpha=al;
     cx.fillStyle="rgba(8,11,24,.72)";
     cx.fillRect(X-tw/2-8*VS,ty-13*VS*sc,tw+16*VS,19*VS*sc);
     cx.fillStyle=bc;cx.shadowColor=bc;cx.shadowBlur=big?16:8;
     cx.fillText(nm,X,ty);
     cx.restore();}
    /* 무적이면 바가 회색이 된다 — 숫자 대신 색으로 「지금은 안 통한다」를 보여 준다 */
    const inv=!!(AN&&AN.shielded&&AN.shielded(b)), bh=(b.fin?13:9)*VS;
    cx.fillStyle="rgba(11,16,36,.9)";cx.fillRect(W*.16,54*VS,W*.68,bh);
    cx.fillStyle=inv?"#5a6280":bc;cx.fillRect(W*.16,54*VS,W*.68*Math.max(0,b.hp/b.mhp),bh);
    cx.save();cx.textAlign="center";
    cx.font="700 "+(13*VS).toFixed(1)+"px "+KRF;cx.fillStyle=inv?"#8a93bb":bc;
    cx.fillText("제"+b.no+"사도 "+(b.fin?"종단":AN?AN.n:"재머"),W/2,(54+9)*VS+bh);
    /* 잡는 법은 싸우는 내내 보여야 한다 — 한 번 스쳐 간 배너로는 못 읽는다 */
    const guide=inv?"지금은 안 통해요 — "+(AN&&AN.how?AN.how:""):(b.fin?"체력에 따라 공격이 3번 바뀌어요":AN&&AN.how?AN.how:"");
    if(guide){cx.font="600 "+(11.5*VS).toFixed(1)+"px "+KRF;cx.fillStyle=inv?"#ff8aa8":"rgba(238,242,255,.78)";
      cx.fillText(guide,W/2,(54+26)*VS+bh);}
    cx.restore();}

  // 탄
  cx.save();cx.shadowBlur=16;cx.lineCap="round";
  for(const b of G.bul){cx.shadowColor=b.c;cx.fillStyle=b.c;
    const sp=Math.hypot(b.vx,b.vy);
    if(sp>240&&!b.beam){            // 빠른 탄은 진행 방향으로 꼬리를 끈다
      const t=Math.min(30,sp*.03);
      cx.shadowBlur=0;                    // 꼬리엔 그림자를 끈다 — 그림자 stroke는 비싸다
      cx.strokeStyle=b.c;cx.lineWidth=b.r*1.6;cx.globalAlpha=.5;
      cx.beginPath();cx.moveTo(b.x+ox,b.y+oy);
      cx.lineTo(b.x+ox-b.vx/sp*t,b.y+oy-b.vy/sp*t);cx.stroke();
      cx.globalAlpha=1;cx.shadowBlur=16;}
    if(b.beam){cx.globalAlpha=.9;cx.beginPath();cx.arc(b.x+ox,b.y+oy,b.r,0,TAU);cx.fill();cx.globalAlpha=1;}
    else{cx.beginPath();cx.arc(b.x+ox,b.y+oy,b.r,0,TAU);cx.fill();}}
  cx.shadowColor=C.pink;cx.fillStyle=C.pink;
  for(const b of G.eb){cx.beginPath();cx.arc(b.x+ox,b.y+oy,b.r,0,TAU);cx.fill();}
  cx.restore();

  // 검
  if(G.blades)for(const o of G.blades){
    cx.save();cx.translate(o.x+ox,o.y+oy);cx.rotate(o.a+Math.PI/2);
    cx.shadowColor="#dfe6ff";cx.shadowBlur=18;cx.fillStyle="#eef2ff";
    cx.fillRect(-2.5,-o.r,5,o.r*2);cx.restore();}

  // 권능 · 파편
  if(G.ang.shard&&G.shards)for(const o of G.shards){
    cx.save();cx.translate(o.x+ox,o.y+oy);cx.rotate(G.shardA*1.4);
    cx.shadowColor="#9ad6e0";cx.shadowBlur=12;cx.fillStyle="#13303a";cx.strokeStyle="#9ad6e0";cx.lineWidth=1.8;
    cx.beginPath();cx.moveTo(0,-o.r);cx.lineTo(o.r,0);cx.lineTo(0,o.r);cx.lineTo(-o.r,0);cx.closePath();cx.fill();cx.stroke();
    cx.restore();}
  // 유령 분신
  if(G.stage>=2&&G.form==="rover")for(const ci of HIST_IDX()){const h=G.hist[ci];if(!h)continue;
    cx.save();cx.globalAlpha=.5-ci*.014;drawShip(h.x+ox,h.y+oy,p.dx,p.dy,"rover",G.stage,null);cx.restore();}
  // 요새 포탑
  if(G.stage>=2&&G.form==="warden")for(const t of G.turrets){
    cx.save();cx.strokeStyle="rgba(255,209,102,.35)";cx.lineWidth=1.5;cx.beginPath();cx.moveTo(W/2+sx,H/2+sy);cx.lineTo(t.x+ox,t.y+oy);cx.stroke();
    cx.shadowColor=C.gold;cx.shadowBlur=16;cx.fillStyle=C.gold;cx.translate(t.x+ox,t.y+oy);cx.rotate(t.a);
    cx.fillRect(-7,-7,14,14);cx.restore();}
  // 플레이어
  const px=W/2+sx,py=H/2+sy;
  cx.save();cx.shadowColor=G.ult.t>0?C.violet:(p.in?C.gold:C.cyan);cx.shadowBlur=G.ult.t>0?48:26;
  if(p.flash>0){cx.shadowColor=C.pink;}
  drawShip(px,py,p.dx,p.dy,G.form,G.stage,p.flash>0?C.pink:null);
  if(G.form==="warden"&&G.shield.up){cx.strokeStyle="rgba(255,209,102,.9)";cx.lineWidth=2.5;cx.setLineDash([14,8]);
    cx.lineDashOffset=-G.t*40;cx.beginPath();cx.arc(px,py,p.r+13,0,TAU);cx.stroke();cx.setLineDash([]);}
  cx.restore();
  cx.strokeStyle="rgba(79,240,216,.22)";cx.lineWidth=1;
  cx.beginPath();cx.arc(px,py,p.mag,0,TAU);cx.stroke();

  /* 장막(제12사도) — 보스에게서 퍼지는 안개. 정전 마스크를 그대로 쓰되 구멍을
     내 발밑에만 둔다. 안개 밖으로 나가면 풀리는 게 이 사도의 답이다 */
  if(G.boss&&G.boss.ang==="veil"&&G.boss.fog>.05){
    const b=G.boss, FR=440*b.fog, bx=b.x+ox, by=b.y+oy;
    const d=Math.hypot(G.p.x-b.x,G.p.y-b.y);
    if(d<FR+200)blackoutMask(bx,by,-1, px,py,150, .78*b.fog*Math.min(1,(FR+200-d)/200));
  }
  /* 정전 — 신호권 밖이 어두워진다.
     destination-out으로 구멍을 뚫으려 했다가 실패했다. 월드와 어둠이 같은
     레이어라서 지우면 게임 화면까지 함께 지워진다(통째로 검게 나왔다).
     사각형에서 원 둘을 빼는 evenodd 채우기가 맞다 — 오프스크린 캔버스도 안 쓴다.
     구멍이 둘인 이유: 신호권은 밝아야 "안으로 들어가라"가 읽히고, 발밑은 보여야
     안 보이는 것에 맞아 죽지 않는다. 둘째가 없으면 긴장이 아니라 부당함이 된다. */
  if(G.sev&&G.sev.id==="blackout"){
    const k=Math.min(1,Math.min(G.sevT,1.2)/1.2);            // 시작·끝에서 부드럽게
    blackoutMask(G.zone.x+ox,G.zone.y+oy,G.zone.r, px,py,170, .82*k);
  }
  // 화면 밖 인디케이터
  if(!p.in)edgeArrow(G.zone.x,G.zone.y,ox,oy,C.gold,Math.round(Math.hypot(G.zone.x-p.x,G.zone.y-p.y)/10)+"m");
  if(G.next)edgeArrow(G.next.x,G.next.y,ox,oy,C.pink,"다음 "+Math.ceil(G.zt)+"s");
  for(const it of G.items)edgeArrow(it.x,it.y,ox,oy,{heal:C.pink,bomb:C.orange,magnet:C.cyan,chest:C.gold}[it.type],"");
  for(const e of G.en)if(e.chg>0)edgeArrow(e.x,e.y,ox,oy,"#ffe08a","조준");
  // 간섭 노이즈
  if(G.outT>30){const k=Math.min(1,(G.outT-30)/20);cx.fillStyle=`rgba(255,80,120,${.06*k})`;
    for(let i=0;i<14*k;i++)cx.fillRect(rnd(0,W),rnd(0,H),rnd(20,220),rnd(1,3));}
  // 데미지 숫자
  cx.textAlign="center";cx.font="700 "+(17*VS).toFixed(1)+"px "+KRF;
  for(const n of G.num){cx.globalAlpha=Math.min(1,n.life*2.2);
    cx.fillStyle=n.c;cx.fillText(n.v,n.x+ox,n.y+oy);}
  cx.globalAlpha=1;

  // 비네트
  const v=cx.createRadialGradient(W/2,H/2,Math.min(W,H)*.42,W/2,H/2,Math.max(W,H)*.78);
  v.addColorStop(0,"rgba(0,0,0,0)");v.addColorStop(1,"rgba(0,0,0,.6)");
  cx.fillStyle=v;cx.fillRect(0,0,W,H);
  if(p.flash>0){cx.fillStyle=`rgba(255,60,100,${p.flash*.35})`;cx.fillRect(0,0,W,H);}
  if(G.flash.t>0){cx.fillStyle=`rgba(${G.flash.c},${(G.flash.t*.55).toFixed(2)})`;cx.fillRect(0,0,W,H);}
  drawStick();
}

/* 가상 조이스틱 — 손가락이 닿은 자리에 원과 노브 */
function drawStick(){
  if(!touch)return;
  const bx=touch.ox*VS, by=touch.oy*VS, r=STICK*VS;
  cx.save();
  cx.fillStyle="rgba(13,18,36,.34)";cx.beginPath();cx.arc(bx,by,r,0,TAU);cx.fill();
  cx.strokeStyle="rgba(79,240,216,.34)";cx.lineWidth=1.6*VS;
  cx.beginPath();cx.arc(bx,by,r,0,TAU);cx.stroke();
  const kx=bx+touch.x*r, ky=by+touch.y*r;
  cx.shadowColor=C.cyan;cx.shadowBlur=10*VS;
  cx.fillStyle="rgba(79,240,216,.55)";cx.beginPath();cx.arc(kx,ky,r*.33,0,TAU);cx.fill();
  cx.shadowBlur=0;cx.strokeStyle="rgba(220,255,250,.7)";cx.lineWidth=1.4*VS;
  cx.beginPath();cx.arc(kx,ky,r*.33,0,TAU);cx.stroke();
  cx.restore();
}

function edgeArrow(wx,wy,ox,oy,col,label){
  const sxp=wx+ox,syp=wy+oy,m=30*VS;
  if(sxp>m&&sxp<W-m&&syp>m&&syp<H-m)return;
  const cxp=W/2,cyp=H/2,a=Math.atan2(syp-cyp,sxp-cxp),dx=Math.cos(a),dy=Math.sin(a);
  const tx=dx>0?(W-m-cxp)/dx:dx<0?(m-cxp)/dx:1e9,ty=dy>0?(H-m-cyp)/dy:dy<0?(m-cyp)/dy:1e9;
  const t=Math.min(tx,ty),ex=cxp+dx*t,ey=cyp+dy*t;
  cx.save();cx.translate(ex,ey);cx.scale(VS,VS);cx.rotate(a);cx.fillStyle=col;cx.shadowColor=col;cx.shadowBlur=14;
  cx.beginPath();cx.moveTo(14,0);cx.lineTo(-8,-9);cx.lineTo(-8,9);cx.closePath();cx.fill();
  cx.rotate(-a);cx.shadowBlur=0;
  if(label){cx.font="700 12px 'Chakra Petch','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic','맑은 고딕',system-ui,sans-serif";cx.textAlign="center";cx.fillText(label,0,ey>H/2?-16:26);}
  cx.restore();
}
/* 기체 실루엣 — 게임 화면과 선택 카드가 같은 함수를 쓴다.
   (0,0) 기준으로 +X를 바라본다. 이동·회전은 호출부 몫이다.
   본체는 연한 색으로 두고 기체 색은 액센트와 코어에만 쓴다 —
   본체까지 색을 입히면 보라(위스프)·주황(사수)·금색(엘리트) 적과 헷갈린다. */
/* 기체 고유 장식만 따로 뺀다. 본체 모양은 진화(기동계·방어계)가 정하고
   이 장식은 시작 기체가 정한다 — 그래서 진화 후에도 어디서 출발했는지 남는다.
   (0,0) 기준, +X를 바라본다. */
function charAccent(g,k,R,col){
  const acc=col||(CHARS[k]||CHARS.relay).c;
  g.save();g.lineCap="round";g.strokeStyle=acc;
  if(k==="runner"){                      // 추진 흔적
    g.lineWidth=R*.26;
    g.beginPath();g.moveTo(-R*.5,-R*.5);g.lineTo(-R*1.5,-R*.72);
    g.moveTo(-R*.5,R*.5);g.lineTo(-R*1.5,R*.72);g.stroke();
  }else if(k==="shield"){                // 전방 방패 호
    g.lineWidth=R*.34;
    g.beginPath();g.arc(0,0,R*1.5,-.95,.95);g.stroke();
  }else if(k==="tech"){                  // 대각 스파이크
    g.lineWidth=R*.16;
    for(let i=0;i<4;i++){const t=Math.PI/4+i*Math.PI/2;
      g.beginPath();g.moveTo(Math.cos(t)*R*.75,Math.sin(t)*R*.75);
      g.lineTo(Math.cos(t)*R*1.3,Math.sin(t)*R*1.3);g.stroke();}
  }else{                                 // 신호 링
    g.lineWidth=R*.2;g.globalAlpha=.85;
    g.beginPath();g.arc(0,0,R*1.45,-2.35,-.75);g.stroke();
    g.beginPath();g.arc(0,0,R*1.45,.75,2.35);g.stroke();
  }
  g.restore();
}
function drawChar(g,k,R,col){
  const body=col||"#eef2ff", acc=(CHARS[k]||CHARS.relay).c;   // 장식은 섬광에 물들지 않는다
  charAccent(g,k,R);
  g.fillStyle=body;
  if(k==="runner"){                      // 화살촉 — 뒤가 파여 대셔의 단순 삼각과 다르다
    g.beginPath();
    g.moveTo(R*1.75,0);g.lineTo(-R*.95,-R*1.05);g.lineTo(-R*.35,0);g.lineTo(-R*.95,R*1.05);
    g.closePath();g.fill();
  }else if(k==="shield"){                // 사각 본체 — 탱크의 민 사각과 다르다
    const s=R*.92;g.beginPath();
    if(g.roundRect)g.roundRect(-s,-s,s*2,s*2,R*.3);else g.rect(-s,-s,s*2,s*2);
    g.fill();
  }else if(k==="tech"){                  // 마름모 — 사수의 민 마름모와 다르다
    g.beginPath();
    g.moveTo(R*1.5,0);g.lineTo(0,-R*1.15);g.lineTo(-R*1.5,0);g.lineTo(0,R*1.15);
    g.closePath();g.fill();
  }else{                                 // 중계사 — 원 + 노즈, 위스프/파편과 구분된다
    g.beginPath();
    g.moveTo(R*1.55,0);g.lineTo(R*.2,-R*.6);g.lineTo(R*.2,R*.6);g.closePath();g.fill();
    g.beginPath();g.arc(0,0,R,0,TAU);g.fill();
  }
  g.fillStyle=acc;g.beginPath();g.arc(0,0,R*.3,0,TAU);g.fill();
}
/* 색 축 분리 — 진화 색과 기체 색을 같은 5색 팔레트에서 뽑으면 충돌이 필연이다.
   (중계사×기동계1차 = 둘 다 cyan, 질주자×관제탑 = 둘 다 orange …)
   그래서 축을 나눈다: 형태 = 진화(화살/육각), 색 = 기체, 크기·요소 수 = 단계.
   본체를 연한 색으로 두는 건 "나는 연한 것, 적은 채도 높은 것" 대비를 지키기 위함이고,
   진화를 색이 아닌 형태로 읽게 되므로 색약 대응도 같이 좋아진다. */
const chCol=()=>(CHARS[(G&&G.ch)||"relay"]||CHARS.relay).c;
function drawShip(x,y,dx,dy,form,stage,over){
  /* 피격 섬광은 본체에만 준다 — 장식까지 같은 색이 되면 실루엣이 사라진다 */
  const a=Math.atan2(dy,dx), acc=chCol(), body=over||"#eef2ff";
  cx.save();cx.translate(x,y);
  if(!form||form==="none"||stage===0){
    cx.rotate(a);drawChar(cx,(G&&G.ch)||"relay",13,over);
  }else if(form==="rover"){
    const S=stage>=3?1.34:stage===2?1.12:1;      // 단계는 크기로도 자란다
    /* 장식을 본체 위에 올린다 — 아래 깔면 육각형 본체에 60%가 가려진다 */
    cx.rotate(a);cx.scale(S,S);
    cx.fillStyle=body;cx.beginPath();
    if(stage===1){                                // 날렵한 화살
      cx.moveTo(20,0);cx.lineTo(-12,-13);cx.lineTo(-5,0);cx.lineTo(-12,13);
    }else{                                        // 유령 이상 — 긴 날개
      cx.moveTo(26,0);cx.lineTo(-16,-22);cx.lineTo(-4,0);cx.lineTo(-16,22);
    }
    cx.closePath();cx.fill();
    if(stage>=3){                                 // 3차는 날개가 한 겹 늘어난다 — 확대가 아니라 요소 추가
      cx.strokeStyle=acc;cx.lineWidth=2.4;cx.beginPath();
      cx.moveTo(-14,-26);cx.lineTo(14,-13);cx.moveTo(-14,26);cx.lineTo(14,13);cx.stroke();}
    charAccent(cx,(G&&G.ch)||"relay",stage>=3?20:stage===2?17:14);
    cx.fillStyle=acc;cx.beginPath();cx.arc(stage===1?4:6,0,4,0,TAU);cx.fill();
  }else if(form==="pulse"){
    /* 마름모 본체 + 공명 고리. 고리가 스택만큼 찬다 — 몸에 게이지가 있다 */
    const S=stage>=3?1.3:stage===2?1.12:1, k=G?Math.min(1,G.res/(G.resCap||40)):0;
    cx.rotate(a);cx.scale(S,S);
    cx.fillStyle=body;cx.beginPath();cx.moveTo(18,0);cx.lineTo(0,-11);cx.lineTo(-12,0);cx.lineTo(0,11);cx.closePath();cx.fill();
    cx.strokeStyle=acc;cx.lineWidth=2.6;cx.beginPath();cx.arc(0,0,17,-Math.PI/2,-Math.PI/2+TAU*k);cx.stroke();
    if(stage>=2){cx.strokeStyle="rgba(255,92,138,.55)";cx.lineWidth=1.6;cx.setLineDash([4,5]);cx.lineDashOffset=-(G?G.t:0)*30*(1+k*2);
      cx.beginPath();cx.arc(0,0,23,0,TAU);cx.stroke();cx.setLineDash([]);}
    if(stage>=3){cx.strokeStyle=acc;cx.lineWidth=2;cx.beginPath();cx.moveTo(-6,-20);cx.lineTo(10,-8);cx.moveTo(-6,20);cx.lineTo(10,8);cx.stroke();}
    charAccent(cx,(G&&G.ch)||"relay",stage>=3?19:stage===2?16:13);
    cx.fillStyle=acc;cx.beginPath();cx.arc(3,0,4,0,TAU);cx.fill();
  }else{ // warden
    const n=6,R=stage>=3?26:stage===2?22:16;
    cx.save();cx.rotate(G.t*.6);                  // 본체만 자전한다
    cx.fillStyle=body;cx.beginPath();
    for(let i=0;i<n;i++){const g=i/n*TAU;i?cx.lineTo(Math.cos(g)*R,Math.sin(g)*R):cx.moveTo(R,0);}
    cx.closePath();cx.fill();
    cx.fillStyle="#0b1024";cx.beginPath();
    for(let i=0;i<n;i++){const g=i/n*TAU;i?cx.lineTo(Math.cos(g)*R*.55,Math.sin(g)*R*.55):cx.moveTo(R*.55,0);}
    cx.closePath();cx.fill();
    if(stage>=2){                                 // 2차 6갈래 → 3차 12갈래
      const m=stage>=3?12:6;
      cx.strokeStyle=acc;cx.lineWidth=stage>=3?3.4:3;cx.beginPath();
      for(let i=0;i<m;i++){const g=i/m*TAU;cx.moveTo(Math.cos(g)*R,Math.sin(g)*R);cx.lineTo(Math.cos(g)*(R+9),Math.sin(g)*(R+9));}
      cx.stroke();}
    cx.restore();
    /* 장식은 진행 방향 고정 — 본체와 같이 돌면 방패 호가 뒤를 막는다 */
    cx.save();cx.rotate(a);charAccent(cx,(G&&G.ch)||"relay",stage>=3?23:stage===2?19:15);cx.restore();
    cx.fillStyle=acc;cx.beginPath();cx.arc(0,0,4.5,0,TAU);cx.fill();
  }
  cx.restore();
}

const ULT_C=2*Math.PI*39;               // 궁극기 링 둘레
$("#ultprg").style.strokeDasharray=ULT_C.toFixed(1);
function hud(){
  const p=G.p;
  /* 4초 동안 보여주고 1.5초에 걸쳐 사라진다 */
  if(G.tip!==undefined){const a=G.t<4?Math.min(1,G.t/.4):Math.max(0,1-(G.t-4)/1.5);

     30(가속)·40(갈라짐) 문턱은 눈금으로, 넘는 순간은 한 번 알린다 — 떨어졌다 다시 넘으면 또 */
  const rs=$("#res");

    G.resLvl=lvl;
  }else rs.hidden=true;

  $("#kills").textContent=G.kills;
  $("#score").textContent=calcScore().toLocaleString();
  /* 실시간 순위 — 올라갈 때만 알린다. 3위 안은 크게, 1위는 축포 */
  const rk=$("#rank");

    rk.classList.toggle("near",r<=3&&r>1);rk.classList.toggle("top1",r===1);

      else if(r<=3)callBig(r+"위",beat?beat.nick+"를 넘었다":"");

  }else rk.hidden=true;

  $("#hpfill").style.width=Math.max(0,100*p.hp/p.mhp)+"%";
  $("#hpnum").textContent=Math.max(0,Math.ceil(p.hp))+" / "+p.mhp;
  const z=$("#zonestate");
  /* 170%가 박혀 있었다. 갈래마다 배수가 다르고 계약·사도로도 바뀌므로 실제 값을 쓴다 */
  const zm=Math.round(zoneMul()*100);
  z.textContent=(SMALL?(p.in?"권내 ":"권외 "):(p.in?"신호권 · 피해 ":"신호권 밖 · 피해 "))+zm+"%";

    html+=`<div class="wchip" style="--c:${WEAPONS[k].c}"><b>${ev?ev.n:WEAPONS[k].n}</b> ${ev?"MAX":"Lv"+G.lvls[k]}</div>`;}
  $("#weapons").innerHTML=html;

  /* 처치 충전과 시간 바닥 중 덜 찬 쪽을 보여 준다 — 안 그러면 게이지가 꽉 찼는데
     발동이 안 되는 상태가 되고, 플레이어는 버그로 읽는다. */

    zt.classList.toggle("soon",(G.zt<=8&&!G.ct.leash)||!!G.sev);}
}

function loop(now){requestAnimationFrame(loop);

  update(dt);draw();}
function start(){clearRun();if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();

  $("#cause").textContent=trueEnd?"종단 재머를 끊고 신호를 넘겼다":won?"":"사인: "+(G.lastHit||"—");
  let bh="";for(const k in G.w){const ev=EVOS.find(e=>e.w===k&&G.evo[e.id]);
    bh+=`<span class="wchip" style="--c:${WEAPONS[k].c}"><b>${ev?ev.n:WEAPONS[k].n}</b> ${ev?"MAX":"Lv"+G.lvls[k]}</span>`;}
  for(const k in PASSIVES)if(G.lvls[k])bh+=`<span class="wchip" style="--c:${PASSIVES[k].c}">${PASSIVES[k].n} ${G.lvls[k]}</span>`;
  $("#build").innerHTML=bh;
  showVeil("#v-over");}

/* 데일리 시드 + 짧은 판 + 자랑할 숫자까지 갖춰 놓고 자랑할 수단만 없었다. */
/* 채운 블록 = 그 30초를 신호권 안에서 싸웠다. 이 게임의 실력 축이 그것이라
   막대 하나로 판의 성격이 드러난다. 점수만 있는 공유물은 안 해본 사람에게
   아무 의미가 없다 — 39,935가 잘한 건지 못한 건지 알 수가 없다. */
function shareBar(){
  const seg=G.seg.filter(x=>x&&x.tot>.5);
  if(!seg.length)return{bar:"",zp:0};
  const N=Math.min(8,seg.length),out=[];let ai=0,at=0;
  for(let i=0;i<N;i++){
    const a=Math.floor(i*seg.length/N), b=Math.max(a+1,Math.floor((i+1)*seg.length/N));
    let inn=0,tot=0;
    for(let j=a;j<b;j++){inn+=seg[j].in;tot+=seg[j].tot;}
    ai+=inn;at+=tot;
    out.push(tot&&inn/tot>=.55?"▰":"▱");
  }
  return{bar:out.join(""),zp:at?Math.round(100*ai/at):0};
}
function shareText(){
  const t=Math.floor(G.t), FN={rover:"기동계",warden:"방어계",pulse:"공진계",none:"순수"};
  const mm=Math.floor(t/60)+":"+String(t%60).padStart(2,"0");
  const sb=shareBar(), sc=calcScore(), sd=scoreDelta();
  const L=["RELAY #"+SEED+" · "+MOD.n];
  if(sb.bar)L.push(sb.bar+"  신호권 "+sb.zp+"%");
  L.push(G.ended?"종단 재머 격파":mm+"에 끊김");
  L.push((PROF.nick||"오퍼레이터")+" · "+charOf().n+(G.form?" / "+(FN[G.form]||""):"")+" · LV"+G.p.lv);
  L.push(sc.toLocaleString()+"점"+(G.rank?" · 오늘 "+G.rank+"위":"")+" · "+G.kills.toLocaleString()+"처치");
  if(sd)L.push(sd.lbl+" "+(sd.d>=0?"+":"")+sd.d.toLocaleString());
  L.push(location.origin+location.pathname);
  return L.join(String.fromCharCode(10));
}
$("#b-share").onclick=async()=>{
  const btn=$("#b-share"), txt=shareText();
  try{
    if(navigator.share){await navigator.share({text:txt});return;}
    await navigator.clipboard.writeText(txt);
  }catch(e){                       // 클립보드 권한이 없거나 취소된 경우
    const ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";
    document.body.appendChild(ta);ta.select();try{document.execCommand("copy");}catch(e2){}ta.remove();
  }
  btn.textContent="복사됨";setTimeout(()=>btn.textContent="결과 복사",1600);
};

/* 탭을 닫거나 앱을 전환하면 end가 영영 안 찍힌다. 이 신호가 없으면 이탈 지점이
   통째로 안 보인다. keepalive로 보내야 언로드 중에도 살아남는다.
   탭 전환을 반복해도 줄이 쌓이지 않게 10초 간격을 둔다 — 뷰는 판마다 마지막 줄만 센다. */
let lastLeave=-99;
function leave(){
  const now=performance.now()/1000; if(now-lastLeave<10)return; lastLeave=now;
  const playing=G&&!G.over&&(mode==="play"||mode==="pause"||mode==="level");
  if(playing){saveRun();submitBeacon();}
  track("abandon",{mode},playing?G.t:null);
}
addEventListener("pagehide",leave);
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="hidden")leave();
  else SFX.wake();
});
/* 제스처 안에서 한 번 더 — iOS가 타이머 안의 resume을 거부하는 경우가 있다 */

addEventListener("keydown",()=>SFX.wake());

try{track("land",{w:innerWidth,h:innerHeight,touch:matchMedia("(pointer:coarse)").matches,
  ref:document.referrer?new URL(document.referrer).host:""});}catch(e){}
})();
