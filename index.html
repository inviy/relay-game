/* 정전 마스크.
   구멍이 둘(신호권·발밑)이고 서로 겹칠 수 있다. 한 번의 evenodd 채우기로는
   안 된다 — 겹친 영역이 교차수 홀수가 되어 어둠이 되돌아온다(실제로 그렇게 나왔다).
   같은 레이어에서 destination-out을 하면 게임 화면까지 지워진다(그것도 당했다).
   그래서 별도 캔버스에 어둠을 만들어 구멍을 뚫고 통째로 얹는다.
   해상도는 절반이다 — 부드러운 마스크라 눈에 안 보이고 채우는 픽셀이 1/4이 된다. */
const DARK_S=.5;
let DARK=null,DARKW=0,DARKH=0;
function blackoutMask(zx,zy,zr,pxx,pyy,pr,A){
  const w=Math.ceil(W*DARK_S), h=Math.ceil(H*DARK_S);
  if(!DARK||DARKW!==w||DARKH!==h){
    DARK=document.createElement("canvas");DARK.width=w;DARK.height=h;DARKW=w;DARKH=h;}
  const g=DARK.getContext("2d");
  g.globalCompositeOperation="source-over";
  g.clearRect(0,0,w,h);
  g.fillStyle="#03050c";g.fillRect(0,0,w,h);
  g.globalCompositeOperation="destination-out";
  const hole=(hx,hy,hr)=>{
    hx*=DARK_S;hy*=DARK_S;hr*=DARK_S;
    const rg=g.createRadialGradient(hx,hy,hr*.6,hx,hy,hr);
    rg.addColorStop(0,"rgba(0,0,0,1)");rg.addColorStop(1,"rgba(0,0,0,0)");
    g.fillStyle=rg;g.beginPath();g.arc(hx,hy,hr,0,TAU);g.fill();};
  if(zr>0)hole(zx,zy,zr);   // 장막은 신호권 구멍이 없다 — 발밑만 보인다
  hole(pxx,pyy,pr);
  cx.save();cx.globalAlpha=A;cx.drawImage(DARK,0,0,W,H);cx.restore();
}
/* 성운 — 매 프레임 그라디언트를 만들지 않도록 512 타일에 한 번만 굽는다 */
let NEB=null;
function makeNeb(){
  const c=document.createElement("canvas");c.width=c.height=512;
  const g=c.getContext("2d");
  [["58,42,122",.34],["30,74,106",.26],["92,40,92",.22],["40,64,130",.20]].forEach(b=>{
    const x=rnd(80,432),y=rnd(80,432),r=rnd(140,240);
    const rg=g.createRadialGradient(x,y,0,x,y,r);
    rg.addColorStop(0,`rgba(${b[0]},${b[1]})`);rg.addColorStop(1,`rgba(${b[0]},0)`);
    g.fillStyle=rg;g.fillRect(0,0,512,512);});
  return c;
}
/* 배경 한 장으로 굽기 — 그라디언트와 성운을 매 프레임 다시 칠하지 않는다.
   성운은 가장 먼 층이라 화면에 고정해도 어색하지 않다. */
let BGC=null,BGW=0,BGH=0;
function bakeBG(){
  BGC=document.createElement("canvas");BGC.width=Math.ceil(W);BGC.height=Math.ceil(H);
  BGW=W;BGH=H;
  const g=BGC.getContext("2d");
  const bg=g.createRadialGradient(W/2,H*.42,60,W/2,H*.5,Math.max(W,H)*.8);
  bg.addColorStop(0,"#0e1430");bg.addColorStop(1,"#05070f");
  g.fillStyle=bg;g.fillRect(0,0,W,H);
  if(!NEB)NEB=makeNeb();
  g.globalAlpha=.55;
  const NS=760;
  for(let x=-NS*.4;x<W;x+=NS)for(let y=-NS*.4;y<H;y+=NS)g.drawImage(NEB,x,y,NS,NS);
}
/* 별 3단 — 멀수록 어둡고 작다 */
const STARB=[{lo:.2,hi:.5,c:"rgba(150,170,240,.22)"},
             {lo:.5,hi:.78,c:"rgba(175,195,255,.40)"},
             {lo:.78,hi:1.01,c:"rgba(215,230,255,.68)"}];
/* 코어 — 사도의 약점. 체력이 깎일수록 금이 가고, 무적일 땐 식어서 잠긴다.
   무적 상태를 색으로 가르는 게 핵심이다. 붉게 뛰면 지금 때릴 수 있다는 뜻. */
function drawCore(X,Y,b,sh){
  const r=b.r, hp=Math.max(0,Math.min(1,b.hp/b.mhp)), cr=r*.17;
  /* 맥박 — 체력이 적을수록 빨라진다. 죽어가는 것이 보인다 */
  const beat=.5+.5*Math.sin(G.t*(3.4+(1-hp)*7));
  cx.save();
  if(sh){
    /* 잠김 — 회청색으로 식는다. 때려도 안 박히는 이유가 코어에 있다 */
    cx.fillStyle="#2b3450";cx.strokeStyle="rgba(150,170,210,.75)";cx.lineWidth=2;
    cx.beginPath();cx.arc(X,Y,cr*.8,0,TAU);cx.fill();cx.stroke();
  }else{
    cx.shadowColor="#ff3b5c";cx.shadowBlur=14+10*beat;
    const g=cx.createRadialGradient(X,Y,.5,X,Y,cr);
    g.addColorStop(0,"#fff");g.addColorStop(.35,"#ff6b7f");g.addColorStop(1,"#c4102c");
    cx.fillStyle=g;cx.beginPath();cx.arc(X,Y,cr*(.92+.12*beat),0,TAU);cx.fill();
    cx.shadowBlur=0;cx.strokeStyle="rgba(255,255,255,.8)";cx.lineWidth=1.4;
    cx.beginPath();cx.arc(X,Y,cr*(.92+.12*beat),0,TAU);cx.stroke();
    /* 금 — 체력 3/4부터 한 줄씩, 최대 4줄. 각도는 사도마다 고정이라 안 흔들린다 */
    const cracks=Math.floor((1-hp)*5.2);
    if(cracks>0){cx.strokeStyle="rgba(30,0,10,.85)";cx.lineWidth=1.6;cx.lineCap="round";
      for(let q=0;q<Math.min(4,cracks);q++){const a=(b.no||1)*1.7+q*1.9;
        cx.beginPath();cx.moveTo(X+Math.cos(a)*cr*.15,Y+Math.sin(a)*cr*.15);
        cx.lineTo(X+Math.cos(a+.35)*cr*.95,Y+Math.sin(a+.35)*cr*.95);cx.stroke();}}
  }
  cx.restore();
}
/* 차단막 — 무적인 동안 나를 향한 쪽에 육각 격자가 선다.
   때릴 때마다 그 자리에서 밝아진다("무효" 글자는 그대로 두되, 글자 없이도 읽히게). */
function drawAT(X,Y,b){
  const r=b.r, p=G.p, a=Math.atan2(p.y-b.y,p.x-b.x);
  const flash=Math.max(0,b.at||0);
  cx.save();
  cx.translate(X,Y);cx.rotate(a);
  const base=.16+.5*flash;
  cx.strokeStyle=`rgba(255,170,60,${base.toFixed(2)})`;
  cx.shadowColor="#ffaa3c";cx.shadowBlur=flash>0?16*flash:5;
  cx.lineWidth=1.6+1.8*flash;
  /* 육각 셀 세 겹. 나를 향한 60° 부채에만 그린다 — 몸 전체를 감싸면 껍질로 보인다 */
  const cell=r*.32;
  for(let ring=0;ring<2;ring++){
    const rad=r*1.24+ring*cell*1.22, cnt=5+ring*2;
    for(let q=-(cnt>>1);q<=(cnt>>1);q++){
      const t=q*(cell*1.22/rad)+(ring?cell*.61/rad:0), hx=Math.cos(t)*rad, hy=Math.sin(t)*rad;
      cx.beginPath();
      for(let k=0;k<6;k++){const g=k*TAU/6+t;
        const px=hx+Math.cos(g)*cell*.5, py=hy+Math.sin(g)*cell*.5;
        k?cx.lineTo(px,py):cx.moveTo(px,py);}
      cx.closePath();
      if(flash>.35){cx.fillStyle=`rgba(255,190,90,${(.09*flash).toFixed(2)})`;cx.fill();}
      cx.stroke();}}
  cx.restore();
}
/* 캔버스엔 줄바꿈이 없다. 공백으로 끊되, 한 어절이 폭보다 길면 글자로 자른다 */
function wrapT(txt,max){
  const out=[],words=txt.split(" ");let cur="";
  for(const w of words){
    const t=cur?cur+" "+w:w;
    if(cx.measureText(t).width<=max){cur=t;continue;}
    if(cur){out.push(cur);cur="";}
    if(cx.measureText(w).width<=max){cur=w;continue;}
    let c="";for(const ch of w){
      if(cx.measureText(c+ch).width>max&&c){out.push(c);c=ch;}else c+=ch;}
    cur=c;}
  if(cur)out.push(cur);
  return out.slice(0,2);   // 두 줄까지. 그보다 길면 문구 자체가 잘못된 것이다
}

function draw(){
  const p=G.p,sx=shake?rnd(-shake*11,shake*11):0,sy=shake?rnd(-shake*11,shake*11):0;
  const ox=W/2-p.x+sx, oy=H/2-p.y+sy;
  // 배경
  if(!BGC||BGW!==W||BGH!==H)bakeBG();
  cx.drawImage(BGC,0,0,W,H);
  // 별 — 3단 시차, 가까울수록 밝고 크다
  for(const band of STARB){
    cx.fillStyle=band.c;
    for(const s of G.stars){
      if(s.z<band.lo||s.z>=band.hi)continue;
      const x=((s.x+ox*s.z)%2400+2400)%2400-200, y=((s.y+oy*s.z)%1800+1800)%1800-200;
      if(x>-20&&x<W+20&&y>-20&&y<H+20)cx.fillRect(x,y,s.z*2.2,s.z*2.2);}}
  /* 격자 — 화면을 가로지르는 선 격자는 「템플릿 게임」의 인상이 가장 강했다.
     교차점에만 점을 찍는다. 움직임은 그대로 읽히고 선이 주던 모눈종이 느낌은 빠진다.
     400마다 십자를 한 번 — 속도감이 점만으로는 약하다 */
  const gs=100,x0=((ox%gs)+gs)%gs,y0=((oy%gs)+gs)%gs;
  cx.fillStyle="rgba(120,140,220,.22)";
  for(let x=x0;x<W;x+=gs)for(let y=y0;y<H;y+=gs)cx.fillRect(x-1,y-1,2,2);
  const gl=400,X0=((ox%gl)+gl)%gl,Y0=((oy%gl)+gl)%gl;
  cx.strokeStyle="rgba(120,140,220,.16)";cx.lineWidth=1;cx.beginPath();
  for(let x=X0;x<W;x+=gl)for(let y=Y0;y<H;y+=gl){cx.moveTo(x-6,y);cx.lineTo(x+6,y);cx.moveTo(x,y-6);cx.lineTo(x,y+6);}
  cx.stroke();

  // 신호권
  const zx=G.zone.x+ox, zy=G.zone.y+oy, zr=G.zone.r;
  const zg=cx.createRadialGradient(zx,zy,zr*.2,zx,zy,zr);
  zg.addColorStop(0,"rgba(255,209,102,.10)");zg.addColorStop(.75,"rgba(255,176,56,.05)");
  zg.addColorStop(1,"rgba(255,176,56,0)");
  cx.fillStyle=zg;cx.beginPath();cx.arc(zx,zy,zr,0,TAU);cx.fill();
  cx.save();cx.shadowColor=C.gold;cx.shadowBlur=22;
  cx.strokeStyle="rgba(255,209,102,.65)";cx.lineWidth=2.5;
  cx.beginPath();cx.arc(zx,zy,zr,0,TAU);cx.stroke();
  /* 남은 시간 — 위에서 시계 방향으로 줄어든다. 숫자를 안 읽어도 「곧 옮긴다」가 보인다 */
  if(!G.ct.leash&&G.zt>0){const f=Math.min(1,G.zt/(ZONE_T/G.pace));
    cx.strokeStyle=G.zt<=8?C.pink:"rgba(255,224,150,.95)";cx.lineWidth=5;cx.lineCap="round";
    cx.beginPath();cx.arc(zx,zy,zr,-Math.PI/2,-Math.PI/2+TAU*f);cx.stroke();}
  cx.restore();
  if(G.next){const k=1-Math.max(0,G.zt)/8;
    cx.save();cx.setLineDash([12,10]);cx.lineWidth=2;
    cx.strokeStyle=`rgba(255,209,102,${(.2+k*.6).toFixed(2)})`;
    cx.beginPath();cx.arc(G.next.x+ox,G.next.y+oy,zr,0,TAU);cx.stroke();cx.restore();}

  // 화염 장판
  /* 상한을 둬도 여덟 겹이면 한 색으로 덮인다. 겹친 수로 나눠 총량을 묶는다. */
  const pd=Math.min(1,3.5/Math.max(1,G.pool.length));
  for(const q of G.pool){const a=Math.min(1,q.life)*pd;
    const g=cx.createRadialGradient(q.x+ox,q.y+oy,2,q.x+ox,q.y+oy,q.r);
    /* 우물은 가운데가 비고 테두리가 짙다 — 불길과 반대로 칠해야 "빨려 드는 것"으로 읽힌다 */
    if(q.vio){g.addColorStop(0,`rgba(168,107,255,${.06*a})`);g.addColorStop(.7,`rgba(168,107,255,${.30*a})`);g.addColorStop(1,"rgba(120,40,220,0)");}
    else{g.addColorStop(0,`rgba(255,159,67,${.5*a})`);g.addColorStop(1,"rgba(255,60,0,0)");}
    cx.fillStyle=g;cx.beginPath();cx.arc(q.x+ox,q.y+oy,q.r,0,TAU);cx.fill();
    if(q.vio){cx.save();cx.strokeStyle=`rgba(168,107,255,${(.45*a).toFixed(2)})`;cx.lineWidth=2;
      cx.beginPath();cx.arc(q.x+ox,q.y+oy,q.r*(.6+.4*Math.abs(Math.sin(q.life*3))),0,TAU);cx.stroke();cx.restore();}}

  // 경험치 · 파티클
  cx.save();cx.shadowColor=C.cyan;cx.shadowBlur=10;
  for(const f of G.fx){if(!f.xp)continue;cx.fillStyle=C.cyan;
    cx.beginPath();cx.moveTo(f.x+ox,f.y+oy-5);cx.lineTo(f.x+ox+5,f.y+oy);
    cx.lineTo(f.x+ox,f.y+oy+5);cx.lineTo(f.x+ox-5,f.y+oy);cx.fill();}
  cx.restore();
  for(const f of G.fx){
    if(f.xp)continue;
    if(f.ghost){const k=1-f.life/f.max;cx.save();cx.globalAlpha=Math.max(0,1-k*1.1);
      cx.fillStyle=k<.35?"#ffffff":f.c;cx.beginPath();ePath(f,f.x+ox,f.y+oy,f.r*(1+k*.75));cx.fill();cx.restore();continue;}
    if(f.ring){const k=1-f.life/f.max,col=f.rc||C.gold;cx.save();cx.shadowColor=col;cx.shadowBlur=18;
      cx.globalAlpha=Math.max(0,1-k);cx.strokeStyle=col;cx.lineWidth=f.rw||3;
      cx.beginPath();cx.arc(f.x+ox,f.y+oy,f.ring*(.5+k),0,TAU);cx.stroke();cx.restore();continue;}
    /* 지진은 wide=π라 "부채꼴"이 아니라 360도 원판이었다. 반경 230×확장기(2.1)=483px를
       55% 알파로 통째로 칠하고, 스윙마다(공속 오르면 0.14초마다) 새로 깔렸다.
       화면이 금색으로 덮이고 스윙 리듬대로 깜빡여 「못 하겠다」는 말이 나왔다.
       채우기를 버린다. 정보는 "어디까지 닿았나"이고 그건 테두리가 나른다.
       퍼지는 고리 + 중심에서 뻗는 균열로 바꾼다 — 여러 장 겹쳐도 화면을 안 덮는다. */
    if(f.arc){
      const t=f.life/f.max, k=1-t, full=f.w>2.9;
      const X=f.x+ox, Y=f.y+oy, rr=f.r*(.45+.55*k);
      cx.save();cx.shadowColor=f.c;cx.shadowBlur=10;
      if(!full){   // 정면 강타 — 방향이 정보라 옅게라도 면을 남긴다
        cx.globalAlpha=t*.16;cx.fillStyle=f.c;
        cx.beginPath();cx.moveTo(X,Y);cx.arc(X,Y,f.r,f.a-f.w,f.a+f.w);cx.closePath();cx.fill();}
      cx.globalAlpha=t*.85;cx.strokeStyle=f.c;cx.lineWidth=(full?3.5:3)*t+1;
      cx.beginPath();cx.arc(X,Y,rr,f.a-f.w,f.a+f.w);cx.stroke();
      // 균열 — 고리 안쪽으로 짧게 뻗는다. 땅이 갈라진 것으로 읽힌다
      cx.globalAlpha=t*.5;cx.lineWidth=2;
      const NC=full?7:4;
      for(let q=0;q<NC;q++){
        const a=f.a-f.w+(q+.5)*(f.w*2/NC);
        cx.beginPath();
        cx.moveTo(X+Math.cos(a)*rr*.42,Y+Math.sin(a)*rr*.42);
        cx.lineTo(X+Math.cos(a)*rr*.95,Y+Math.sin(a)*rr*.95);cx.stroke();}
      cx.restore();continue;}
    if(f.chain){cx.save();cx.strokeStyle=f.c;cx.shadowColor=f.c;cx.shadowBlur=18;
      cx.lineWidth=3*(f.life/f.max)+1;cx.beginPath();
      f.chain.forEach((q,i)=>i?cx.lineTo(q.x+ox,q.y+oy):cx.moveTo(q.x+ox,q.y+oy));
      cx.stroke();cx.restore();continue;}
    const k=Math.max(0,f.life/(f.max||.4));
    cx.globalAlpha=k;cx.fillStyle=f.c||"#fff";
    const s=(f.sp?5:4)*(.35+.65*k);          // 사라지며 작아진다
    cx.fillRect(f.x+ox-s/2,f.y+oy-s/2,s,s);cx.globalAlpha=1;}

  // 낙뢰
  /* 맥스 빌드에서는 이 고리가 초당 열 개 넘게 겹친다. 하나하나가 밝으면
     화면이 통째로 번쩍이고 눈이 아프다. 글로우·불투명도·번개 줄기를 낮췄다. */
  /* 자기 폭풍은 6발씩 나오고 공속이 오르면 초당 52발, 동시 21개까지 간다(실측).
     고리 하나하나가 같은 밝기면 합이 흰색이 된다. 살아 있는 수로 나눠 총량을 묶는다. */
  const bd=Math.min(1,7/Math.max(1,G.bolts.length));
  for(const z of G.bolts){const k=1-z.life/z.max;
    const col=z.red?"255,77,77":z.cyan?"79,240,216":z.pink?"255,92,138":"255,209,102";
    cx.save();cx.shadowColor=z.cyan?C.cyan:C.gold;cx.shadowBlur=11*bd;
    cx.strokeStyle=`rgba(${col},${((1-k)*.72*(z.gold?1:bd)).toFixed(2)})`;cx.lineWidth=z.gold?5:2;
    cx.beginPath();cx.arc(z.x+ox,z.y+oy,z.r*(.4+k*.6),0,TAU);cx.stroke();
    if(z.cyan||z.gold||z.red||z.pink){cx.fillStyle=`rgba(${col},${((1-k)*.15*(z.gold?1:bd)).toFixed(2)})`;cx.fill();}
    /* 번개 줄기는 낙뢰 계열에만. 예전엔 자폭체 유폭에도 하늘에서 번개가 쳤다.
       빽빽할 때는 절반만 긋는다 — 21줄이 동시에 치면 화면이 하얘진다. */
    if(k>.5&&z.lit&&bd>.5){cx.lineWidth=2.2;cx.strokeStyle=`rgba(${col},${((1-k)*.5*bd).toFixed(2)})`;
      cx.beginPath();cx.moveTo(z.x+ox,z.y+oy-170);
      cx.lineTo(z.x+ox+rnd(-10,10),z.y+oy-80);cx.lineTo(z.x+ox,z.y+oy);cx.stroke();}
    cx.restore();}

  // 아이템
  for(const it of G.items){
    const col={heal:C.pink,bomb:C.orange,magnet:C.cyan,chest:C.gold}[it.type];
    const by=Math.sin(it.ph)*5;
    cx.save();cx.shadowColor=col;cx.shadowBlur=20;cx.fillStyle=col;
    cx.fillRect(it.x+ox-9,it.y+oy+by-9,18,18);cx.restore();}

  // 적
  for(const e of G.en){
    const X=e.x+ox,Y=e.y+oy;
    cx.save();cx.shadowColor=e.c;cx.shadowBlur=e.elite?22:8;
    cx.fillStyle=e.c;cx.beginPath();
    /* 숨쉬기 — 제자리에서도 4% 부풀었다 줄어든다. 같은 도형이 수백 개 떠 있어도
       위상이 달라 「찍어 놓은 도장」으로 안 보인다 */
    const hs=(1+(e.hit>0?e.hit*1.6:0))*(1+Math.sin(G.t*5+e.ph*3)*.04);   // 맞으면 16% 부푼다
    e.fa=Math.atan2(p.y-e.y,p.x-e.x);                                    // 나를 본다
    ePath(e,X,Y,e.r*hs);
    cx.fill();
    /* 피격 섬광 — 예전엔 본체를 통째로 #fff로 갈아치웠다. 탄이 많으면 화면이
       흰 도형으로 가득 차서 "나는 연한 것 / 적은 채도 높은 것" 대비가 난전에서
       무너진다(색 축 분리, v1.7.0). 갈아치우는 대신 섞어서 적 색을 남긴다. */
    cx.shadowBlur=0;
    if(e.hit>0){cx.globalAlpha=.5;cx.fillStyle="#ffffff";cx.fill();cx.globalAlpha=1;}
    /* 눈 — 가운데 흰 점 하나였던 코어를 두 눈으로 바꾼다. 눈동자가 나를 따라온다.
       도형이 「생물」로 읽히는 가장 싼 방법이고, 코어가 하던 일(단색 덩어리로 안
       보이게)도 그대로 한다. 눈 모양 · 고리 · 아가리는 자기 얼굴이 있어서 뺀다 */
    if(e.sh!=="eye"&&e.sh!=="ring"&&e.sh!=="maw"){
      const R=e.r*hs, ca=Math.cos(e.fa), sa=Math.sin(e.fa), er=Math.max(1.6,R*.2), sp=R*.34, fw=R*.16;
      const ex1=X+ca*fw-sa*sp, ey1=Y+sa*fw+ca*sp, ex2=X+ca*fw+sa*sp, ey2=Y+sa*fw-ca*sp;
      cx.fillStyle="#ffffff";cx.globalAlpha=e.hit>0?1:.92;cx.beginPath();
      cx.moveTo(ex1+er,ey1);cx.arc(ex1,ey1,er,0,TAU);cx.moveTo(ex2+er,ey2);cx.arc(ex2,ey2,er,0,TAU);cx.fill();
      const pr=er*.52, po=er*.38;
      cx.fillStyle="#0b1024";cx.globalAlpha=1;cx.beginPath();
      cx.moveTo(ex1+ca*po+pr,ey1+sa*po);cx.arc(ex1+ca*po,ey1+sa*po,pr,0,TAU);
      cx.moveTo(ex2+ca*po+pr,ey2+sa*po);cx.arc(ex2+ca*po,ey2+sa*po,pr,0,TAU);cx.fill();
    }else{cx.globalAlpha=e.hit>0?.9:.5;cx.fillStyle="#ffffff";
      cx.beginPath();cx.arc(X,Y,e.r*hs*.28,0,TAU);cx.fill();}
    cx.globalAlpha=1;cx.restore();
    /* 차폐기 범위 — 안 보이면 왜 안 죽는지 알 수 없다. 보여야 처리 순서를 배운다. */
    if(e.aura){cx.save();cx.strokeStyle="rgba(154,214,176,.45)";cx.lineWidth=1.5;cx.setLineDash([9,7]);
      cx.beginPath();cx.arc(X,Y,e.aura,0,TAU);cx.stroke();cx.restore();}
    /* 관측자 예고선 — 예고가 보이는 1.1초 안에 움직이면 빗나간다 */
    if(e.chg>0){const k=1-e.chg/1.1;
      cx.save();cx.strokeStyle="rgba(255,224,138,"+(.22+k*.62).toFixed(2)+")";cx.lineWidth=1+k*2.2;
      cx.beginPath();cx.moveTo(X,Y);cx.lineTo(p.x+ox,p.y+oy);cx.stroke();cx.restore();}
    if(e.elite){const t=TRAITS[e.tr];
      cx.strokeStyle=t?t.c:C.gold;cx.lineWidth=2.5;cx.beginPath();cx.arc(X,Y,e.r+7,0,TAU);cx.stroke();
      if(t){cx.fillStyle=t.c;cx.font="700 11px 'Chakra Petch',"+KRF;cx.textAlign="center";
        cx.fillText(t.n,X,Y-e.r-13);}}}



  // 보스 — 차단기 셔터
  /* 예전엔 보라색 원판 하나였다. 적 12종이 전부 고유 실루엣을 가진 판에서
     보스만 민무늬 원이라 덩어리로 보였다 — "기괴하다"는 말이 나온 자리다.
     조리개로 바꾸면서 체력을 모양에 실었다. 깎을수록 날이 열리고 중심이 탄다.
     날을 바깥으로 "밀어내는" 방식은 버렸다. 체력이 낮을 때 조각 여섯 개로
     흩어져 한 물체로 안 읽힌다(시안 D·D-2에서 실제로 그렇게 됐다).
     테두리 위 경첩에서 비트는 쪽이라 테두리가 항상 몸으로 남는다.
     그 테두리는 b.r 그대로다 — 예전 링은 r+12라 히트박스보다 커 보였다. */
  if(G.boss){const b=G.boss,X=b.x+ox,Y=b.y+oy;
    const col=b.fin?C.gold:C.violet, hp=Math.max(0,Math.min(1,b.hp/b.mhp));
    const th=(1-hp)*1.02, NB=6, spin=G.t*.35;
    const AD=b.ang&&ANGELS[b.ang]&&ANGELS[b.ang].draw;
    if(AD){const AN=ANGELS[b.ang];AN.draw(X,Y,b);
      const sh=!!(AN.shielded&&AN.shielded(b));
      /* 군체는 본체가 없다 — r을 음수로 둬서 아무것도 안 맞게 만든 사도다.
         몸이 없는 놈에게 코어를 그리면 허공에 약점이 뜬다 */
      if(b.r>0){if(sh||b.at>0)drawAT(X,Y,b);drawCore(X,Y,b,sh);}}
    else{
    cx.save();
    // 몸통과 새는 빛 — 테두리 안쪽으로 잘라낸다. 빛이 밖으로 번지면 조리개가 아니다
    cx.save();
    cx.beginPath();cx.arc(X,Y,b.r,0,TAU);cx.clip();
    cx.fillStyle=b.fin?"#1d1607":"#150c28";cx.fillRect(X-b.r,Y-b.r,b.r*2,b.r*2);
    const gr=b.r*(.22+.86*(1-hp));
    const g=cx.createRadialGradient(X,Y,1,X,Y,gr);
    g.addColorStop(0,`rgba(255,255,255,${(.5+.45*(1-hp)).toFixed(2)})`);
    g.addColorStop(.4,b.fin?"rgba(255,209,102,.85)":"rgba(255,92,138,.85)");
    g.addColorStop(1,"rgba(255,92,138,0)");
    cx.fillStyle=g;cx.beginPath();cx.arc(X,Y,gr,0,TAU);cx.fill();
    // 날 — 경첩 간 현(弦)이 b.r이라 반폭 .54r면 닫혔을 때 서로 물린다
    cx.shadowColor=col;cx.shadowBlur=10;
    cx.fillStyle=b.fin?"#4a3813":"#2e1c52";cx.strokeStyle=col;cx.lineWidth=2.2;cx.lineJoin="miter";
    for(let q=0;q<NB;q++){const a=spin+q*TAU/NB;
      cx.save();cx.translate(X+Math.cos(a)*b.r,Y+Math.sin(a)*b.r);cx.rotate(a+Math.PI+th);
      cx.beginPath();
      cx.moveTo(0,-b.r*.54);
      cx.lineTo(b.r*1.06,-b.r*.15);
      cx.lineTo(b.r*.88, b.r*.17);
      cx.lineTo(0, b.r*.54);
      cx.closePath();cx.fill();cx.stroke();
      cx.restore();}
    cx.restore();
    if(b.hit>0){cx.save();cx.globalAlpha=.5;cx.fillStyle="#ffffff";
      cx.beginPath();cx.arc(X,Y,b.r,0,TAU);cx.fill();cx.restore();}
    // 테두리 = 몸 = 히트박스
    cx.shadowColor=col;cx.shadowBlur=22;cx.strokeStyle=col;cx.lineWidth=3.5;
    cx.beginPath();cx.arc(X,Y,b.r,0,TAU);cx.stroke();
    cx.fillStyle=col;cx.shadowBlur=10;
    for(let q=0;q<NB;q++){const a=spin+q*TAU/NB;
      cx.beginPath();cx.arc(X+Math.cos(a)*b.r,Y+Math.sin(a)*b.r,3.2,0,TAU);cx.fill();}
    // 바깥 육각 프레임 — 날과 반대로 돈다
    cx.shadowBlur=12;cx.strokeStyle=b.fin?"rgba(255,209,102,.6)":"rgba(168,107,255,.6)";
    cx.lineWidth=2;cx.beginPath();
    for(let q=0;q<6;q++){const a=-spin*.6+q*TAU/6;
      const xx=X+Math.cos(a)*b.r*1.24,yy=Y+Math.sin(a)*b.r*1.24;q?cx.lineTo(xx,yy):cx.moveTo(xx,yy);}
    cx.closePath();cx.stroke();
    /* 종단 재머는 프레임 밖에 호 세 겹을 더 돌린다 — 크기 말고 격으로 구분한다 */
    if(b.fin){cx.strokeStyle="rgba(255,209,102,.75)";cx.lineWidth=2.5;
      for(let q=0;q<3;q++){const rr=b.r*1.4+q*15, aa=G.t*(q%2?-.6:.9)+q*2;
        cx.beginPath();cx.arc(X,Y,rr,aa,aa+TAU*.62);cx.stroke();}}
    cx.restore();
    }
    const AN=b.ang?ANGELS[b.ang]:null, bc=b.fin?C.gold:AN?AN.c:C.pink;
    /* 이름표 — 등장 4초는 크게, 그 뒤엔 작게 남는다. 무엇과 싸우는지 계속 보여야 한다 */
    {const age=b.age||0, big=age<4, sc=big?1.5:1, al=big?1:.72;
     const nm="제"+b.no+"사도 "+(b.fin?"종단":AN?AN.n:"재머");
     cx.save();cx.textAlign="center";
     cx.font="700 "+(13*VS*sc).toFixed(1)+"px "+KRF;
     const tw=cx.measureText(nm).width, ty=Y-b.r-(big?26:18)*VS;
     cx.globalAlpha=al;
     cx.fillStyle="rgba(8,11,24,.72)";
     cx.fillRect(X-tw/2-8*VS,ty-13*VS*sc,tw+16*VS,19*VS*sc);
     cx.fillStyle=bc;cx.shadowColor=bc;cx.shadowBlur=big?16:8;
     cx.fillText(nm,X,ty);
     cx.restore();}
    /* 무적이면 바가 회색이 된다 — 숫자 대신 색으로 「지금은 안 통한다」를 보여 준다 */
    const inv=!!(AN&&AN.shielded&&AN.shielded(b)), bh=(b.fin?13:9)*VS;
    cx.fillStyle="rgba(11,16,36,.9)";cx.fillRect(W*.16,54*VS,W*.68,bh);
    cx.fillStyle=inv?"#5a6280":bc;cx.fillRect(W*.16,54*VS,W*.68*Math.max(0,b.hp/b.mhp),bh);
    cx.save();cx.textAlign="center";
    /* 잡는 법은 싸우는 내내 보여야 한다 — 한 번 스쳐 간 배너로는 못 읽는다 */
    const nm2="제"+b.no+"사도 "+(b.fin?"종단":AN?AN.n:"재머");
    const guide=inv?"지금은 안 통해요 — "+(AN&&AN.how?AN.how:""):(b.fin?"체력에 따라 공격이 3번 바뀌어요":AN&&AN.how?AN.how:"");
    const nf="700 "+(14*VS).toFixed(1)+"px "+KRF, gf="700 "+(13*VS).toFixed(1)+"px "+KRF;
    const maxw=W*.92-26*VS;
    cx.font=gf;
    const gl=guide?wrapT(guide,maxw):[];   // 좁은 화면에선 두 줄이 된다
    const ny=(54+11)*VS+bh, lh=17*VS, gy=(54+30)*VS+bh;
    /* 판 — 가장 긴 줄에 맞춘다. 이게 없으면 탄막 위에서 글자가 사라진다 */
    cx.font=nf;let pw=cx.measureText(nm2).width;
    cx.font=gf;for(const L of gl)pw=Math.max(pw,cx.measureText(L).width);
    pw+=26*VS;
    const pt=ny-14*VS, phh=(19+gl.length*17)*VS;
    cx.fillStyle="rgba(6,9,20,.86)";cx.fillRect(W/2-pw/2,pt,pw,phh);
    cx.fillStyle=inv?"rgba(255,92,138,.5)":"rgba(255,255,255,.14)";
    cx.fillRect(W/2-pw/2,pt,pw,1.5*VS);
    cx.font=nf;cx.fillStyle=inv?"#b9c2e8":bc;
    cx.shadowColor=inv?"#000":bc;cx.shadowBlur=inv?0:9;
    cx.fillText(nm2,W/2,ny);
    cx.shadowBlur=0;
    cx.font=gf;cx.fillStyle=inv?"#ff9fb8":"rgba(255,255,255,.94)";
    gl.forEach((L,i)=>cx.fillText(L,W/2,gy+i*lh));
    G.guideBox={x:W/2-pw/2,y:pt,w:pw,h:phh};   // HUD가 이 사각형을 피해야 한다
    cx.restore();}

  // 탄
  cx.save();cx.shadowBlur=16;cx.lineCap="round";
  for(const b of G.bul){cx.shadowColor=b.c;cx.fillStyle=b.c;
    const sp=Math.hypot(b.vx,b.vy);
    if(sp>240&&!b.beam){            // 빠른 탄은 진행 방향으로 꼬리를 끈다
      const t=Math.min(30,sp*.03);
      cx.shadowBlur=0;                    // 꼬리엔 그림자를 끈다 — 그림자 stroke는 비싸다
      cx.strokeStyle=b.c;cx.lineWidth=b.r*1.6;cx.globalAlpha=.5;
      cx.beginPath();cx.moveTo(b.x+ox,b.y+oy);
      cx.lineTo(b.x+ox-b.vx/sp*t,b.y+oy-b.vy/sp*t);cx.stroke();
      cx.globalAlpha=1;cx.shadowBlur=16;}
    if(b.beam){cx.globalAlpha=.9;cx.beginPath();cx.arc(b.x+ox,b.y+oy,b.r,0,TAU);cx.fill();cx.globalAlpha=1;}
    else{cx.beginPath();cx.arc(b.x+ox,b.y+oy,b.r,0,TAU);cx.fill();}}
  cx.shadowColor=C.pink;cx.fillStyle=C.pink;
  for(const b of G.eb){cx.beginPath();cx.arc(b.x+ox,b.y+oy,b.r,0,TAU);cx.fill();}
  cx.restore();

  // 검
  if(G.blades)for(const o of G.blades){
    cx.save();cx.translate(o.x+ox,o.y+oy);cx.rotate(o.a+Math.PI/2);
    cx.shadowColor="#dfe6ff";cx.shadowBlur=18;cx.fillStyle="#eef2ff";
    cx.fillRect(-2.5,-o.r,5,o.r*2);cx.restore();}

  // 권능 · 파편
  if(G.ang.shard&&G.shards)for(const o of G.shards){
    cx.save();cx.translate(o.x+ox,o.y+oy);cx.rotate(G.shardA*1.4);
    cx.shadowColor="#9ad6e0";cx.shadowBlur=12;cx.fillStyle="#13303a";cx.strokeStyle="#9ad6e0";cx.lineWidth=1.8;
    cx.beginPath();cx.moveTo(0,-o.r);cx.lineTo(o.r,0);cx.lineTo(0,o.r);cx.lineTo(-o.r,0);cx.closePath();cx.fill();cx.stroke();
    cx.restore();}
  // 유령 분신
  if(!G.dyHide&&G.stage>=2&&G.form==="rover")for(const ci of HIST_IDX()){const h=G.hist[ci];if(!h)continue;
    cx.save();cx.globalAlpha=.5-ci*.014;drawShip(h.x+ox,h.y+oy,p.dx,p.dy,"rover",G.stage,null);cx.restore();}
  // 요새 포탑
  if(G.stage>=2&&G.form==="warden")for(const t of G.turrets){
    cx.save();cx.strokeStyle="rgba(255,209,102,.35)";cx.lineWidth=1.5;cx.beginPath();cx.moveTo(W/2+sx,H/2+sy);cx.lineTo(t.x+ox,t.y+oy);cx.stroke();
    cx.shadowColor=C.gold;cx.shadowBlur=16;cx.fillStyle=C.gold;cx.translate(t.x+ox,t.y+oy);cx.rotate(t.a);
    cx.fillRect(-7,-7,14,14);cx.restore();}
  // 플레이어
  const px=W/2+sx,py=H/2+sy;
  cx.save();cx.shadowColor=G.ult.t>0?C.violet:(p.in?C.gold:C.cyan);cx.shadowBlur=G.ult.t>0?48:26;
  if(p.flash>0){cx.shadowColor=C.pink;}
  if(!G.dyHide)drawShip(px,py,p.dx,p.dy,G.form,G.stage,p.flash>0?C.pink:null);
  if(!G.dyHide&&G.form==="warden"&&G.shield.up){cx.strokeStyle="rgba(255,209,102,.9)";cx.lineWidth=2.5;cx.setLineDash([14,8]);
    cx.lineDashOffset=-G.t*40;cx.beginPath();cx.arc(px,py,p.r+13,0,TAU);cx.stroke();cx.setLineDash([]);}
  cx.restore();
  cx.strokeStyle="rgba(79,240,216,.22)";cx.lineWidth=1;
  cx.beginPath();cx.arc(px,py,p.mag,0,TAU);cx.stroke();

  /* 장막(제12사도) — 보스에게서 퍼지는 안개. 정전 마스크를 그대로 쓰되 구멍을
     내 발밑에만 둔다. 안개 밖으로 나가면 풀리는 게 이 사도의 답이다 */
  if(G.boss&&G.boss.ang==="veil"&&G.boss.fog>.05){
    const b=G.boss, FR=440*b.fog, bx=b.x+ox, by=b.y+oy;
    const d=Math.hypot(G.p.x-b.x,G.p.y-b.y);
    if(d<FR+200)blackoutMask(bx,by,-1, px,py,150, .78*b.fog*Math.min(1,(FR+200-d)/200));
  }
  /* 정전 — 신호권 밖이 어두워진다.
     destination-out으로 구멍을 뚫으려 했다가 실패했다. 월드와 어둠이 같은
     레이어라서 지우면 게임 화면까지 함께 지워진다(통째로 검게 나왔다).
     사각형에서 원 둘을 빼는 evenodd 채우기가 맞다 — 오프스크린 캔버스도 안 쓴다.
     구멍이 둘인 이유: 신호권은 밝아야 "안으로 들어가라"가 읽히고, 발밑은 보여야
     안 보이는 것에 맞아 죽지 않는다. 둘째가 없으면 긴장이 아니라 부당함이 된다. */
  if(G.sev&&G.sev.id==="blackout"){
    const k=Math.min(1,Math.min(G.sevT,1.2)/1.2);            // 시작·끝에서 부드럽게
    blackoutMask(G.zone.x+ox,G.zone.y+oy,G.zone.r, px,py,170, .82*k);
  }
  // 화면 밖 인디케이터
  /* 가장자리에 화살표가 일곱 개씩 겹쳐 쌓여 정작 신호권 화살표가 묻혔다.
     신호권은 1.5배로 키우고, 아이템은 가장 가까운 둘만 가리킨다 */
  if(!p.in)edgeArrow(G.zone.x,G.zone.y,ox,oy,C.gold,Math.round(Math.hypot(G.zone.x-p.x,G.zone.y-p.y)/10)+"m",1.5);
  if(G.next)edgeArrow(G.next.x,G.next.y,ox,oy,C.pink,"다음 "+Math.ceil(G.zt)+"s");
  for(const it of G.items.slice().sort((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y)).slice(0,2))
    edgeArrow(it.x,it.y,ox,oy,{heal:C.pink,bomb:C.orange,magnet:C.cyan,chest:C.gold}[it.type],"",.8);
  for(const e of G.en)if(e.chg>0)edgeArrow(e.x,e.y,ox,oy,"#ffe08a","조준");
  // 간섭 노이즈
  if(G.outT>30){const k=Math.min(1,(G.outT-30)/20);cx.fillStyle=`rgba(255,80,120,${.06*k})`;
    for(let i=0;i<14*k;i++)cx.fillRect(rnd(0,W),rnd(0,H),rnd(20,220),rnd(1,3));}
  // 데미지 숫자
  /* 크기가 피해를 말한다 — 모두 17px였을 때는 44와 400이 같은 무게였다.
     처음 0.12초는 1.6배에서 가라앉는다(팝). 어두운 테두리로 난전에서도 읽힌다 */
  cx.textAlign="center";cx.lineJoin="round";
  for(const n of G.num){
    const num=typeof n.v==="number", base=num?Math.min(27,13+Math.sqrt(n.v)*.95):15;
    const pop=n.t!==undefined?1+Math.max(0,.12-n.t)/.12*.6:1;
    cx.font="800 "+(base*(n.crit?1.35:1)*pop*VS).toFixed(1)+"px "+KRF;
    const tx=n.crit?n.v+"!":n.v;
    cx.globalAlpha=Math.min(1,n.life*2.2);
    cx.lineWidth=3.2*VS;cx.strokeStyle="rgba(5,7,15,.8)";cx.strokeText(tx,n.x+ox,n.y+oy);
    cx.fillStyle=n.c;cx.fillText(tx,n.x+ox,n.y+oy);}
  cx.globalAlpha=1;

  // 비네트
  const v=cx.createRadialGradient(W/2,H/2,Math.min(W,H)*.42,W/2,H/2,Math.max(W,H)*.78);
  v.addColorStop(0,"rgba(0,0,0,0)");v.addColorStop(1,"rgba(0,0,0,.6)");
  cx.fillStyle=v;cx.fillRect(0,0,W,H);
  if(p.flash>0){cx.fillStyle=`rgba(255,60,100,${p.flash*.35})`;cx.fillRect(0,0,W,H);}
  if(G.flash.t>0){cx.fillStyle=`rgba(${G.flash.c},${(G.flash.t*.55).toFixed(2)})`;cx.fillRect(0,0,W,H);}
  /* 끝나는 순간 — 뒤 절반 동안 어두워져 결과창이 툭 뜨지 않고 그 위로 올라온다 */
  if(G.dying>0){const k=Math.max(0,1-G.dying/(END_T*.55));cx.fillStyle=`rgba(4,6,14,${(k*.62).toFixed(3)})`;cx.fillRect(0,0,W,H);}
  drawStick();
}

/* 가상 조이스틱 — 손가락이 닿은 자리에 원과 노브 */
/* 적 도형 — 본체와 사망 잔상이 같은 모양을 쓴다. 경로만 만들고 칠은 부르는 쪽 몫이다 */
function ePath(e,X,Y,r){
    if(e.sh==="tri"){const a=e.fa!==undefined?e.fa:-Math.PI/2;   // 머리를 나에게 — 돌진하는 놈이 위만 보고 있었다
      cx.moveTo(X+Math.cos(a)*r*1.1,Y+Math.sin(a)*r*1.1);
      cx.lineTo(X+Math.cos(a+2.45)*r,Y+Math.sin(a+2.45)*r);cx.lineTo(X+Math.cos(a-2.45)*r,Y+Math.sin(a-2.45)*r);cx.closePath();}
    else if(e.sh==="square"){const w=r*1.7;cx.rect(X-w/2,Y-w/2,w,w);}
    else if(e.sh==="diamond"){cx.moveTo(X,Y-r);cx.lineTo(X+r,Y);cx.lineTo(X,Y+r);cx.lineTo(X-r,Y);cx.closePath();}
    else if(e.sh==="wall"){cx.rect(X-r,Y-r*.55,r*2,r*1.1);}
    else if(e.sh==="bomb"){cx.arc(X,Y,r*(1+Math.sin(e.ph*2)*.15),0,TAU);}
    else if(e.sh==="cell"){cx.arc(X,Y,r,0,TAU);cx.moveTo(X+r*.35,Y-r*.3);cx.arc(X-r*.3,Y-r*.3,r*.35,0,TAU);cx.moveTo(X+r*.6,Y+r*.3);cx.arc(X+r*.25,Y+r*.3,r*.35,0,TAU);}
    /* 고리 — 안쪽을 반대로 감아 구멍을 낸다(nonzero). 배회체가 "도는 것"으로 읽힌다 */
    else if(e.sh==="ring"){cx.arc(X,Y,r,0,TAU);cx.arc(X,Y,r*.48,0,TAU,true);}
    /* 렌즈 — 관측자. 가로로 눕힌 눈 모양이라 멀리서도 다른 종과 안 헷갈린다 */
    else if(e.sh==="eye"){cx.moveTo(X-r,Y);cx.quadraticCurveTo(X,Y-r*.95,X+r,Y);cx.quadraticCurveTo(X,Y+r*.95,X-r,Y);}
    /* 육각 — 차폐기. 방어계 실루엣과 같은 계열이라 "막는 놈"으로 읽힌다 */
    else if(e.sh==="hex"){for(let q=0;q<6;q++){const ang=q/6*TAU-Math.PI/2,xx=X+Math.cos(ang)*r,yy=Y+Math.sin(ang)*r;q?cx.lineTo(xx,yy):cx.moveTo(xx,yy);}cx.closePath();}
    /* 아가리 — 천천히 도는 톱니. 다른 어떤 적과도 안 닮았다 */
    else if(e.sh==="maw"){const n=9;for(let q=0;q<n;q++){const ang=q/n*TAU+e.ph*.35,rr=r*(q%2?.55:1);
      const xx=X+Math.cos(ang)*rr,yy=Y+Math.sin(ang)*rr;q?cx.lineTo(xx,yy):cx.moveTo(xx,yy);}cx.closePath();}
    else cx.arc(X,Y,r*(1+Math.sin(e.ph)*.05),0,TAU);
}
function drawStick(){
  if(!touch)return;
  const bx=touch.ox*VS, by=touch.oy*VS, r=STICK*VS;
  cx.save();
  cx.fillStyle="rgba(13,18,36,.34)";cx.beginPath();cx.arc(bx,by,r,0,TAU);cx.fill();
  cx.strokeStyle="rgba(79,240,216,.34)";cx.lineWidth=1.6*VS;
  cx.beginPath();cx.arc(bx,by,r,0,TAU);cx.stroke();
  const kx=bx+touch.x*r, ky=by+touch.y*r;
  cx.shadowColor=C.cyan;cx.shadowBlur=10*VS;
  cx.fillStyle="rgba(79,240,216,.55)";cx.beginPath();cx.arc(kx,ky,r*.33,0,TAU);cx.fill();
  cx.shadowBlur=0;cx.strokeStyle="rgba(220,255,250,.7)";cx.lineWidth=1.4*VS;
  cx.beginPath();cx.arc(kx,ky,r*.33,0,TAU);cx.stroke();
  cx.restore();
}

function edgeArrow(wx,wy,ox,oy,col,label,sz=1){
  const sxp=wx+ox,syp=wy+oy,m=30*VS;
  if(sxp>m&&sxp<W-m&&syp>m&&syp<H-m)return;
  const cxp=W/2,cyp=H/2,a=Math.atan2(syp-cyp,sxp-cxp),dx=Math.cos(a),dy=Math.sin(a);
  /* 위쪽은 시계·경고 글줄 아래에서 멈춘다 — 화살표가 시계 위에 겹쳐 찍혔다 */
  const mt=88*VS;
  const tx=dx>0?(W-m-cxp)/dx:dx<0?(m-cxp)/dx:1e9,ty=dy>0?(H-m-cyp)/dy:dy<0?(mt-cyp)/dy:1e9;
  const t=Math.min(tx,ty),ex=cxp+dx*t,ey=cyp+dy*t;
  cx.save();cx.translate(ex,ey);cx.scale(VS*sz,VS*sz);cx.rotate(a);cx.fillStyle=col;cx.shadowColor=col;cx.shadowBlur=14;
  cx.beginPath();cx.moveTo(14,0);cx.lineTo(-8,-9);cx.lineTo(-8,9);cx.closePath();cx.fill();
  cx.rotate(-a);cx.shadowBlur=0;
  if(label){cx.font="700 12px "+KRF;cx.textAlign="center";cx.fillText(label,0,ey>H/2?-16:26);}
  cx.restore();
}
/* 기체 실루엣 — 게임 화면과 선택 카드가 같은 함수를 쓴다.
   (0,0) 기준으로 +X를 바라본다. 이동·회전은 호출부 몫이다.
   본체는 연한 색으로 두고 기체 색은 액센트와 코어에만 쓴다 —
   본체까지 색을 입히면 보라(위스프)·주황(사수)·금색(엘리트) 적과 헷갈린다. */
/* 기체 고유 장식만 따로 뺀다. 본체 모양은 진화(기동계·방어계)가 정하고
   이 장식은 시작 기체가 정한다 — 그래서 진화 후에도 어디서 출발했는지 남는다.
   (0,0) 기준, +X를 바라본다. */
function charAccent(g,k,R,col){
  const acc=col||(CHARS[k]||CHARS.relay).c;
  g.save();g.lineCap="round";g.strokeStyle=acc;
  if(k==="runner"){                      // 추진 흔적
    g.lineWidth=R*.26;
    g.beginPath();g.moveTo(-R*.5,-R*.5);g.lineTo(-R*1.5,-R*.72);
    g.moveTo(-R*.5,R*.5);g.lineTo(-R*1.5,R*.72);g.stroke();
  }else if(k==="shield"){                // 전방 방패 호
    g.lineWidth=R*.34;
    g.beginPath();g.arc(0,0,R*1.5,-.95,.95);g.stroke();
  }else if(k==="tech"){                  // 대각 스파이크
    g.lineWidth=R*.16;
    for(let i=0;i<4;i++){const t=Math.PI/4+i*Math.PI/2;
      g.beginPath();g.moveTo(Math.cos(t)*R*.75,Math.sin(t)*R*.75);
      g.lineTo(Math.cos(t)*R*1.3,Math.sin(t)*R*1.3);g.stroke();}
  }else{                                 // 신호 링
    g.lineWidth=R*.2;g.globalAlpha=.85;
    g.beginPath();g.arc(0,0,R*1.45,-2.35,-.75);g.stroke();
    g.beginPath();g.arc(0,0,R*1.45,.75,2.35);g.stroke();
  }
  g.restore();
}
function drawChar(g,k,R,col){
  const body=col||"#eef2ff", acc=(CHARS[k]||CHARS.relay).c;   // 장식은 섬광에 물들지 않는다
  charAccent(g,k,R);
  g.fillStyle=body;
  if(k==="runner"){                      // 화살촉 — 뒤가 파여 대셔의 단순 삼각과 다르다
    g.beginPath();
    g.moveTo(R*1.75,0);g.lineTo(-R*.95,-R*1.05);g.lineTo(-R*.35,0);g.lineTo(-R*.95,R*1.05);
    g.closePath();g.fill();
  }else if(k==="shield"){                // 사각 본체 — 탱크의 민 사각과 다르다
    const s=R*.92;g.beginPath();
    if(g.roundRect)g.roundRect(-s,-s,s*2,s*2,R*.3);else g.rect(-s,-s,s*2,s*2);
    g.fill();
  }else if(k==="tech"){                  // 마름모 — 사수의 민 마름모와 다르다
    g.beginPath();
    g.moveTo(R*1.5,0);g.lineTo(0,-R*1.15);g.lineTo(-R*1.5,0);g.lineTo(0,R*1.15);
    g.closePath();g.fill();
  }else{                                 // 중계사 — 원 + 노즈, 위스프/파편과 구분된다
    g.beginPath();
    g.moveTo(R*1.55,0);g.lineTo(R*.2,-R*.6);g.lineTo(R*.2,R*.6);g.closePath();g.fill();
    g.beginPath();g.arc(0,0,R,0,TAU);g.fill();
  }
  g.fillStyle=acc;g.beginPath();g.arc(0,0,R*.3,0,TAU);g.fill();
}
/* 색 축 분리 — 진화 색과 기체 색을 같은 5색 팔레트에서 뽑으면 충돌이 필연이다.
   (중계사×기동계1차 = 둘 다 cyan, 질주자×관제탑 = 둘 다 orange …)
   그래서 축을 나눈다: 형태 = 진화(화살/육각), 색 = 기체, 크기·요소 수 = 단계.
   본체를 연한 색으로 두는 건 "나는 연한 것, 적은 채도 높은 것" 대비를 지키기 위함이고,
   진화를 색이 아닌 형태로 읽게 되므로 색약 대응도 같이 좋아진다. */
const chCol=()=>(CHARS[(G&&G.ch)||"relay"]||CHARS.relay).c;
function drawShip(x,y,dx,dy,form,stage,over){
  /* 피격 섬광은 본체에만 준다 — 장식까지 같은 색이 되면 실루엣이 사라진다 */
  const a=Math.atan2(dy,dx), acc=chCol(), body=over||"#eef2ff";
  cx.save();cx.translate(x,y);
  if(!form||form==="none"||stage===0){
    cx.rotate(a);drawChar(cx,(G&&G.ch)||"relay",13,over);
  }else if(form==="rover"){
    const S=stage>=3?1.34:stage===2?1.12:1;      // 단계는 크기로도 자란다
    /* 장식을 본체 위에 올린다 — 아래 깔면 육각형 본체에 60%가 가려진다 */
    cx.rotate(a);cx.scale(S,S);
    cx.fillStyle=body;cx.beginPath();
    if(stage===1){                                // 날렵한 화살
      cx.moveTo(20,0);cx.lineTo(-12,-13);cx.lineTo(-5,0);cx.lineTo(-12,13);
    }else{                                        // 유령 이상 — 긴 날개
      cx.moveTo(26,0);cx.lineTo(-16,-22);cx.lineTo(-4,0);cx.lineTo(-16,22);
    }
    cx.closePath();cx.fill();
    if(stage>=3){                                 // 3차는 날개가 한 겹 늘어난다 — 확대가 아니라 요소 추가
      cx.strokeStyle=acc;cx.lineWidth=2.4;cx.beginPath();
      cx.moveTo(-14,-26);cx.lineTo(14,-13);cx.moveTo(-14,26);cx.lineTo(14,13);cx.stroke();}
    charAccent(cx,(G&&G.ch)||"relay",stage>=3?20:stage===2?17:14);
    cx.fillStyle=acc;cx.beginPath();cx.arc(stage===1?4:6,0,4,0,TAU);cx.fill();
  }else if(form==="pulse"){
    /* 마름모 본체 + 공명 고리. 고리가 스택만큼 찬다 — 몸에 게이지가 있다 */
    const S=stage>=3?1.3:stage===2?1.12:1, k=G?Math.min(1,G.res/(G.resCap||40)):0;
    cx.rotate(a);cx.scale(S,S);
    cx.fillStyle=body;cx.beginPath();cx.moveTo(18,0);cx.lineTo(0,-11);cx.lineTo(-12,0);cx.lineTo(0,11);cx.closePath();cx.fill();
    cx.strokeStyle=acc;cx.lineWidth=2.6;cx.beginPath();cx.arc(0,0,17,-Math.PI/2,-Math.PI/2+TAU*k);cx.stroke();
    if(stage>=2){cx.strokeStyle="rgba(255,92,138,.55)";cx.lineWidth=1.6;cx.setLineDash([4,5]);cx.lineDashOffset=-(G?G.t:0)*30*(1+k*2);
      cx.beginPath();cx.arc(0,0,23,0,TAU);cx.stroke();cx.setLineDash([]);}
    if(stage>=3){cx.strokeStyle=acc;cx.lineWidth=2;cx.beginPath();cx.moveTo(-6,-20);cx.lineTo(10,-8);cx.moveTo(-6,20);cx.lineTo(10,8);cx.stroke();}
    charAccent(cx,(G&&G.ch)||"relay",stage>=3?19:stage===2?16:13);
    cx.fillStyle=acc;cx.beginPath();cx.arc(3,0,4,0,TAU);cx.fill();
  }else{ // warden
    const n=6,R=stage>=3?26:stage===2?22:16;
    cx.save();cx.rotate(G.t*.6);                  // 본체만 자전한다
    cx.fillStyle=body;cx.beginPath();
    for(let i=0;i<n;i++){const g=i/n*TAU;i?cx.lineTo(Math.cos(g)*R,Math.sin(g)*R):cx.moveTo(R,0);}
    cx.closePath();cx.fill();
    cx.fillStyle="#0b1024";cx.beginPath();
    for(let i=0;i<n;i++){const g=i/n*TAU;i?cx.lineTo(Math.cos(g)*R*.55,Math.sin(g)*R*.55):cx.moveTo(R*.55,0);}
    cx.closePath();cx.fill();
    if(stage>=2){                                 // 2차 6갈래 → 3차 12갈래
      const m=stage>=3?12:6;
      cx.strokeStyle=acc;cx.lineWidth=stage>=3?3.4:3;cx.beginPath();
      for(let i=0;i<m;i++){const g=i/m*TAU;cx.moveTo(Math.cos(g)*R,Math.sin(g)*R);cx.lineTo(Math.cos(g)*(R+9),Math.sin(g)*(R+9));}
      cx.stroke();}
    cx.restore();
    /* 장식은 진행 방향 고정 — 본체와 같이 돌면 방패 호가 뒤를 막는다 */
    cx.save();cx.rotate(a);charAccent(cx,(G&&G.ch)||"relay",stage>=3?23:stage===2?19:15);cx.restore();
    cx.fillStyle=acc;cx.beginPath();cx.arc(0,0,4.5,0,TAU);cx.fill();
  }
  cx.restore();
}

/* ───── HUD ───── */
const ULT_C=2*Math.PI*39;               // 궁극기 링 둘레
$("#ultprg").style.strokeDasharray=ULT_C.toFixed(1);
function hud(){
  const p=G.p;
  /* 4초 동안 보여주고 1.5초에 걸쳐 사라진다 */
  if(G.tip!==undefined){const a=G.t<4?Math.min(1,G.t/.4):Math.max(0,1-(G.t-4)/1.5);
    $("#tip").style.opacity=a; if(a<=0)delete G.tip;}
  $("#lvbadge").textContent="LV "+p.lv;

function loop(now){requestAnimationFrame(loop);
  if(mode!=="play"){last=now;return;}
  let dt=Math.min(.05,(now-last)/1000);last=now;
  if(G.dying>0){endTick(dt);draw();if(G.dying<=0)finish(G.dyWon);return;}
  if(hitstop>0){hitstop-=dt;dt*=.12;}

    e.textContent=N[st][f]+" · "+st+"차";

function contRun(){

/* ───── 끝나는 순간 ─────
   체력이 0이 되는 프레임에 결과창이 떴다. 무엇에 맞았는지 볼 틈도 없이 화면이
   바뀌니 억울함도 아쉬움도 안 남는다 — 「한 판 더」를 누르게 하는 건 그 감정이다.
   1.5초를 준다. 기체가 터지고, 세계가 거의 멈춘 채 파편이 흩어지고, 화면이
   어두워지면서 결과창이 그 위로 올라온다.
   세계를 느리게 돌리지 않고 멈추는 이유: 느리게라도 돌리면 무기가 계속 쏘고
   구슬이 계속 빨려 와서, 죽은 뒤에 처치와 레벨업이 쌓인다. 순위표 점수가
   사후에 오른다. 그래서 파편·숫자·흔들림만 흐르고, 적은 표류만 한다. */
const END_T=1.5;
function startEnd(won){
  if(G.dying>0||G.over)return;
  const p=G.p;G.dying=END_T;G.dyWon=!!won;G.dyHide=!won;
  hitstop=0;SFX.bgm(false);
  if(won){G.flash={t:.9,c:"255,209,102"};shake=Math.max(shake,.8);return;}
  /* 기체가 터진다 — 기체 색 파편 + 흰 파편, 충격파 두 겹 */
  const col=(CHARS[G.ch]||CHARS.relay).c;
  for(let i=0;i<56;i++){const a=rnd(0,TAU),v=rnd(80,520);
    G.fx.push({x:p.x,y:p.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rnd(.7,1.4),max:1.4,c:i%3?col:"#ffffff"});}
  G.fx.push({x:p.x,y:p.y,vx:0,vy:0,life:.7,max:.7,ring:150,rc:col,rw:4});
  G.fx.push({x:p.x,y:p.y,vx:0,vy:0,life:1.1,max:1.1,ring:320,rc:"#ffffff",rw:2});
  G.flash={t:.7,c:"255,80,110"};shake=Math.max(shake,1.1);SFX.die();
}
function endTick(dt){
  G.dying-=dt;
  const k=.12;                                   // 적은 거의 멈춘 채 충격파에 밀려난다
  for(const e of G.en){if(e.dead)continue;const a=Math.atan2(e.y-G.p.y,e.x-G.p.x);
    e.x+=Math.cos(a)*e.spd*k*dt;e.y+=Math.sin(a)*e.spd*k*dt;e.hit=Math.max(0,e.hit-dt);}
  for(let i=G.fx.length-1;i>=0;i--){const f=G.fx[i];if(f.xp)continue;   // 구슬은 먹지 않는다
    f.life-=dt;if(f.vx){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=.95;f.vy*=.95;}
    if(f.life<=0)G.fx.splice(i,1);}
  for(let i=G.num.length-1;i>=0;i--){const n=G.num[i];n.life-=dt;n.y-=44*dt;n.t=(n.t||0)+dt;if(n.vx)n.x+=n.vx*dt;if(n.life<=0)G.num.splice(i,1);}
  G.flash.t=Math.max(0,G.flash.t-dt);shake=Math.max(0,shake-dt*1.6);G.p.flash=0;
}
function pause(){if(G&&G.dying>0)return;mode="pause";saveRun();showVeil("#v-pause");}

function finish(won){

  track("end",{kills:G.kills,lv:G.p.lv,ch:G.ch,form:G.form,won:!!won,cause:won?"":(G.lastHit||""),
    ended:!!G.endNow,score:calcScore()},G.t);
  G.lastRid=RID;RID=null;
  SAVE.runs++;if(G.t>SAVE.best)SAVE.best=G.t;if(G.kills>SAVE.bestk)SAVE.bestk=G.kills;
  markDaily(calcScore());

  $("#otitle").textContent=trueEnd?"끝까지 지켰다":won?"재머를 끊었다":"신호가 끊어졌다";

  /* 지난 나 — 사람이 둘뿐이어도 경쟁 상대가 생긴다. 단 조건이 같아야 한다 */
  const sd=scoreDelta();
  $("#delta").innerHTML=sd?`${sd.lbl} <b style="color:${sd.d>=0?"#8ef0b0":"var(--pink)"}">${sd.d>=0?"+":""}${sd.d.toLocaleString()}</b>`:"";
  $("#cause").textContent=trueEnd?"종단 재머를 끊고 신호를 넘겼다":won?"":"사인: "+(G.lastHit||"—");
  let bh="";for(const k in G.w){const ev=EVOS.find(e=>e.w===k&&G.evo[e.id]);
    bh+=`<span class="wchip" style="--c:${WEAPONS[k].c}"><b>${ev?ev.n:WEAPONS[k].n}</b> ${ev?"MAX":"Lv"+G.lvls[k]}</span>`;}
  for(const k in PASSIVES)if(G.lvls[k])bh+=`<span class="wchip" style="--c:${PASSIVES[k].c}">${PASSIVES[k].n} ${G.lvls[k]}</span>`;
  $("#build").innerHTML=bh;
  showVeil("#v-over");}

/* 데일리 시드 + 짧은 판 + 자랑할 숫자까지 갖춰 놓고 자랑할 수단만 없었다. */
/* 채운 블록 = 그 30초를 신호권 안에서 싸웠다. 이 게임의 실력 축이 그것이라
   막대 하나로 판의 성격이 드러난다. 점수만 있는 공유물은 안 해본 사람에게
   아무 의미가 없다 — 39,935가 잘한 건지 못한 건지 알 수가 없다. */
function shareBar(){
  const seg=G.seg.filter(x=>x&&x.tot>.5);
  if(!seg.length)return{bar:"",zp:0};
  const N=Math.min(8,seg.length),out=[];let ai=0,at=0;
  for(let i=0;i<N;i++){
    const a=Math.floor(i*seg.length/N), b=Math.max(a+1,Math.floor((i+1)*seg.length/N));
    let inn=0,tot=0;
    for(let j=a;j<b;j++){inn+=seg[j].in;tot+=seg[j].tot;}
    ai+=inn;at+=tot;
    out.push(tot&&inn/tot>=.55?"▰":"▱");
  }
  return{bar:out.join(""),zp:at?Math.round(100*ai/at):0};
}
function shareText(){
  const t=Math.floor(G.t), FN={rover:"기동계",warden:"방어계",pulse:"공진계",none:"순수"};
  const mm=Math.floor(t/60)+":"+String(t%60).padStart(2,"0");
  const sb=shareBar(), sc=calcScore(), sd=scoreDelta();
  const L=["RELAY #"+SEED+" · "+MOD.n];
  if(sb.bar)L.push(sb.bar+"  신호권 "+sb.zp+"%");
  L.push(G.ended?"종단 재머 격파":mm+"에 끊김");
  L.push((PROF.nick||"오퍼레이터")+" · "+charOf().n+(G.form?" / "+(FN[G.form]||""):"")+" · LV"+G.p.lv);
  L.push(sc.toLocaleString()+"점"+(G.rank?" · 오늘 "+G.rank+"위":"")+" · "+G.kills.toLocaleString()+"처치");
  if(sd)L.push(sd.lbl+" "+(sd.d>=0?"+":"")+sd.d.toLocaleString());
  L.push(location.origin+location.pathname);
  return L.join(String.fromCharCode(10));
}
